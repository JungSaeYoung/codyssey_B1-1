> </span>linked,<span class=\"w\"> </span>interpreter<span class=\"w\"> </span>/lib64/ld-linux-x86-64.so.2,\n<span class=\"w\">               </span><span class=\"k\">for</span><span class=\"w\"> </span>GNU/Linux<span class=\"w\"> </span><span class=\"m\">3</span>.2.0,<span class=\"w\"> </span>BuildID<span class=\"o\">[</span>sha1<span class=\"o\">]=</span>3d4132e6...,\n<span class=\"w\">               </span>stripped\n</code></pre></div>\n\n<h3 id=\"_7\">한 줄에 알 수 있는 것<a class=\"headerlink\" href=\"#_7\" title=\"Permanent link\">#</a></h3>\n<table>\n<thead>\n<tr>\n<th>항목</th>\n<th>값</th>\n<th>의미</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>ELF 64-bit</td>\n<td>✓</td>\n<td>리눅스용 실행 파일</td>\n</tr>\n<tr>\n<td>x86-64</td>\n<td>✓</td>\n<td>인텔/AMD 64비트 (Apple Silicon 직접 실행 불가, Rosetta 필요)</td>\n</tr>\n<tr>\n<td>dynamically linked</td>\n<td>✓</td>\n<td>라이브러리를 런타임에 동적 로드 (단독 실행 X)</td>\n</tr>\n<tr>\n<td>interpreter /lib64/ld-linux-x86-64.so.2</td>\n<td>✓</td>\n<td>glibc 동적 링커 사용</td>\n</tr>\n<tr>\n<td>GNU/Linux 3.2.0</td>\n<td>✓</td>\n<td>매우 오래된 커널까지 호환 (특이사항 아님)</td>\n</tr>\n<tr>\n<td><strong>stripped</strong></td>\n<td>✓</td>\n<td><strong>심볼 정보 제거됨</strong> — 함수/변수 이름 안 보임</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"_8\">이 단계에서 멈출 수 있는 경우<a class=\"headerlink\" href=\"#_8\" title=\"Permanent link\">#</a></h3>\n<ul>\n<li>\"이 게 ELF 인지만 확인하고 싶었다\" → 끝.</li>\n<li>의심스러운 파일이 ELF 가 아니라 ZIP/script 면 다른 접근으로 분기.</li>\n</ul>\n<p>→ 우리는 다음 층으로.</p>\n<hr />\n<h2 id=\"3-layer-2-elf\">3. Layer 2 — ELF 구조<a class=\"headerlink\" href=\"#3-layer-2-elf\" title=\"Permanent link\">#</a></h2>\n<h3 id=\"_9\">질문<a class=\"headerlink\" href=\"#_9\" title=\"Permanent link\">#</a></h3>\n<blockquote>\n<p>이 바이너리는 얼마나 크고, 코드와 데이터 비율이 어떻게 되나? 비정상적으로 큰 섹션은 없나?</p>\n</blockquote>\n<h3 id=\"_10\">도구<a class=\"headerlink\" href=\"#_10\" title=\"Permanent link\">#</a></h3>\n<ul>\n<li><code>readelf -S binary</code> — 섹션 헤더 목록</li>\n<li>Python <code>elftools</code> (<code>pip install pyelftools</code>)</li>\n<li><code>objdump -h binary</code> — 비슷한 정보</li>\n</ul>\n<h3 id=\"_11\">실행<a class=\"headerlink\" href=\"#_11\" title=\"Permanent link\">#</a></h3>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"kn\">from</span><span class=\"w\"> </span><span class=\"nn\">elftools.elf.elffile</span><span class=\"w\"> </span><span class=\"kn\">import</span> <span class=\"n\">ELFFile</span>\n<span class=\"k\">with</span> <span class=\"nb\">open</span><span class=\"p\">(</span><span class=\"s1\">&#39;bin/agent-app&#39;</span><span class=\"p\">,</span> <span class=\"s1\">&#39;rb&#39;</span><span class=\"p\">)</span> <span class=\"k\">as</span> <span class=\"n\">f</span><span class=\"p\">:</span>\n    <span class=\"n\">elf</span> <span class=\"o\">=</span> <span class=\"n\">ELFFile</span><span class=\"p\">(</span><span class=\"n\">f</span><span class=\"p\">)</span>\n    <span class=\"n\">sections</span> <span class=\"o\">=</span> <span class=\"nb\">sorted</span><span class=\"p\">(</span><span class=\"n\">elf</span><span class=\"o\">.</span><span class=\"n\">iter_sections</span><span class=\"p\">(),</span> <span class=\"n\">key</span><span class=\"o\">=</span><span class=\"k\">lambda</span> <span class=\"n\">s</span><span class=\"p\">:</span> <span class=\"n\">s</span><span class=\"o\">.</span><span class=\"n\">data_size</span><span class=\"p\">,</span> <span class=\"n\">reverse</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">)</span>\n    <span class=\"k\">for</span> <span class=\"n\">s</span> <span class=\"ow\">in</span> <span class=\"n\">sections</span><span class=\"p\">[:</span><span class=\"mi\">8</span><span class=\"p\">]:</span>\n        <span class=\"nb\">print</span><span class=\"p\">(</span><span class=\"sa\">f</span><span class=\"s2\">&quot;</span><span class=\"si\">{</span><span class=\"n\">s</span><span class=\"o\">.</span><span class=\"n\">name</span><span class=\"si\">:</span><span class=\"s2\">&lt;20</span><span class=\"si\">}{</span><span class=\"n\">s</span><span class=\"o\">.</span><span class=\"n\">data_size</span><span class=\"si\">:</span><span class=\"s2\">&gt;10</span><span class=\"si\">}</span><span class=\"s2\"> bytes&quot;</span><span class=\"p\">)</span>\n</code></pre></div>\n\n<h3 id=\"_12\">결과<a class=\"headerlink\" href=\"#_12\" title=\"Permanent link\">#</a></h3>\n<div class=\"codehilite\"><pre><span></span><code>pydata             7,862,008 bytes   ← 7.86 MB! 전체의 99%\n.text                 34,946 bytes   ← 실제 기계어 코드는 34 KB 뿐\n.bss                  16,560 bytes\n.rodata                9,809 bytes\n.eh_frame              5,520 bytes\n.dynsym                2,064 bytes\n.rela.plt              1,944 bytes\n.plt                   1,312 bytes\n</code></pre></div>\n\n<h3 id=\"_13\">진단<a class=\"headerlink\" href=\"#_13\" title=\"Permanent link\">#</a></h3>\n<p><strong>비정상적인 신호 두 가지가 동시에 보인다:</strong></p>\n<ol>\n<li><code>pydata</code> 라는 <strong>표준 ELF 가 아닌 사용자 정의 섹션</strong> 이 존재</li>\n<li>실제 코드(<code>.text</code>)는 35 KB 인데 데이터가 7.86 MB → <strong>데이터가 코드의 220배</strong></li>\n</ol>\n<p>→ \"이 바이너리는 평범한 컴파일 결과가 아니다. 뭔가 <strong>묶인 페이로드(packaged payload)</strong> 가 있다.\" 라는 가설이 선다. <code>pydata</code> 이름 자체가 결정적 단서 — <strong>PyInstaller</strong> 가 사용하는 섹션명.</p>\n<p>다음 층에서 의심을 확정한다.</p>\n<hr />\n<h2 id=\"4-layer-3\">4. Layer 3 — 의존 라이브러리<a class=\"headerlink\" href=\"#4-layer-3\" title=\"Permanent link\">#</a></h2>\n<h3 id=\"_14\">질문<a class=\"headerlink\" href=\"#_14\" title=\"Permanent link\">#</a></h3>\n<blockquote>\n<p>이 바이너리가 실행되려면 어떤 .so 파일들이 필요한가? (= 어떤 기능을 쓰는가의 1차 단서)</p>\n</blockquote>\n<h3 id=\"_15\">도구<a class=\"headerlink\" href=\"#_15\" title=\"Permanent link\">#</a></h3>\n<ul>\n<li><code>ldd binary</code> — 동적 링커가 해결한 의존 (Linux 위에서만 가능)</li>\n<li><code>readelf -d binary</code> — DT_NEEDED 항목 (모든 OS 에서 가능, 추천)</li>\n<li>pyelftools <code>DynamicSection.iter_tags()</code></li>\n</ul>\n<h3 id=\"_16\">실행<a class=\"headerlink\" href=\"#_16\" title=\"Permanent link\">#</a></h3>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"kn\">from</span><span class=\"w\"> </span><span class=\"nn\">elftools.elf.dynamic</span><span class=\"w\"> </span><span class=\"kn\">import</span> <span class=\"n\">DynamicSection</span>\n<span class=\"k\">for</span> <span class=\"n\">sec</span> <span class=\"ow\">in</span> <span class=\"n\">elf</span><span class=\"o\">.</span><span class=\"n\">iter_sections</span><span class=\"p\">():</span>\n    <span class=\"k\">if</span> <span class=\"nb\">isinstance</span><span class=\"p\">(</span><span class=\"n\">sec</span><span class=\"p\">,</span> <span class=\"n\">DynamicSection</span><span class=\"p\">):</span>\n        <span class=\"k\">for</span> <span class=\"n\">tag</span> <span class=\"ow\">in</span> <span class=\"n\">sec</span><span class=\"o\">.</span><span class=\"n\">iter_tags</span><span class=\"p\">():</span>\n            <span class=\"k\">if</span> <span class=\"n\">tag</span><span class=\"o\">.</span><span class=\"n\">entry</span><span class=\"o\">.</span><span class=\"n\">d_tag</span> <span class=\"o\">==</span> <span class=\"s2\">&quot;DT_NEEDED&quot;</span><span class=\"p\">:</span>\n                <span class=\"nb\">print</span><span class=\"p\">(</span><span class=\"n\">tag</span><span class=\"o\">.</span><span class=\"n\">needed</span><span class=\"p\">)</span>\n</code></pre></div>\n\n<h3 id=\"_17\">결과<a class=\"headerlink\" href=\"#_17\" title=\"Permanent link\">#</a></h3>\n<div class=\"codehilite\"><pre><span></span><code>libdl.so.2            ← dlopen/dlsym — 동적 라이브러리 로딩\nlibz.so.1             ← zlib 압축\nlibpthread.so.0       ← POSIX 스레드\nlibc.so.6             ← C 표준 라이브러리\nINTERPRETER: /lib64/ld-linux-x86-64.so.2\n</code></pre></div>\n\n<h3 id=\"_18\">진단<a class=\"headerlink\" href=\"#_18\" title=\"Permanent link\">#</a></h3>\n<ul>\n<li>외부 의존이 4개뿐 — 적다. 그런데 <strong><code>libdl</code> 이 있다</strong> = 런타임에 다른 .so 를 동적으로 불러올 수 있음. PyInstaller bootloader 가 내부 번들 .so 를 dlopen 으로 로드하는 패턴과 정확히 일치.</li>\n<li>libpython, libssl, libcrypto 같은 게 <strong>외부 의존에 안 보임</strong> → 그건 어딘가에 <strong>번들로 들어가 있다</strong>는 뜻.</li>\n<li>의심 → 확정으로 한 발 더.</li>\n</ul>\n<hr />\n<h2 id=\"5-layer-4\">5. Layer 4 — 안에 든 문자열<a class=\"headerlink\" href=\"#5-layer-4\" title=\"Permanent link\">#</a></h2>\n<h3 id=\"_19\">질문<a class=\"headerlink\" href=\"#_19\" title=\"Permanent link\">#</a></h3>\n<blockquote>\n<p>사용자에게 보일 메시지, 환경변수 이름, 에러 문구 등이 노출되어 있는가?</p>\n</blockquote>\n<h3 id=\"_20\">도구<a class=\"headerlink\" href=\"#_20\" title=\"Permanent link\">#</a></h3>\n<ul>\n<li><code>strings binary</code> — 4 바이트 이상 ASCII 시퀀스 출력</li>\n<li><code>strings -e l binary</code> — UTF-16LE 도 같이 (Windows 바이너리 분석 시)</li>\n<li>Python 정규식 — 카테고리별 필터링</li>\n</ul>\n<h3 id=\"_21\">실행<a class=\"headerlink\" href=\"#_21\" title=\"Permanent link\">#</a></h3>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"kn\">import</span><span class=\"w\"> </span><span class=\"nn\">re</span>\n<span class=\"n\">blob</span> <span class=\"o\">=</span> <span class=\"sa\">b</span><span class=\"s2\">&quot;&quot;</span>\n<span class=\"k\">for</span> <span class=\"n\">sname</span> <span class=\"ow\">in</span> <span class=\"p\">(</span><span class=\"s2\">&quot;.rodata&quot;</span><span class=\"p\">,</span> <span class=\"s2\">&quot;.data&quot;</span><span class=\"p\">,</span> <span class=\"s2\">&quot;.data.rel.ro&quot;</span><span class=\"p\">,</span> <span class=\"s2\">&quot;.text&quot;</span><span class=\"p\">,</span> <span class=\"s2\">&quot;pydata&quot;</span><span class=\"p\">):</span>\n    <span class=\"n\">s</span> <span class=\"o\">=</span> <span class=\"n\">elf</span><span class=\"o\">.</span><span class=\"n\">get_section_by_name</span><span class=\"p\">(</span><span class=\"n\">sname</span><span class=\"p\">)</span>\n    <span class=\"k\">if</span> <span class=\"n\">s</span><span class=\"p\">:</span> <span class=\"n\">blob</span> <span class=\"o\">+=</span> <span class=\"n\">s</span><span class=\"o\">.</span><span class=\"n\">data</span><span class=\"p\">()</span>\n<span class=\"n\">strings</span> <span class=\"o\">=</span> <span class=\"n\">re</span><span class=\"o\">.</span><span class=\"n\">findall</span><span class=\"p\">(</span><span class=\"sa\">rb</span><span class=\"s2\">&quot;[\\x20-\\x7e]{8,}&quot;</span><span class=\"p\">,</span> <span class=\"n\">blob</span><span class=\"p\">)</span>\n</code></pre></div>\n\n<h3 id=\"_22\">결과 — 흥미로운 발견<a class=\"headerlink\" href=\"#_22\" title=\"Permanent link\">#</a></h3>\n<table>\n<thead>\n<tr>\n<th>카테고리</th>\n<th>발견된 문자열</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>PyInstaller 단서</td>\n<td><code>LOADER:</code>, <code>SPLASH:</code>, <code>_MEIPASS</code>, <code>pyi_rth_*</code>, <code>PyInstaller</code></td>\n</tr>\n<tr>\n<td>번들 .so 이름</td>\n<td><code>libpython3.12.so.1.0</code>, <code>libssl.so.3</code>, <code>libcrypto.so.3</code>, <code>libbz2.so.1.0</code>, <code>liblzma.so.5</code></td>\n</tr>\n<tr>\n<td>표준 라이브러리</td>\n<td><code>socket</code>, <code>subprocess</code>, <code>signal</code>, <code>threading</code>, <code>logging</code>, <code>argparse</code>, <code>datetime</code>, <code>http</code>, <code>pathlib</code>, <code>json</code></td>\n</tr>\n<tr>\n<td>Python 모듈 추정</td>\n<td><code>_ssl</code>, <code>_hashlib</code>, <code>_lzma</code>, <code>_bz2</code>, <code>_codecs_kr</code>, <code>_decimal</code></td>\n</tr>\n<tr>\n<td>컴파일러 단서</td>\n<td><code>GCC: (Ubuntu 7.5.0-3ubuntu1~18.04) 7.5.0</code></td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"_23\">진단<a class=\"headerlink\" href=\"#_23\" title=\"Permanent link\">#</a></h3>\n<p>이 한 층만으로 다음이 거의 확정된다:</p>\n<ul>\n<li><strong>Python 3.12</strong> 가 통째로 번들됨 (<code>libpython3.12.so.1.0</code>)</li>\n<li><strong>SSL/TLS 통신 기능 보유</strong> (<code>libssl</code>, <code>libcrypto</code>, <code>_ssl</code>, <code>_hashlib</code>)</li>\n<li><strong>한국어 처리 가능성</strong> (<code>_codecs_kr</code> — Python 의 EUC-KR 코덱)</li>\n<li><strong>HTTP 서버 또는 클라이언트</strong> (<code>http</code> 모듈)</li>\n<li><strong>subprocess</strong> 로 외부 명령 실행 가능</li>\n<li>bootloader 는 Ubuntu 18.04 GCC 7.5 로 빌드됨</li>\n</ul>\n<h3 id=\"loader\">핵심 — <code>LOADER:</code> 가 의미하는 것<a class=\"headerlink\" href=\"#loader\" title=\"Permanent link\">#</a></h3>\n<p>PyInstaller 의 C 부트로더는 다음 단계로 동작한다:</p>\n<div class=\"codehilite\"><pre><span></span><code>[main 시작]\n  → LOADER: &quot;Cannot open self %s&quot; 같은 에러 메시지가 .rodata 에 박힘\n  → 자기 자신을 열어 pydata 섹션 위치 찾기\n  → pydata 안 archive 의 TOC 파싱\n  → libpython3.12.so.1.0 을 임시 디렉토리(_MEIPASS)에 풀어 dlopen\n  → Python interpreter 초기화\n  → 번들된 .pyc 들을 import\n  → 진입 스크립트(linux_pbl_v2) 실행\n</code></pre></div>\n\n<p>이 흐름을 알면 <code>_MEIPASS</code>, <code>LOADER:</code>, <code>SPLASH:</code> 같은 문자열이 보일 때 PyInstaller 라고 즉시 확신할 수 있다.</p>\n<hr />\n<h2 id=\"6-layer-5-api\">6. Layer 5 — 호출하는 API<a class=\"headerlink\" href=\"#6-layer-5-api\" title=\"Permanent link\">#</a></h2>\n<h3 id=\"_24\">질문<a class=\"headerlink\" href=\"#_24\" title=\"Permanent link\">#</a></h3>\n<blockquote>\n<p>이 프로그램이 실제로 어떤 libc 함수를 호출하는가? (= 무엇을 할 수 있는가)</p>\n</blockquote>\n<h3 id=\"_25\">도구<a class=\"headerlink\" href=\"#_25\" title=\"Permanent link\">#</a></h3>\n<ul>\n<li><code>nm -D binary</code> — 동적 심볼 테이블 (외부 의존 함수)</li>\n<li><code>readelf --dyn-syms binary</code></li>\n<li>pyelftools <code>SymbolTableSection</code></li>\n</ul>\n<h3 id=\"_26\">실행 결과 — 카테고리별 분류<a class=\"headerlink\" href=\"#_26\" title=\"Permanent link\">#</a></h3>\n<div class=\"codehilite\"><pre><span></span><code>🌐 네트워크\n   (없음 — PyInstaller 부트로더는 네트워크 직접 호출 X. 실제 통신은 번들 Python 안에서)\n\n📂 파일 I/O\n   open, read, write, close, fopen, fread, fwrite, fclose\n   opendir, readdir, closedir, readlink, stat, access\n\n👤 계정/권한\n   (없음 — Python uid 체크는 번들 코드 안)\n\n🌎 환경변수\n   getenv\n\n🔔 시그널\n   signal\n\n📝 출력\n   fprintf, perror\n\n🧮 문자열\n   strcmp, strncmp, strstr\n\n💾 메모리\n   malloc, free\n\n🚀 프로세스\n   fork, execvp, waitpid    ← 자식 프로세스 spawn 가능!\n</code></pre></div>\n\n<h3 id=\"_27\">진단<a class=\"headerlink\" href=\"#_27\" title=\"Permanent link\">#</a></h3>\n<ul>\n<li>직접 노출된 API 는 <strong>PyInstaller bootloader 가 쓰는 것</strong> 들. 실제 비즈니스 로직은 모두 번들된 .pyc 안.</li>\n<li>그래도 <code>fork/execvp/waitpid</code> 가 있다는 건 부트로더가 임시 디렉토리에 .so 풀고 새 프로세스로 다시 실행하는 PyInstaller 패턴과 일치.</li>\n<li>\"실제 agent-app 이 무엇을 하는가\" 를 알려면 <strong>bundled .pyc 를 추출해야 한다</strong>.</li>\n</ul>\n<hr />\n<h2 id=\"7-layer-6-pyinstaller\">7. Layer 6 — PyInstaller 아카이브 구조<a class=\"headerlink\" href=\"#7-layer-6-pyinstaller\" title=\"Permanent link\">#</a></h2>\n<h3 id=\"_28\">질문<a class=\"headerlink\" href=\"#_28\" title=\"Permanent link\">#</a></h3>\n<blockquote>\n<p><code>pydata</code> 섹션 안의 PyInstaller archive 를 직접 들여다보자. 어떤 파일들이 들어 있나?</p>\n</blockquote>\n<h3 id=\"pyinstaller-archive\">PyInstaller archive 포맷 (간단히)<a class=\"headerlink\" href=\"#pyinstaller-archive\" title=\"Permanent link\">#</a></h3>\n<div class=\"codehilite\"><pre><span></span><code>[ELF .pydata 섹션 시작]\n  ┌───────────────────────────────┐\n  │ 1) Bundled files (zlib 압축)   │   각 파일이 압축돼 연속 배치\n  │ 2) TOC (Table of Contents)     │   파일 목록 + 오프셋/길이\n  │ 3) Cookie + Header             │   MEI\\x0c\\x0b\\x0a\\x0b\\x0e 매직 +\n  │                                │   archive 총 길이, TOC offset/length, Python 버전\n  └───────────────────────────────┘\n[파일 끝]\n</code></pre></div>\n\n<h3 id=\"_29\">도구<a class=\"headerlink\" href=\"#_29\" title=\"Permanent link\">#</a></h3>\n<ul>\n<li><code>pyinstxtractor</code> (pip install pyinstxtractor) — 자동 추출</li>\n<li>Python 직접 파싱 — 학습 목적</li>\n</ul>\n<h3 id=\"_30\">직접 파싱 예시<a class=\"headerlink\" href=\"#_30\" title=\"Permanent link\">#</a></h3>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"kn\">import</span><span class=\"w\"> </span><span class=\"nn\">struct</span>\n<span class=\"n\">data</span> <span class=\"o\">=</span> <span class=\"nb\">open</span><span class=\"p\">(</span><span class=\"s1\">&#39;bin/agent-app&#39;</span><span class=\"p\">,</span><span class=\"s1\">&#39;rb&#39;</span><span class=\"p\">)</span><span class=\"o\">.</span><span class=\"n\">read</span><span class=\"p\">()</span>\n<span class=\"n\">COOKIE</span> <span class=\"o\">=</span> <span class=\"sa\">b</span><span class=\"s1\">&#39;MEI</span><span class=\"se\">\\x0c\\x0b\\x0a\\x0b\\x0e</span><span class=\"s1\">&#39;</span>\n<span class=\"n\">ci</span> <span class=\"o\">=</span> <span class=\"n\">data</span><span class=\"o\">.</span><span class=\"n\">rfind</span><span class=\"p\">(</span><span class=\"n\">COOKIE</span><span class=\"p\">)</span>\n\n<span class=\"n\">length</span>     <span class=\"o\">=</span> <span class=\"n\">struct</span><span class=\"o\">.</span><span class=\"n\">unpack</span><span class=\"p\">(</span><span class=\"s1\">&#39;&gt;I&#39;</span><span class=\"p\">,</span> <span class=\"n\">data</span><span class=\"p\">[</span><span class=\"n\">ci</span><span class=\"o\">+</span> <span class=\"mi\">8</span><span class=\"p\">:</span><span class=\"n\">ci</span><span class=\"o\">+</span><span class=\"mi\">12</span><span class=\"p\">])[</span><span class=\"mi\">0</span><span class=\"p\">]</span>\n<span class=\"n\">toc_offset</span> <span class=\"o\">=</span> <span class=\"n\">struct</span><span class=\"o\">.</span><span class=\"n\">unpack</span><span class=\"p\">(</span><span class=\"s1\">&#39;&gt;I&#39;</span><span class=\"p\">,</span> <span class=\"n\">data</span><span class=\"p\">[</span><span class=\"n\">ci</span><span class=\"o\">+</span><span class=\"mi\">12</span><span class=\"p\">:</span><span class=\"n\">ci</span><span class=\"o\">+</span><span class=\"mi\">16</span><span class=\"p\">])[</span><span class=\"mi\">0</span><span class=\"p\">]</span>\n<span class=\"n\">toc_length</span> <span class=\"o\">=</span> <span class=\"n\">struct</span><span class=\"o\">.</span><span class=\"n\">unpack</span><span class=\"p\">(</span><span class=\"s1\">&#39;&gt;I&#39;</span><span class=\"p\">,</span> <span class=\"n\">data</span><span class=\"p\">[</span><span class=\"n\">ci</span><span class=\"o\">+</span><span class=\"mi\">16</span><span class=\"p\">:</span><span class=\"n\">ci</span><span class=\"o\">+</span><span class=\"mi\">20</span><span class=\"p\">])[</span><span class=\"mi\">0</span><span class=\"p\">]</span>\n<span class=\"n\">py_ver</span>     <span class=\"o\">=</span> <span class=\"n\">struct</span><span class=\"o\">.</span><span class=\"n\">unpack</span><span class=\"p\">(</span><span class=\"s1\">&#39;&gt;I&#39;</span><span class=\"p\">,</span> <span class=\"n\">data</span><span class=\"p\">[</span><span class=\"n\">ci</span><span class=\"o\">+</span><span class=\"mi\">20</span><span class=\"p\">:</span><span class=\"n\">ci</span><span class=\"o\">+</span><span class=\"mi\">24</span><span class=\"p\">])[</span><span class=\"mi\">0</span><span class=\"p\">]</span>\n\n<span class=\"nb\">print</span><span class=\"p\">(</span><span class=\"sa\">f</span><span class=\"s2\">&quot;Python </span><span class=\"si\">{</span><span class=\"n\">py_ver</span><span class=\"w\"> </span><span class=\"o\">//</span><span class=\"w\"> </span><span class=\"mi\">100</span><span class=\"si\">}</span><span class=\"s2\">.</span><span class=\"si\">{</span><span class=\"n\">py_ver</span><span class=\"w\"> </span><span class=\"o\">%</span><span class=\"w\"> </span><span class=\"mi\">100</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span><span class=\"p\">)</span>\n<span class=\"c1\"># → &quot;Python 3.12&quot;</span>\n</code></pre></div>\n\n<h3 id=\"_31\">결과<a class=\"headerlink\" href=\"#_31\" title=\"Permanent link\">#</a></h3>\n<div class=\"codehilite\"><pre><span></span><code>PyInstaller cookie position: 0x78e979\n아카이브 길이      : 7,862,008 bytes\nTOC offset        : 0x77ee80\nTOC length        : 2,080 bytes\nPython 버전 인덱스 : 312  →  Python 3.12\n</code></pre></div>\n\n<h3 id=\"toc\">TOC 안의 항목들 (스캔)<a class=\"headerlink\" href=\"#toc\" title=\"Permanent link\">#</a></h3>\n<div class=\"codehilite\"><pre><span></span><code>── 진입 스크립트 (typecode &#39;s&#39;) ──\n  s  linux_pbl_v2        ← 메인 엔트리포인트\n  s  pyi_rth_inspect     ← runtime hook\n  s  pyiboot01_bootstrap ← PyInstaller 부트스트랩\n\n── 번들 라이브러리 (typecode &#39;b&#39;) ──\n  b  libpython3.12.so.1.0\n  b  libssl.so.3\n  b  libcrypto.so.3\n  b  libbz2.so.1.0\n  b  liblzma.so.5\n  b  libz.so.1\n  b  python3.12/lib-dynload/_ssl.cpython-312-x86_64-linux-gnu.so\n  b  python3.12/lib-dynload/_hashlib.cpython-312-x86_64-linux-gnu.so\n  b  python3.12/lib-dynload/_lzma.cpython-312-x86_64-linux-gnu.so\n  b  python3.12/lib-dynload/_bz2.cpython-312-x86_64-linux-gnu.so\n  b  python3.12/lib-dynload/_codecs_kr.cpython-312-x86_64-linux-gnu.so\n  ... (한국어/일본어/중국어 코덱 다수)\n  b  python3.12/lib-dynload/_decimal.cpython-312-x86_64-linux-gnu.so\n  b  python3.12/lib-dynload/_contextvars.cpython-312-x86_64-linux-gnu.so\n\n── 데이터 (typecode &#39;d&#39;) ──\n  d  base_library.zip   ← Python 표준 라이브러리 압축\n  d  pyi-contents-d     ← PyInstaller 메타데이터\n</code></pre></div>\n\n<h3 id=\"_32\">진단 — 핵심 발견<a class=\"headerlink\" href=\"#_32\" title=\"Permanent link\">#</a></h3>\n<ul>\n<li><strong><code>linux_pbl_v2</code></strong> 가 메인 진입 스크립트. 이름에서 추측:</li>\n<li><code>linux_</code> : 리눅스 전용</li>\n<li><code>pbl_</code> : Platform Boot Loader / Probe / Process Bot Listener 가능성</li>\n<li><code>_v2</code> : 버전 2</li>\n<li><code>_codecs_kr</code> 가 번들된 건 의외 — 한국어 텍스트 처리 의도가 있다는 신호 (Codyssey 미션이라서 자연스러움)</li>\n<li><code>_ssl</code> + <code>_hashlib</code> 가 함께 있는 건 <strong>HTTPS 호출 + 서명/해시 검증</strong> 패턴</li>\n</ul>\n<hr />\n<h2 id=\"8-layer-7\">8. Layer 7 — 바이트코드 디컴파일 (가장 깊은 층)<a class=\"headerlink\" href=\"#8-layer-7\" title=\"Permanent link\">#</a></h2>\n<h3 id=\"_33\">질문<a class=\"headerlink\" href=\"#_33\" title=\"Permanent link\">#</a></h3>\n<blockquote>\n<p><code>linux_pbl_v2</code> 의 실제 Python 소스가 어떻게 생겼나?</p>\n</blockquote>\n<h3 id=\"8-1\">8-1. 두 단계로 진행<a class=\"headerlink\" href=\"#8-1\" title=\"Permanent link\">#</a></h3>\n<div class=\"codehilite\"><pre><span></span><code>[Step A] PyInstaller archive 풀기 → .pyc 파일 32개 추출\n              ↓\n[Step B] .pyc 디컴파일 또는 메타데이터 추출 → Python 소스 복원\n</code></pre></div>\n\n<h3 id=\"8-2-step-a\">8-2. Step A — 아카이브 추출<a class=\"headerlink\" href=\"#8-2-step-a\" title=\"Permanent link\">#</a></h3>\n<p><code>pyinstxtractor</code> 가 PyPI 에 없는 경우(2026 기준), 본 저장소의 <a href=\"../../tools/extract_pyinstaller.py\">tools/extract_pyinstaller.py</a> 사용:</p>\n<div class=\"codehilite\"><pre><span></span><code>python<span class=\"w\"> </span>tools/extract_pyinstaller.py\n</code></pre></div>\n\n<p>출력:</p>\n<div class=\"codehilite\"><pre><span></span><code>== agent-app (pydata @ file offset 0xf2d9) ==\n  archive 길이 : 7,862,008 bytes\n  TOC pos      : 0x77ee80 (archive 내부)\n  TOC len      : 2080 bytes\n  Python 버전  : 3.12\n  python lib   : libpython3.12.so.1.0\n  TOC 항목 수  : 32\n\n== 추출 완료 ==\n  b (binary): 23      ← libpython, libssl, *.cpython-312-*.so 등\n  m (module): 4       ← pyimod01_archive, pyimod02_importers, ...\n  o (option): 1\n  s (script): 3       ← linux_pbl_v2, pyi_rth_inspect, pyiboot01_bootstrap\n  z (PYZ):    1       ← base_library.zip + Python stdlib 컴파일된 모음\n</code></pre></div>\n\n<p>→ <code>bin/agent-app_extracted/linux_pbl_v2.pyc</code> 가 우리가 찾던 파일 (19 KB).</p>\n<h3 id=\"8-3-step-b-pyc\">8-3. Step B — .pyc 디컴파일 한계<a class=\"headerlink\" href=\"#8-3-step-b-pyc\" title=\"Permanent link\">#</a></h3>\n<table>\n<thead>\n<tr>\n<th>디컴파일러</th>\n<th>지원 Python</th>\n<th>본 미션 적용 가능?</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>uncompyle6</code></td>\n<td>2.7 ~ 3.8</td>\n<td>❌</td>\n</tr>\n<tr>\n<td><code>decompyle3</code></td>\n<td>3.7 ~ 3.9</td>\n<td>❌</td>\n</tr>\n<tr>\n<td><code>pycdc</code> (C++ binary)</td>\n<td>1.0 ~ 3.12</td>\n<td>✅ (직접 빌드 필요)</td>\n</tr>\n<tr>\n<td><code>dis</code> + 수작업</td>\n<td>모두</td>\n<td>✅ (시간 듦)</td>\n</tr>\n<tr>\n<td><strong>메타데이터 추출 + 재구성</strong></td>\n<td>모두</td>\n<td>✅ <strong>본 문서가 택한 방법</strong></td>\n</tr>\n</tbody>\n</table>\n<p>본 미션의 <code>linux_pbl_v2.pyc</code> 는 Python 3.12 → uncompyle6/decompyle3 모두 미지원.\n실용적 우회법: <strong><code>marshal.load()</code> 로 code object 를 읽어 들인 뒤, 모든 중첩 code 의 <code>co_varnames</code> / <code>co_names</code> / <code>co_consts</code> / <code>co_argcount</code> 를 재귀로 덤프</strong>. 흐름 제어는 추정해야 하지만, 메서드 이름·시그니처·문자열 리터럴은 <strong>100% 정확</strong> 하게 복원된다.</p>\n<h3 id=\"8-4-toolsdecompile_metadatapy\">8-4. 메타데이터 디컴파일러 — <a href=\"../../tools/decompile_metadata.py\">tools/decompile_metadata.py</a><a class=\"headerlink\" href=\"#8-4-toolsdecompile_metadatapy\" title=\"Permanent link\">#</a></h3>\n<div class=\"codehilite\"><pre><span></span><code>python<span class=\"w\"> </span>tools/decompile_metadata.py\n</code></pre></div>\n\n<p>출력 일부:</p>\n<div class=\"codehilite\"><pre><span></span><code>┏━ MODULE: &lt;module&gt;  (line 1)\n┃  names: (&#39;os&#39;, &#39;sys&#39;, &#39;pwd&#39;, &#39;time&#39;, &#39;math&#39;, &#39;socket&#39;, &#39;logging&#39;,\n┃          &#39;RotatingFileHandler&#39;, &#39;BootValidator&#39;, &#39;ResourceStressor&#39;,\n┃          &#39;set_logger&#39;, &#39;validator&#39;, &#39;check_root_user&#39;,\n┃          &#39;check_env_config&#39;, &#39;check_required_files&#39;,\n┃          &#39;check_port_availability&#39;, &#39;check_log_permission&#39;, ...)\n┃  string constants:\n┃    &#39;&gt;&gt;&gt; Starting Agent Boot Sequence...&#39;\n┃    &#39;Agent Boot Check Failed. Process Terminated.&#39;\n┃    &#39;All Boot Checks Passed!&#39;\n┃    &#39;Agent READY&#39;\n\n  ┏━ method: BootValidator.check_env_config  (line 73)\n  ┃  sig: (self)  locals=14\n  ┃  string constants:\n  ┃    &#39;AGENT_HOME&#39;, &#39;AGENT_PORT&#39;, &#39;AGENT_UPLOAD_DIR&#39;, &#39;AGENT_KEY_PATH&#39;\n  ┃    &#39;Critical Env &#39;AGENT_HOME&#39; is missing.&#39;\n  ┃    &#39;upload_files&#39;, &#39;api_keys&#39;, &#39;t_secret.key&#39;\n  ┃    &#39;Port mismatch (Expected &#39;, &#39;, Got &#39;, &#39;)&#39;\n  ┃    &#39;agent_api_key_test&#39;\n  ┃  number constants: [1, 15034]\n</code></pre></div>\n\n<p><code>co_consts</code> 의 문자열만 봐도 코드가 <strong>무엇을 어떤 형식으로 검증/출력하는지</strong> 가 거의 그대로 드러난다.</p>\n<h3 id=\"8-5-linux_pbl_v2_reconstructedpy\">8-5. 재구성된 소스 — <a href=\"../../bin/agent-app_extracted/linux_pbl_v2_reconstructed.py\">linux_pbl_v2_reconstructed.py</a><a class=\"headerlink\" href=\"#8-5-linux_pbl_v2_reconstructedpy\" title=\"Permanent link\">#</a></h3>\n<p>추출한 메타데이터로 사람이 읽을 수 있는 Python 으로 재구성한 결과. 핵심 구조 요약:</p>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">BootValidator</span><span class=\"p\">:</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"fm\">__init__</span><span class=\"p\">(</span><span class=\"bp\">self</span><span class=\"p\">):</span>\n        <span class=\"bp\">self</span><span class=\"o\">.</span><span class=\"n\">steps_name</span> <span class=\"o\">=</span> <span class=\"p\">(</span>\n            <span class=\"s2\">&quot;Checking User Account&quot;</span><span class=\"p\">,</span>\n            <span class=\"s2\">&quot;Verifying Environment Variables&quot;</span><span class=\"p\">,</span>\n            <span class=\"s2\">&quot;Checking Required Files&quot;</span><span class=\"p\">,</span>\n            <span class=\"s2\">&quot;Checking Port Availability&quot;</span><span class=\"p\">,</span>\n            <span class=\"s2\">&quot;Verifying Log Permission&quot;</span><span class=\"p\">,</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">check_root_user</span><span class=\"p\">(</span><span class=\"bp\">self</span><span class=\"p\">):</span>         <span class=\"c1\"># [1/5] uid != 0</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">check_env_config</span><span class=\"p\">(</span><span class=\"bp\">self</span><span class=\"p\">):</span>        <span class=\"c1\"># [2/5] AGENT_*  5종 + 값 검증</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">check_required_files</span><span class=\"p\">(</span><span class=\"bp\">self</span><span class=\"p\">):</span>    <span class=\"c1\"># [3/5] 키 파일 내용 == &quot;agent_api_key_test&quot;</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">check_port_availability</span><span class=\"p\">(</span><span class=\"bp\">self</span><span class=\"p\">):</span> <span class=\"c1\"># [4/5] socket.connect_ex 로 점유 여부</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">check_log_permission</span><span class=\"p\">(</span><span class=\"bp\">self</span><span class=\"p\">):</span>    <span class=\"c1\"># [5/5] os.access(log_dir, W_OK)</span>\n\n<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">ResourceStressor</span><span class=\"p\">:</span>\n    <span class=\"n\">LIMIT_MEMORY_MB</span> <span class=\"o\">=</span> <span class=\"mi\">256</span>\n    <span class=\"n\">CHUNK_SIZE_MB</span>   <span class=\"o\">=</span> <span class=\"mi\">25</span>\n    <span class=\"n\">LIMIT_CPU_SEC</span>   <span class=\"o\">=</span> <span class=\"mi\">5</span>\n    <span class=\"n\">LIMIT_CPU_LEVEL</span> <span class=\"o\">=</span> <span class=\"mi\">10</span>\n\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"fm\">__init__</span><span class=\"p\">(</span><span class=\"bp\">self</span><span class=\"p\">,</span> <span class=\"n\">logger</span><span class=\"p\">,</span> <span class=\"n\">port</span><span class=\"o\">=</span><span class=\"mi\">15034</span><span class=\"p\">):</span>\n        <span class=\"n\">os</span><span class=\"o\">.</span><span class=\"n\">nice</span><span class=\"p\">(</span><span class=\"mi\">10</span><span class=\"p\">)</span>                    <span class=\"c1\"># 우선순위 낮춤 — 다른 프로세스 방해 최소화</span>\n\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">open_socket</span><span class=\"p\">(</span><span class=\"bp\">self</span><span class=\"p\">):</span>             <span class=\"c1\"># 0.0.0.0:15034 bind + listen(1)</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">increase_memory</span><span class=\"p\">(</span><span class=\"bp\">self</span><span class=\"p\">):</span>         <span class=\"c1\"># &#39;x&#39; * 1MB chunks 누적</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">occupy_cpu</span><span class=\"p\">(</span><span class=\"bp\">self</span><span class=\"p\">,</span> <span class=\"n\">level</span><span class=\"p\">):</span>       <span class=\"c1\"># sin/cos 100000*level 회 반복</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">rotate_cycle</span><span class=\"p\">(</span><span class=\"bp\">self</span><span class=\"p\">):</span>            <span class=\"c1\"># 메모리·CPU 사이클 (UP/DOWN 반복)</span>\n</code></pre></div>\n\n<h3 id=\"8-6-agent-app\">8-6. 큰 발견 — <code>agent-app</code> 의 진짜 정체<a class=\"headerlink\" href=\"#8-6-agent-app\" title=\"Permanent link\">#</a></h3>\n<p>본격 디컴파일을 통해 드러난 것: <strong>이 앱은 외부 통신이나 명령 실행이 아니라, 의도적으로 시스템 자원을 사이클로 사용하는 \"스트레서\"</strong>.</p>\n<div class=\"codehilite\"><pre><span></span><code>                  ┌─────────────────────────────────────────┐\n                  │  사이클 = UP phase  ↔  DOWN phase       │\n                  │                                          │\n   메모리:        │   0 ──→ 25 ──→ 50 ──→ ... ──→ 256 MB   │\n                  │                                  ↓       │\n                  │   256 ←── 231 ←── 206 ←── ... ←── 0 MB │\n                  │                                          │\n   CPU level:     │   0 ──→ 1 ──→ 2 ──→ ... ──→ 10 (sin/cos)│\n                  │                              ↓           │\n                  │   10 ←── 9 ←── ... ←── 0                │\n                  │                                          │\n   매 step:       │   sleep(1)                              │\n                  └─────────────────────────────────────────┘\n</code></pre></div>\n\n<p>즉, <strong>monitor.sh 가 \"관제할 데이터를 만드는 워크로드 생성기\"</strong> 였던 것. 미션 §6 의 \"[WARNING] CPU/MEM threshold exceeded\" 가 실제로 trigger 되는 이유.</p>\n<h3 id=\"8-7\">8-7. 발견의 의미 — 미션 설계 의도<a class=\"headerlink\" href=\"#8-7\" title=\"Permanent link\">#</a></h3>\n<table>\n<thead>\n<tr>\n<th>미션 요구사항</th>\n<th>왜 그렇게 만들었나 (코드로 검증됨)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>CPU 임계값 20%</td>\n<td>사이클 중 level 5~10 에서 자연히 초과 → WARNING 발생</td>\n</tr>\n<tr>\n<td>MEM 임계값 10%</td>\n<td>LIMIT_MEMORY_MB=256 + 시스템 메모리 비율로 초과</td>\n</tr>\n<tr>\n<td>키 파일 내용 정확 검증</td>\n<td>check_required_files 가 <code>==</code> 정확 비교 → 1 byte 만 달라도 부트 실패</td>\n</tr>\n<tr>\n<td>AGENT_PORT=15034 강제</td>\n<td>check_env_config 가 다른 값이면 <code>Port mismatch</code></td>\n</tr>\n<tr>\n<td>일반 계정 강제</td>\n<td>check_root_user 가 uid==0 시 즉시 sys.exit(1)</td>\n</tr>\n</tbody>\n</table>\n<p>이 발견 자체가 <strong>미션이 측정하려는 것</strong> 을 명확히 보여 준다 — \"스트레스가 발생하는 진짜 프로세스를 monitor.sh 로 측정·기록·경고\" 하는 능력.</p>\n<h3 id=\"_34\">이 단계까지 가야 하는가? (수정)<a class=\"headerlink\" href=\"#_34\" title=\"Permanent link\">#</a></h3>\n<p>원래 본 문서는 \"Layer 6 까지로 충분\" 이라 했지만, 위 발견 덕분에 시각이 바뀐다:</p>\n<ul>\n<li><strong>운영/채점 관점</strong>: Layer 4~5 (어떤 모듈 쓰나) 까지면 충분</li>\n<li><strong>학습 관점</strong>: Layer 7 까지 가면 미션 설계 의도를 만나는 보너스</li>\n<li><strong>재배포·수정 목적</strong>: ❌ (라이센스 위반)</li>\n</ul>\n<hr />\n<h2 id=\"9-agent-app\">9. 종합 — <code>agent-app</code> 의 추정 아키텍처<a class=\"headerlink\" href=\"#9-agent-app\" title=\"Permanent link\">#</a></h2>\n<p>7 단계 분석을 종합하면 다음 그림이 나온다.</p>\n<div class=\"codehilite\"><pre><span></span><code>┌─────────────────────────────────────────────────────────────────┐\n│  agent-app (PyInstaller single-file ELF, Python 3.12)           │\n│                                                                  │\n│  [기동]                                                          │\n│   1. ELF 진입 → PyInstaller C bootloader 실행                    │\n│   2. 자기 자신에서 pydata 섹션 읽어 archive 추출                 │\n│   3. /tmp/_MEIxxxxxx/ 에 .so 와 base_library.zip 풀기            │\n│   4. libpython3.12.so.1.0 을 dlopen                              │\n│   5. Python 인터프리터 초기화                                    │\n│   6. linux_pbl_v2.pyc 실행                                       │\n│                                                                  │\n│  [본체 — linux_pbl_v2 추정]                                      │\n│   • 환경변수 검증 (AGENT_HOME, AGENT_PORT, AGENT_KEY_PATH ...)   │\n│   • 키 파일 검증 (agent_api_key_test)                            │\n│   • 0.0.0.0:15034 에 socket 바인드                               │\n│   • signal 핸들러 등록 (SIGTERM, SIGINT)                         │\n│   • 부트 시퀀스 5단계 [OK] 출력                                  │\n│   • &quot;Agent READY&quot; 출력                                           │\n│                                                                  │\n│  [러닝 루프 — 미확인, 추정]                                      │\n│   • HTTP 요청 수신 (port 15034)                                  │\n│   • subprocess 로 명령 실행                                      │\n│   • SSL/hashlib 로 외부 서버에 결과 보고? (단정 어려움)          │\n│   • 로그 파일에 기록 (/var/log/agent-app/...)                    │\n│                                                                  │\n│  [종료]                                                          │\n│   • Ctrl+C → SIGINT → graceful shutdown                          │\n│   • /tmp/_MEIxxxxxx/ 자동 정리                                   │\n└─────────────────────────────────────────────────────────────────┘\n</code></pre></div>\n\n<h3 id=\"3\">핵심 결론 3가지<a class=\"headerlink\" href=\"#3\" title=\"Permanent link\">#</a></h3>\n<ol>\n<li>\n<p><strong>Ubuntu 24.04 가 강제되는 진짜 이유</strong>\n   - 번들 <code>libpython3.12.so.1.0</code> 는 빌드 시점의 glibc(&gt;=2.38) 와 동적 링크\n   - Ubuntu 22.04 는 glibc 2.35 → 로드 자체가 <code>GLIBC_2.38 not found</code> 에러\n   - 22.04 가 Python 3.10 이라는 사실도 부수적 이슈지만 더 본질은 glibc</p>\n</li>\n<li>\n<p><strong>이 앱이 \"단순 에코 서버\" 가 아닌 이유</strong>\n   - <code>_ssl</code>, <code>_hashlib</code>, <code>libssl</code>, <code>libcrypto</code> 가 번들됨 = TLS·해시 기능 보유\n   - <code>subprocess</code>, <code>fork/exec</code> 가능 = 외부 명령 실행기\n   - HTTP 모듈 포함 = HTTP 서버 또는 클라이언트\n   - 종합하면 \"<strong>원격 명령 수행 + 결과 보고형 agent</strong>\" 모델</p>\n</li>\n<li>\n<p><strong>분석 저항성은 낮은 편</strong>\n   - stripped 이지만 PyInstaller 패키징이라 archive 만 풀면 .pyc 까지 즉시 접근\n   - 실제로 코드 보호가 중요했다면 <strong>Cython 컴파일</strong> 이나 <strong>PyArmor 난독화</strong> 가 추가됐어야 함\n   - 본 미션은 교육용 산출물이라 보호보다는 배포 편의가 우선</p>\n</li>\n</ol>\n<hr />\n<h2 id=\"10-toolsanalyze_binarypy\">10. 분석 도구 — <code>tools/analyze_binary.py</code><a class=\"headerlink\" href=\"#10-toolsanalyze_binarypy\" title=\"Permanent link\">#</a></h2>\n<p>본 문서의 분석 결과를 한 번에 재현할 수 있는 Python 스크립트가 <a href=\"../../tools/analyze_binary.py\">tools/analyze_binary.py</a> 에 있다.</p>\n<div class=\"codehilite\"><pre><span></span><code>pip<span class=\"w\"> </span>install<span class=\"w\"> </span>pyelftools<span class=\"w\">          </span><span class=\"c1\"># ELF 분석 라이브러리</span>\npython<span class=\"w\"> </span>tools/analyze_binary.py\n</code></pre></div>\n\n<p>출력 구조:</p>\n<div class=\"codehilite\"><pre><span></span><code>[ELF Header]              ← 매직, 클래스, 머신 종류\n[Dynamic — 의존 라이브러리]\n[Section 요약 (상위 12개, 크기순)]\n[Imported symbols — 카테고리별]\n[흥미로운 문자열 (의도/구현 단서)]\n</code></pre></div>\n\n<p>직접 다른 바이너리 분석할 때 출발점으로 그대로 활용 가능.</p>\n<hr />\n<h2 id=\"11\">11. 추가 학습 자원<a class=\"headerlink\" href=\"#11\" title=\"Permanent link\">#</a></h2>\n<table>\n<thead>\n<tr>\n<th>분야</th>\n<th>자원</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>ELF 포맷</td>\n<td><code>man elf</code>, <a href=\"https://refspecs.linuxfoundation.org/elf/elf.pdf\">ELF spec PDF</a></td>\n</tr>\n<tr>\n<td>PyInstaller 내부</td>\n<td><a href=\"https://github.com/pyinstaller/pyinstaller/wiki\">github.com/pyinstaller/pyinstaller/wiki</a></td>\n</tr>\n<tr>\n<td>Python 바이트코드</td>\n<td>Python <code>dis</code> 모듈 공식 문서</td>\n</tr>\n<tr>\n<td>동적 분석 (다음 단계)</td>\n<td><code>strace</code>, <code>ltrace</code>, <code>gdb</code> + <code>pwndbg</code>, <code>radare2</code>, <code>Ghidra</code></td>\n</tr>\n<tr>\n<td>안전한 환경</td>\n<td>분석은 항상 <strong>격리 VM/컨테이너</strong>에서. OrbStack 머신이 적격</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2 id=\"12\">12. 한 줄 요약<a class=\"headerlink\" href=\"#12\" title=\"Permanent link\">#</a></h2>\n<blockquote>\n<p>ELF → 의심 → 의존 → 문자열 → 심볼 → 아카이브 → 바이트코드. 위층에서 답 나오면 멈춰라.\n본 <code>agent-app</code> 은 Python 3.12 PyInstaller 번들이고, Layer 4 (strings) 만으로도 90% 의 의문이 풀린다.</p>\n</blockquote>", "toc": "<div class=\"toc\">\n<ul>\n<li><a href=\"#0\">0. 들어가기 전에 — 윤리·법</a><ul>\n<li><a href=\"#_1\">왜 리버스 엔지니어링을 배우나</a></li>\n<li><a href=\"#_2\">본 문서가 다루지 않는 것 (선)</a></li>\n<li><a href=\"#_3\">본 미션의 맥락</a></li>\n</ul>\n</li>\n<li><a href=\"#1-layer-17\">1. 단계별 접근법 (Layer 1~7)</a></li>\n<li><a href=\"#2-layer-1\">2. Layer 1 — 파일이 무엇인가</a><ul>\n<li><a href=\"#_4\">질문</a></li>\n<li><a href=\"#_5\">도구</a></li>\n<li><a href=\"#_6\">실행</a></li>\n<li><a href=\"#_7\">한 줄에 알 수 있는 것</a></li>\n<li><a href=\"#_8\">이 단계에서 멈출 수 있는 경우</a></li>\n</ul>\n</li>\n<li><a href=\"#3-layer-2-elf\">3. Layer 2 — ELF 구조</a><ul>\n<li><a href=\"#_9\">질문</a></li>\n<li><a href=\"#_10\">도구</a></li>\n<li><a href=\"#_11\">실행</a></li>\n<li><a href=\"#_12\">결과</a></li>\n<li><a href=\"#_13\">진단</a></li>\n</ul>\n</li>\n<li><a href=\"#4-layer-3\">4. Layer 3 — 의존 라이브러리</a><ul>\n<li><a href=\"#_14\">질문</a></li>\n<li><a href=\"#_15\">도구</a></li>\n<li><a href=\"#_16\">실행</a></li>\n<li><a href=\"#_17\">결과</a></li>\n<li><a href=\"#_18\">진단</a></li>\n</ul>\n</li>\n<li><a href=\"#5-layer-4\">5. Layer 4 — 안에 든 문자열</a><ul>\n<li><a href=\"#_19\">질문</a></li>\n<li><a href=\"#_20\">도구</a></li>\n<li><a href=\"#_21\">실행</a></li>\n<li><a href=\"#_22\">결과 — 흥미로운 발견</a></li>\n<li><a href=\"#_23\">진단</a></li>\n<li><a href=\"#loader\">핵심 — LOADER: 가 의미하는 것</a></li>\n</ul>\n</li>\n<li><a href=\"#6-layer-5-api\">6. Layer 5 — 호출하는 API</a><ul>\n<li><a href=\"#_24\">질문</a></li>\n<li><a href=\"#_25\">도구</a></li>\n<li><a href=\"#_26\">실행 결과 — 카테고리별 분류</a></li>\n<li><a href=\"#_27\">진단</a></li>\n</ul>\n</li>\n<li><a href=\"#7-layer-6-pyinstaller\">7. Layer 6 — PyInstaller 아카이브 구조</a><ul>\n<li><a href=\"#_28\">질문</a></li>\n<li><a href=\"#pyinstaller-archive\">PyInstaller archive 포맷 (간단히)</a></li>\n<li><a href=\"#_29\">도구</a></li>\n<li><a href=\"#_30\">직접 파싱 예시</a></li>\n<li><a href=\"#_31\">결과</a></li>\n<li><a href=\"#toc\">TOC 안의 항목들 (스캔)</a></li>\n<li><a href=\"#_32\">진단 — 핵심 발견</a></li>\n</ul>\n</li>\n<li><a href=\"#8-layer-7\">8. Layer 7 — 바이트코드 디컴파일 (가장 깊은 층)</a><ul>\n<li><a href=\"#_33\">질문</a></li>\n<li><a href=\"#8-1\">8-1. 두 단계로 진행</a></li>\n<li><a href=\"#8-2-step-a\">8-2. Step A — 아카이브 추출</a></li>\n<li><a href=\"#8-3-step-b-pyc\">8-3. Step B — .pyc 디컴파일 한계</a></li>\n<li><a href=\"#8-4-toolsdecompile_metadatapy\">8-4. 메타데이터 디컴파일러 — tools/decompile_metadata.py</a></li>\n<li><a href=\"#8-5-linux_pbl_v2_reconstructedpy\">8-5. 재구성된 소스 — linux_pbl_v2_reconstructed.py</a></li>\n<li><a href=\"#8-6-agent-app\">8-6. 큰 발견 — agent-app 의 진짜 정체</a></li>\n<li><a href=\"#8-7\">8-7. 발견의 의미 — 미션 설계 의도</a></li>\n<li><a href=\"#_34\">이 단계까지 가야 하는가? (수정)</a></li>\n</ul>\n</li>\n<li><a href=\"#9-agent-app\">9. 종합 — agent-app 의 추정 아키텍처</a><ul>\n<li><a href=\"#3\">핵심 결론 3가지</a></li>\n</ul>\n</li>\n<li><a href=\"#10-toolsanalyze_binarypy\">10. 분석 도구 — tools/analyze_binary.py</a></li>\n<li><a href=\"#11\">11. 추가 학습 자원</a></li>\n<li><a href=\"#12\">12. 한 줄 요약</a></li>\n</ul>\n</div>\n"}];

    function renderNav() {
      const nav = document.getElementById('nav-list');
      nav.innerHTML = DOCS.map((d, i) =>
        `<li><a href="#" data-i="${i}" onclick="loadDoc(${i});return false;">${d.title}</a></li>`
      ).join('');
    }

    function loadDoc(i) {
      const d = DOCS[i];
      const meta = `<p class="doc-meta">원본: <code>${d.file}</code></p>`;
      const content = document.getElementById('content');
      content.innerHTML = meta + d.html;

      // TOC 주입
      const toc = document.getElementById('toc');
      toc.innerHTML = `<div class="toc-list">${d.toc || ''}</div>`;

      // 내부 .md 링크를 SPA 라우팅으로
      // README.md 는 docs/md/xxx.md 로 가리키고, docs/md 안의 .md 들은 서로
      // 짧은 이름(xxx.md) 으로 가리킬 수 있다. basename 비교로 둘 다 매칭.
      const basename = (p) => (p || '').split('/').pop();
      content.querySelectorAll('a[href$=".md"], a[href*=".md#"]').forEach(a => {
        const href = a.getAttribute('href');
        const filePart = href.replace(/#.*$/, '');
        const fBase = basename(filePart);
        const idx = DOCS.findIndex(x => basename(x.file) === fBase);
        if (idx >= 0) {
          a.onclick = (e) => { e.preventDefault(); loadDoc(idx); };
          a.style.cursor = 'pointer';
        }
      });

      // 활성 nav 표시
      document.querySelectorAll('#nav-list a').forEach(a =>
        a.classList.toggle('active', parseInt(a.dataset.i) === i)
      );

      // 모바일에서 사이드바 닫기
      document.getElementById('sidebar').classList.remove('open');
      window.scrollTo(0, 0);
      localStorage.setItem('lastDoc', i);

      // 스크롤 스파이용 헤딩 인덱싱
      collectSpyTargets();
    }

    let spyTargets = [];
    function collectSpyTargets() {
      spyTargets = Array.from(
        document.querySelectorAll('main.content h2, main.content h3, main.content h4')
      );
    }
    window.addEventListener('scroll', () => {
      if (!spyTargets.length) return;
      const offset = 100;
      let activeId = null;
      for (const el of spyTargets) {
        if (el.getBoundingClientRect().top < offset) activeId = el.id;
        else break;
      }
      if (!activeId && spyTargets[0]) activeId = spyTargets[0].id;
      document.querySelectorAll('#toc a').forEach(a => {
        const href = a.getAttribute('href');
        if (!href) return;
        a.classList.toggle('active', href === '#' + activeId);
      });
    }, { passive: true });

    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      document.getElementById('theme-icon').textContent  = theme === 'dark' ? '☀️' : '🌙';
      document.getElementById('theme-label').textContent = theme === 'dark' ? 'Light' : 'Dark';
      localStorage.setItem('theme', theme);
    }
    function toggleTheme() {
      const cur = document.documentElement.dataset.theme;
      applyTheme(cur === 'dark' ? 'light' : 'dark');
    }

    (function init() {
      const saved = localStorage.getItem('theme') ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      applyTheme(saved);
      document.getElementById('menu-btn').onclick = () =>
        document.getElementById('sidebar').classList.toggle('open');
      renderNav();
      const last = parseInt(localStorage.getItem('lastDoc') || '0');
      loadDoc(isNaN(last) || last >= DOCS.length ? 0 : last);
    })();
  </script>
</body>
