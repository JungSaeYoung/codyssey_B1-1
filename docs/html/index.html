es</code></td>\n<td>agent-common</td>\n<td>770 + ACL</td>\n<td>admin/dev/test 공동 R/W</td>\n</tr>\n<tr>\n<td><code>$AGENT_HOME/api_keys</code></td>\n<td>agent-core</td>\n<td>770 + ACL</td>\n<td>admin/dev만 R/W</td>\n</tr>\n<tr>\n<td><code>/var/log/agent-app</code></td>\n<td>agent-core</td>\n<td>770 + ACL</td>\n<td>admin/dev만 R/W</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>이유</strong>: 협업이 필요한 자료(업로드)는 넓은 그룹에 R/W를 주고, 비밀(API 키)과 운영 흔적(로그)은 좁은 코어 그룹으로 제한한다. ACL <code>-d</code>(default) 옵션으로 <strong>신규 파일도 동일 권한을 자동 상속</strong> 받게 해 운영자가 권한 설정을 잊어도 정책이 유지된다.</p>\n</blockquote>\n<hr />\n<h2 id=\"5\">5. 애플리케이션 실행 환경<a class=\"headerlink\" href=\"#5\" title=\"Permanent link\">#</a></h2>\n<h3 id=\"_11\">왜 하는가<a class=\"headerlink\" href=\"#_11\" title=\"Permanent link\">#</a></h3>\n<ul>\n<li>앱이 작동하려면 \"어디에 키 파일이 있다\", \"어떤 포트를 쓴다\" 같은 <strong>실행 환경 정보</strong>가 필요하다.</li>\n<li>이걸 코드에 박아 넣으면 환경마다 다시 빌드해야 한다. 그래서 OS 가 모든 프로세스에 공유하는 <strong>환경 변수</strong>로 외부에서 주입하는 게 표준이다.</li>\n</ul>\n<p><code>/home/agent-admin/.bashrc</code> 말미에 환경 변수 추가:</p>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"nb\">export</span><span class=\"w\"> </span><span class=\"nv\">AGENT_HOME</span><span class=\"o\">=</span><span class=\"s2\">&quot;/home/agent-admin/agent-app&quot;</span>\n<span class=\"nb\">export</span><span class=\"w\"> </span><span class=\"nv\">AGENT_PORT</span><span class=\"o\">=</span><span class=\"s2\">&quot;15034&quot;</span>\n<span class=\"nb\">export</span><span class=\"w\"> </span><span class=\"nv\">AGENT_UPLOAD_DIR</span><span class=\"o\">=</span><span class=\"s2\">&quot;</span><span class=\"nv\">$AGENT_HOME</span><span class=\"s2\">/upload_files&quot;</span>\n<span class=\"nb\">export</span><span class=\"w\"> </span><span class=\"nv\">AGENT_KEY_PATH</span><span class=\"o\">=</span><span class=\"s2\">&quot;</span><span class=\"nv\">$AGENT_HOME</span><span class=\"s2\">/api_keys/t_secret.key&quot;</span>\n<span class=\"nb\">export</span><span class=\"w\"> </span><span class=\"nv\">AGENT_LOG_DIR</span><span class=\"o\">=</span><span class=\"s2\">&quot;/var/log/agent-app&quot;</span>\n</code></pre></div>\n\n<p><strong>한 줄씩 설명</strong></p>\n<ul>\n<li><code>~/.bashrc</code> 는 그 계정이 bash 를 새로 열 때마다 자동 실행되는 초기화 스크립트. 여기에 <code>export</code> 를 적어두면 로그인할 때마다 환경변수가 자동 세팅된다.</li>\n<li><code>export 변수=값</code> : \"이 변수를 만들고, 이 프로세스에서 실행하는 자식 프로세스에게도 물려줘라\" 라는 뜻. <code>export</code> 없이 <code>A=1</code> 만 쓰면 현재 쉘 안에서만 쓰임.</li>\n<li>변수 안에서 <code>$AGENT_HOME</code> 처럼 다른 변수를 참조 가능. 이 줄 자체를 읽을 때 값으로 치환된다.</li>\n</ul>\n<p>키 파일:</p>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"nb\">echo</span><span class=\"w\"> </span><span class=\"s2\">&quot;agent_api_key_test&quot;</span><span class=\"w\"> </span><span class=\"p\">|</span><span class=\"w\"> </span>sudo<span class=\"w\"> </span>-u<span class=\"w\"> </span>agent-admin<span class=\"w\"> </span>tee<span class=\"w\"> </span><span class=\"se\">\\</span>\n<span class=\"w\">    </span>/home/agent-admin/agent-app/api_keys/t_secret.key\nsudo<span class=\"w\"> </span>chown<span class=\"w\"> </span>agent-admin:agent-core<span class=\"w\"> </span>/home/agent-admin/agent-app/api_keys/t_secret.key\nsudo<span class=\"w\"> </span>chmod<span class=\"w\"> </span><span class=\"m\">640</span><span class=\"w\"> </span>/home/agent-admin/agent-app/api_keys/t_secret.key\n</code></pre></div>\n\n<p><strong>한 줄씩 설명</strong></p>\n<ul>\n<li><code>echo \"내용\"</code> : 따옴표 안 문자열을 출력 (한 줄).</li>\n<li><code>|</code> (파이프) : 앞 명령의 출력을 뒤 명령의 입력으로 흘려보냄.</li>\n<li><code>tee 파일경로</code> : 입력으로 들어온 내용을 파일에 쓰면서 화면에도 출력. 왜 <code>&gt; 파일</code> 대신 <code>tee</code> 를 쓰냐면, <code>&gt;</code> 는 쉘이 즉시 처리해 버려 <code>sudo</code> 로 권한을 못 받기 때문. <code>sudo tee</code> 는 tee 자체가 sudo 로 실행되어 쓰기 권한을 얻는다.</li>\n<li><code>chown 사용자:그룹 파일</code> : 키 파일의 소유자/그룹을 정확히 지정 (agent-admin 이 만들고 agent-core 그룹이 읽도록).</li>\n<li><code>chmod 640</code> : 소유자=읽기·쓰기, 그룹=읽기만, 그 외=없음. <strong>키 파일은 절대 실행할 일이 없으니 x 비트는 빼는 것</strong>이 보안 관행.</li>\n</ul>\n<p>앱 파일 배치 (한 번만):</p>\n<p><code>agent-app</code> 는 <strong>미리 컴파일된 Linux 바이너리</strong> 파일이다. macOS 호스트에 있는 그 파일을 머신의 실행 위치(<code>$AGENT_HOME</code>) 안으로 옮겨 줘야 한다.</p>\n<blockquote>\n<p>⚠️ <strong>OS 버전 주의</strong> : 이 바이너리는 <strong>Ubuntu 24.04 (noble) 전용</strong>으로 빌드돼 있다 (의존 라이브러리/glibc 버전 차이). 22.04 머신에서는 동적 링크 실패 또는 <code>version 'GLIBC_2.38' not found</code> 등의 에러로 실행이 안 된다. 따라서 OrbStack 머신은 반드시 <strong><code>orb create ubuntu:24.04</code></strong> 로 생성한다.</p>\n<p>⚠️ <strong>중요</strong> : 이 단계는 <strong><code>sudo</code> 가 가능한 관리자 계정</strong> (OrbStack 첫 사용자, 예: <code>ashofrondol9475</code>) 에서 수행한다. <code>agent-admin</code> 셸에 들어와 있다면 <code>exit</code> 로 빠져나온 뒤 실행할 것. <code>agent-admin</code> 은 일반 계정이라 sudoers 에 등록돼 있지 않아 <code>sudo: Permission denied</code> 또는 <code>sudo-rs: I'm sorry agent-admin. I'm afraid I can't do that</code> (HAL 9000 패러디) 거절 메시지를 받는다.</p>\n</blockquote>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"c1\"># 현재 셸이 agent-admin 이라면 먼저 빠져나오기</span>\n<span class=\"nb\">exit</span><span class=\"w\">          </span><span class=\"c1\"># 또는 Ctrl+D — 프롬프트가 ashofrondol9475@codyssey 로 돌아오면 OK</span>\n\n<span class=\"c1\"># 관리자 계정에서 바이너리 배치</span>\nsudo<span class=\"w\"> </span>install<span class=\"w\"> </span>-m<span class=\"w\"> </span><span class=\"m\">0750</span><span class=\"w\"> </span>-o<span class=\"w\"> </span>agent-admin<span class=\"w\"> </span>-g<span class=\"w\"> </span>agent-common<span class=\"w\"> </span><span class=\"se\">\\</span>\n<span class=\"w\">    </span>/tmp/agent-app<span class=\"w\"> </span>/home/agent-admin/agent-app/agent-app\nsudo<span class=\"w\"> </span>ls<span class=\"w\"> </span>-l<span class=\"w\"> </span>/home/agent-admin/agent-app/agent-app\n<span class=\"c1\"># -rwxr-x--- 1 agent-admin agent-common ... agent-app</span>\n</code></pre></div>\n\n<p><strong>한 줄씩 설명</strong></p>\n<ul>\n<li><code>install -m 0750 -o agent-admin -g agent-common</code> : \"권한 0750, 소유자 agent-admin, 그룹 agent-common 으로 복사\". <strong>바이너리는 실행되려면 <code>x</code> 비트가 필요</strong>하므로 <code>0644</code> (실행 X) 가 아니라 <code>0750</code> 사용. (<code>0750</code> = 소유자 rwx / 그룹 r-x / 그 외 0)</li>\n<li><code>/tmp/agent-app → /home/agent-admin/agent-app/agent-app</code> : 임시 폴더에서 앱 작업 폴더로 이동.</li>\n</ul>\n<blockquote>\n<p>💡 <strong>OrbStack 의 자동 마운트</strong> : OrbStack 은 macOS 의 홈 디렉토리를 머신 안 <code>/Users/&lt;macUser&gt;/</code> 경로로 자동 마운트해 둔다. 따라서 <code>orb push</code> 없이 macOS 파일을 그대로 사용해도 된다.</p>\n<p>```bash</p>\n<h1 id=\"_12\">원본 위치 찾기<a class=\"headerlink\" href=\"#_12\" title=\"Permanent link\">#</a></h1>\n<p>find /Users/<macUser> -name agent-app -type f 2&gt;/dev/null</p>\n<h1 id=\"install\">찾은 경로를 install 의 원본 인자로 그대로 사용<a class=\"headerlink\" href=\"#install\" title=\"Permanent link\">#</a></h1>\n<p>sudo install -m 0750 -o agent-admin -g agent-common \\\n    /Users/<macUser>/Desktop/codyssey_B1-1/agent-app \\\n    /home/agent-admin/agent-app/agent-app\n```</p>\n<p>⚠️ <strong>자주 만나는 에러</strong></p>\n<p><code>install: cannot install /tmp/agent-app to /home/agent-admin/agent-app/agent-app</code>\n원인 두 가지 중 하나.\n1. <strong>원본이 없음</strong> — <code>/tmp/agent-app</code> 가 아직 머신 안에 없다. 위 자동 마운트 경로 사용.\n2. <strong>대상 폴더가 없음</strong> — <code>/home/agent-admin/agent-app/</code> 가 안 만들어졌다. §4 디렉토리 구조 만들기를 먼저 실행.</p>\n<p><code>ls -l /tmp/agent-app</code> 와 <code>sudo ls -ld /home/agent-admin/agent-app</code> 으로 원인을 가려낼 수 있다.</p>\n<p>💡 <strong>운영 원칙</strong> : 미션의 보안 정책은 \"<strong>관리자 권한이 필요한 setup 은 sudoer 계정에서, 앱 실행은 agent-admin 에서</strong>\" 로 계정을 오가는 흐름이다. <code>agent-admin</code> 에게 sudo 를 부여하면 역할 분리(§3) 의미가 깨지므로 그렇게 하지 않는다.</p>\n</blockquote>\n<p>앱 실행 (agent-admin 로 로그인 상태):</p>\n<div class=\"codehilite\"><pre><span></span><code>sudo<span class=\"w\"> </span>-iu<span class=\"w\"> </span>agent-admin\n<span class=\"nb\">echo</span><span class=\"w\"> </span><span class=\"s2\">&quot;AGENT_HOME=&#39;</span><span class=\"nv\">$AGENT_HOME</span><span class=\"s2\">&#39;&quot;</span><span class=\"w\">     </span><span class=\"c1\"># 비어 있으면 환경변수 미로드</span>\n<span class=\"nb\">source</span><span class=\"w\"> </span>~/.bashrc<span class=\"w\">                     </span><span class=\"c1\"># 필요 시 강제 로드</span>\n<span class=\"nb\">cd</span><span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"nv\">$AGENT_HOME</span><span class=\"s2\">&quot;</span>\n./agent-app\n</code></pre></div>\n\n<p><strong>한 줄씩 설명</strong></p>\n<ul>\n<li><code>sudo -iu agent-admin</code> : \"agent-admin 계정으로 로그인 셸을 새로 연다\" 의 의미. <code>-i</code> = init(로그인 시 ~/.bashrc 등 초기화 파일 실행), <code>-u</code> = 어떤 사용자로. → 이 시점부터는 환경변수가 자동 로드된다.</li>\n<li><code>echo \"AGENT_HOME='$AGENT_HOME'\"</code> : 환경변수가 비어 있으면 <code>AGENT_HOME=''</code> 처럼 나온다. 비어 있으면 다음 줄로.</li>\n<li><code>source ~/.bashrc</code> : <code>.bashrc</code> 파일을 <strong>현재 셸에 다시 읽어 적용</strong>. 보통 <code>sudo -iu</code> 시 자동이지만, 이미 들어와 있던 셸이면 이게 필요할 수 있다.</li>\n<li><code>cd \"$AGENT_HOME\"</code> : 작업 폴더 이동. <code>\"...\"</code> 따옴표를 붙이면 변수가 비어 있을 때 의도치 않게 <code>cd</code> 가 홈으로 가버리는 사고를 막을 수 있다.</li>\n<li><code>./agent-app</code> : 현재 폴더(<code>./</code>)의 <code>agent-app</code> 바이너리 실행. <code>PATH</code> 에 현재 폴더가 안 들어 있어 <code>./</code> 가 필요. (있다면 그냥 <code>agent-app</code> 도 가능)</li>\n</ul>\n<blockquote>\n<p><strong>자주 만나는 에러 1 — 파일 못 찾음</strong></p>\n<p><code>bash: ./agent-app: No such file or directory</code>\n경로 한 칸이 빠진 듯한 신호. <code>$AGENT_HOME</code> 이 비어 있어 <code>cd</code> 가 사실상 <code>~</code> 로 갔을 가능성이 높다. 진단 순서:</p>\n<p><code>bash\necho \"AGENT_HOME='$AGENT_HOME'\"   # 1) 비어 있는가\ntail -10 ~/.bashrc                # 2) export 라인이 있는가\nsource ~/.bashrc                  # 3) 다시 로드\necho \"AGENT_HOME='$AGENT_HOME'\"   # 4) 이제 채워졌는가</code>\n<code>.bashrc</code> 에 <code>export AGENT_HOME=...</code> 줄 자체가 없으면 §5 환경변수 등록 단계가 빠진 것 → 위 \"환경 변수 추가\" 블록 다시 실행.</p>\n<p><strong>자주 만나는 에러 2 — 라이브러리 버전 불일치</strong></p>\n<p><code>./agent-app: /lib/x86_64-linux-gnu/libc.so.6: version 'GLIBC_2.38' not found (required by ./agent-app)</code>\n현재 머신이 22.04 라는 신호. 24.04 머신에서 다시 시도해야 한다. (<code>orb create ubuntu:24.04 codyssey</code>)</p>\n<p><strong>임시 인라인 실행</strong> (영구 등록과 무관, 1회용):\n<code>bash\nAGENT_HOME=/home/agent-admin/agent-app \\\nAGENT_PORT=15034 \\\nAGENT_UPLOAD_DIR=/home/agent-admin/agent-app/upload_files \\\nAGENT_KEY_PATH=/home/agent-admin/agent-app/api_keys/t_secret.key \\\nAGENT_LOG_DIR=/var/log/agent-app \\\n/home/agent-admin/agent-app/agent-app</code></p>\n</blockquote>\n<h3 id=\"_13\">부트 시퀀스 출력 (실제 출력 첨부)<a class=\"headerlink\" href=\"#_13\" title=\"Permanent link\">#</a></h3>\n<div class=\"codehilite\"><pre><span></span><code>&gt; Starting Agent Boot Sequence...\n[1/5] Checking User Account               [OK]\n[2/5] Verifying Environment Variables     [OK]\n[3/5] Checking Required Files             [OK]\n[4/5] Checking Port Availability          [OK]\n[5/5] Verifying Log Permission            [OK]\n------------------------------------------------------------\nAgent READY\n</code></pre></div>\n\n<p>각 단계가 뭘 보는지:</p>\n<ol>\n<li><strong>User Account</strong> : root 가 아닌 일반 계정으로 실행 중인지 (UID ≠ 0).</li>\n<li><strong>Environment Variables</strong> : 필요한 환경변수가 모두 비어있지 않은지.</li>\n<li><strong>Required Files</strong> : 키 파일이 존재하고 내용이 <code>agent_api_key_test</code> 인지.</li>\n<li><strong>Port Availability</strong> : 15034 포트를 다른 프로세스가 안 쓰고 있는지 (테스트 바인드).</li>\n<li><strong>Log Permission</strong> : 로그 폴더가 존재하고 쓰기 가능한지.</li>\n</ol>\n<p>LISTEN 확인 (다른 셸에서 — 현재 셸은 앱이 점유 중):</p>\n<div class=\"codehilite\"><pre><span></span><code>sudo<span class=\"w\"> </span>ss<span class=\"w\"> </span>-tlnp<span class=\"w\"> </span><span class=\"p\">|</span><span class=\"w\"> </span>grep<span class=\"w\"> </span><span class=\"m\">15034</span>\n<span class=\"c1\"># LISTEN 0  16  0.0.0.0:15034  0.0.0.0:*  users:((&quot;agent-app&quot;,pid=XXXX,fd=3))</span>\n</code></pre></div>\n\n<ul>\n<li>위에서 본 <code>ss</code> 옵션과 동일. <code>sudo</code> 를 붙이지 않으면 <code>users:((\"agent-app\", ...))</code> 부분이 안 보인다 (다른 사용자의 프로세스 정보 조회는 root 권한 필요).</li>\n</ul>\n<blockquote>\n<p><strong>이유</strong>: 환경 변수로 경로/포트를 외부 주입하면 코드 변경 없이 환경별(dev/stg/prd) 재현이 가능하고, \"실행 환경을 코드로 고정\"하지 않아 운영 유연성이 확보된다.</p>\n</blockquote>\n<hr />\n<h2 id=\"6-monitorsh\">6. monitor.sh 배포 &amp; 실행<a class=\"headerlink\" href=\"#6-monitorsh\" title=\"Permanent link\">#</a></h2>\n<h3 id=\"_14\">왜 하는가<a class=\"headerlink\" href=\"#_14\" title=\"Permanent link\">#</a></h3>\n<ul>\n<li>운영 중에는 \"지금 앱이 살아 있나? 포트는 열려 있나? CPU/메모리/디스크 여유 있나?\" 를 주기적으로 확인해야 한다.</li>\n<li>사람이 매번 보는 건 비효율이므로 <strong>쉘 스크립트로 자동화</strong> → cron 으로 매분 실행 → 로그 누적 → 사후 분석.</li>\n</ul>\n<div class=\"codehilite\"><pre><span></span><code>sudo<span class=\"w\"> </span>install<span class=\"w\"> </span>-m<span class=\"w\"> </span><span class=\"m\">0750</span><span class=\"w\"> </span>-o<span class=\"w\"> </span>agent-dev<span class=\"w\"> </span>-g<span class=\"w\"> </span>agent-core<span class=\"w\"> </span><span class=\"se\">\\</span>\n<span class=\"w\">    </span>/tmp/monitor.sh<span class=\"w\"> </span>/home/agent-admin/agent-app/bin/monitor.sh\nsudo<span class=\"w\"> </span>ls<span class=\"w\"> </span>-l<span class=\"w\"> </span>/home/agent-admin/agent-app/bin/monitor.sh\n<span class=\"c1\"># -rwxr-x--- 1 agent-dev agent-core 7407 May 13 21:32 /home/agent-admin/agent-app/bin/monitor.sh</span>\n</code></pre></div>\n\n<p><strong>한 줄씩 설명</strong></p>\n<ul>\n<li><code>install</code> 은 단순한 복사가 아니라 \"<strong>복사하면서 권한·소유자·그룹을 한 번에 세팅</strong>\" 해주는 명령.</li>\n<li><code>-m 0750</code> : 권한 750 (rwx r-x ---) 로.</li>\n<li><code>-o agent-dev</code> : 소유자 지정.</li>\n<li><code>-g agent-core</code> : 그룹 지정.</li>\n<li>마지막 두 인자는 <code>원본 대상</code>.</li>\n<li><code>cp</code> 로 복사 후 따로 <code>chmod/chown</code> 하는 것과 같지만 한 번에 처리 → 실수 확률 ↓.</li>\n<li><code>ls -l 파일</code> : 파일의 권한/소유자/그룹/크기/날짜를 한 줄로 표시. 결과의 <code>-rwxr-x---</code> 가 750 임을 의미.</li>\n</ul>\n<blockquote>\n<p>💡 <strong><code>0750</code> vs <code>750</code> — 앞의 <code>0</code> 은 왜 붙이나</strong></p>\n<p>결과적으로 <code>chmod 750</code> 과 <code>chmod 0750</code> 은 <strong>완전히 같은 권한</strong>을 만든다. 다만 권한 모드는 사실 3자리가 아니라 <strong>4자리</strong>다.</p>\n<p><code>0   7   5   0\n   │   │   │   │\n   │   │   │   └─ other (rwx)\n   │   │   └───── group (rwx)\n   │   └───────── user (rwx)\n   └───────────── 특수 비트 (setuid / setgid / sticky)</code></p>\n<p>맨 앞 1자리가 가질 수 있는 값:</p>\n<table>\n<thead>\n<tr>\n<th>값</th>\n<th>이름</th>\n<th>의미</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>4</code></td>\n<td><strong>setuid</strong></td>\n<td>누가 실행하든 <strong>소유자 권한으로 실행</strong>됨 (예: <code>/usr/bin/passwd</code>)</td>\n</tr>\n<tr>\n<td><code>2</code></td>\n<td><strong>setgid</strong></td>\n<td>디렉토리에 걸면 그 안 새 파일이 부모 그룹을 자동 상속</td>\n</tr>\n<tr>\n<td><code>1</code></td>\n<td><strong>sticky</strong></td>\n<td>디렉토리에 걸면 그 안 파일은 <strong>소유자만 삭제 가능</strong> (<code>/tmp</code> 가 1777)</td>\n</tr>\n<tr>\n<td><code>0</code></td>\n<td>없음</td>\n<td>일반 파일/폴더</td>\n</tr>\n</tbody>\n</table>\n<p>그래서 <code>750</code> 만 쓰면 시스템이 \"맨 앞은 0이겠지\" 라고 자동 가정하지만, <strong><code>0750</code> 은 \"특수 비트 = 0(없음) + 권한 750\" 을 명시</strong>한 것.</p>\n<p><strong><code>0750</code> 4자리 표기를 권장하는 이유</strong>:\n1. <code>4750</code>(setuid), <code>2750</code>(setgid), <code>1750</code>(sticky) 같은 줄과 <strong>자릿수가 정렬</strong>돼 가독성 ↑\n2. \"이건 8진수다\" 라는 시각적 신호 — 다른 언어(Python <code>0o750</code>, Go <code>0750</code>) 와도 통일\n3. Ansible 같은 IaC 도구는 따옴표 + 4자리(<code>'0750'</code>) 를 권장. (<code>750</code> 을 따옴표 없이 넣으면 십진수로 해석돼 권한이 깨지는 사고)\n4. 코드 리뷰에서 \"권한 의도를 이해하고 쓰는 사람\" 이라는 신호</p>\n<p>셸에서 한 줄 칠 때는 <code>750</code> 으로도 충분하지만, <strong>문서/스크립트/자동화</strong>에선 <code>0750</code> 4자리로 통일하는 게 관습이다.</p>\n</blockquote>\n<p>수동 실행 (agent-admin 로):</p>\n<div class=\"codehilite\"><pre><span></span><code>sudo<span class=\"w\"> </span>-iu<span class=\"w\"> </span>agent-admin<span class=\"w\"> </span>bash<span class=\"w\"> </span>-lc<span class=\"w\"> </span><span class=\"s1\">&#39;/home/agent-admin/agent-app/bin/monitor.sh&#39;</span>\n</code></pre></div>\n\n<p><strong>한 줄씩 설명</strong></p>\n<ul>\n<li><code>sudo -iu agent-admin</code> : 위와 동일, agent-admin 권한으로.</li>\n<li><code>bash -lc '명령'</code> : <code>-l</code> = 로그인 셸로(.bashrc 환경변수 로드), <code>-c '명령'</code> = 따옴표 안 명령 실행. → 결과적으로 \"agent-admin 의 환경변수를 모두 로드한 채로 monitor.sh 를 한 번 실행\".</li>\n</ul>\n<p>콘솔 출력</p>\n<div class=\"codehilite\"><pre><span></span><code>====== SYSTEM MONITOR RESULT ======\n\n[HEALTH CHECK]\nChecking process &#39;agent-app&#39;... [OK] (PID: 4445)\nChecking port 15034... [OK]\n\n[RESOURCE MONITORING]\nCPU Usage  : 0.0%\nMEM Usage  : 3.8%\nDISK Used  : 1%\n\n\n[INFO] Log appended: /var/log/agent-app/monitor.log\n</code></pre></div>\n\n<blockquote>\n<p>💡 <strong>방화벽 체크의 진화 — 두 번 고친 이유</strong></p>\n<p>일반 사용자(agent-admin/cron) 에서도 UFW 활성을 정확히 판별하기 위해 monitor.sh 의 체크 방식이 두 단계 진화했다.</p>\n<ol>\n<li><strong>초기</strong>: <code>ufw status</code> 명령 → root 가 아니면 거부되어 항상 WARNING</li>\n<li><strong>1차 수정</strong>: <code>systemctl is-active --quiet ufw</code> → 대부분의 환경에서 정확</li>\n<li><strong>현재 (2차 수정)</strong>: 위 + <code>/etc/ufw/ufw.conf</code> 의 <code>ENABLED=yes</code> 줄도 확인</li>\n</ol>\n<p>왜 3번이 필요한가 — OrbStack 같은 컨테이너형 systemd 환경에선 <strong><code>ufw --force enable</code> 만으론 systemd unit 이 활성화되지 않는 경우</strong>가 있다. 그러면 <code>ufw status</code> 는 active 로 나오는데 <code>systemctl is-active ufw</code> 는 inactive 로 잡혀 false WARNING. 설정 파일을 fallback 으로 보면 이 케이스도 잡힌다.</p>\n<p>한편 <code>src/02_firewall_allowlist.sh</code> 와 verify_orbstack.sh §2 에선 <code>sudo systemctl enable --now ufw</code> 한 줄을 명시적으로 추가해 systemd unit 도 함께 활성화하도록 보강.</p>\n</blockquote>\n<p>로그 누적 확인:</p>\n<div class=\"codehilite\"><pre><span></span><code>sudo<span class=\"w\"> </span>tail<span class=\"w\"> </span>-n<span class=\"w\"> </span><span class=\"m\">5</span><span class=\"w\"> </span>/var/log/agent-app/monitor.log\n<span class=\"c1\"># [2026-05-13 21:33:40] PID:4445 CPU:0.0% MEM:3.8% DISK_USED:1%</span>\n</code></pre></div>\n\n<ul>\n<li><code>tail -n 5 파일</code> : 파일 끝에서 5줄만 보여줌. 로그처럼 최신이 뒤에 쌓이는 파일에서 자주 사용. (반대는 <code>head</code>.)</li>\n</ul>\n<hr />\n<h2 id=\"7-crontab-agent-admin\">7. crontab (agent-admin, 매분 실행)<a class=\"headerlink\" href=\"#7-crontab-agent-admin\" title=\"Permanent link\">#</a></h2>\n<h3 id=\"_15\">왜 하는가<a class=\"headerlink\" href=\"#_15\" title=\"Permanent link\">#</a></h3>\n<ul>\n<li>사람이 매분 monitor.sh 를 칠 수 없으니 <strong>cron 데몬</strong>(스케줄러)이 대신 실행하게 한다.</li>\n<li>각 계정마다 자기만의 <code>crontab</code> 이 있어, 그 안에 \"언제 + 무엇\" 을 적어두면 cron 이 그 시각에 실행해 준다.</li>\n</ul>\n<div class=\"codehilite\"><pre><span></span><code>sudo<span class=\"w\"> </span>systemctl<span class=\"w\"> </span><span class=\"nb\">enable</span><span class=\"w\"> </span>--now<span class=\"w\"> </span>cron\n<span class=\"c1\"># Synchronizing state of cron.service with SysV service script with /usr/lib/systemd/systemd-sysv-install.</span>\n<span class=\"c1\"># Executing: /usr/lib/systemd/systemd-sysv-install enable cron</span>\n\nsudo<span class=\"w\"> </span>-u<span class=\"w\"> </span>agent-admin<span class=\"w\"> </span>bash<span class=\"w\"> </span>-c<span class=\"w\"> </span><span class=\"s1\">&#39;</span>\n<span class=\"s1\">( crontab -l 2&gt;/dev/null | grep -v monitor.sh ;</span>\n<span class=\"s1\">  echo &quot;* * * * * AGENT_HOME=/home/agent-admin/agent-app AGENT_PORT=15034 AGENT_LOG_DIR=/var/log/agent-app /home/agent-admin/agent-app/bin/monitor.sh &gt;&gt; /home/agent-admin/monitor.cron.log 2&gt;&amp;1&quot;</span>\n<span class=\"s1\">) | crontab -</span>\n<span class=\"s1\">&#39;</span>\nsudo<span class=\"w\"> </span>-u<span class=\"w\"> </span>agent-admin<span class=\"w\"> </span>crontab<span class=\"w\"> </span>-l\n<span class=\"c1\"># * * * * * AGENT_HOME=/home/agent-admin/agent-app AGENT_PORT=15034 AGENT_LOG_DIR=/var/log/agent-app /home/agent-admin/agent-app/bin/monitor.sh &gt;&gt; /home/agent-admin/monitor.cron.log 2&gt;&amp;1</span>\n</code></pre></div>\n\n<p><strong>한 줄씩 설명</strong></p>\n<ul>\n<li><code>systemctl enable --now cron</code> : cron 데몬을 \"지금 켜고(<code>--now</code>), 부팅 시에도 자동 시작 등록(<code>enable</code>)\".</li>\n<li><code>crontab -l</code> : 현재 등록된 일정 목록 출력. <code>2&gt;/dev/null</code> 은 \"아무 일정도 없을 때 나오는 에러 메시지를 버려라\".</li>\n<li><code>grep -v monitor.sh</code> : \"monitor.sh 가 들어간 줄은 빼고\" — 이미 등록돼 있던 동일 항목 중복 등록 방지.</li>\n<li><code>;</code> 으로 두 명령을 한 묶음에서 연결한 뒤 결과를 <code>crontab -</code> 에 파이프.</li>\n<li><code>crontab -</code> : 표준입력으로 받은 내용을 그 계정의 crontab 으로 <strong>덮어쓰기</strong>.</li>\n<li>등록되는 한 줄 <code>* * * * * 명령</code> 의 <strong>5개 별표</strong>는 \"분 / 시 / 일 / 월 / 요일\" 을 의미. 전부 <code>*</code> 면 \"매분(모든 시각)\".</li>\n<li>명령 시작 부분 <code>AGENT_HOME=... AGENT_PORT=...</code> : cron 은 사용자의 <code>.bashrc</code> 를 안 읽기 때문에 환경변수를 직접 지정해 줘야 한다.</li>\n<li><code>&gt;&gt; 로그파일 2&gt;&amp;1</code> : 실행 결과(표준출력)와 에러(표준에러)를 모두 같은 로그 파일에 <strong>이어쓰기</strong>. cron 실행에서 에러가 났을 때 어디로 갔는지 찾기 쉽다.</li>\n</ul>\n<p>1~2분 뒤 로그 누적 검증:</p>\n<div class=\"codehilite\"><pre><span></span><code>sudo<span class=\"w\"> </span>wc<span class=\"w\"> </span>-l<span class=\"w\"> </span>/var/log/agent-app/monitor.log<span class=\"w\">     </span><span class=\"c1\"># 1분 후</span>\n<span class=\"c1\"># 2 /var/log/agent-app/monitor.log</span>\nsleep<span class=\"w\"> </span><span class=\"m\">70</span>\nsudo<span class=\"w\"> </span>wc<span class=\"w\"> </span>-l<span class=\"w\"> </span>/var/log/agent-app/monitor.log<span class=\"w\">     </span><span class=\"c1\"># 라인 수 증가 확인</span>\n<span class=\"c1\"># 4 /var/log/agent-app/monitor.log</span>\nsudo<span class=\"w\"> </span>tail<span class=\"w\"> </span>-n<span class=\"w\"> </span><span class=\"m\">3</span><span class=\"w\"> </span>/var/log/agent-app/monitor.log\n<span class=\"c1\"># [2026-05-13 21:35:01] PID:4445 CPU:0.0% MEM:3.9% DISK_USED:1%</span>\n<span class=\"c1\"># [2026-05-13 21:36:01] PID:4445 CPU:1.6% MEM:3.8% DISK_USED:1%</span>\n<span class=\"c1\"># [2026-05-13 21:37:01] PID:4445 CPU:0.0% MEM:3.7% DISK_USED:1%</span>\n</code></pre></div>\n\n<ul>\n<li><code>wc -l 파일</code> : 파일의 줄 수를 센다. 1분 전과 후의 줄 수가 늘었다면 cron 이 정상 작동하는 것.</li>\n<li><code>sleep 70</code> : 70초 대기 (1분 + 여유).</li>\n</ul>\n<blockquote>\n<p><strong>이유</strong>: 운영 상태는 \"스냅샷이 아니라 시계열\"이어야 분석 가능하다. cron으로 주기 수집을 강제하고, 로그 로테이션(10MB × 10개)으로 디스크 점유 폭주를 막는다.</p>\n</blockquote>\n<hr />\n<h2 id=\"8-1-reportsh\">8. (보너스 1) report.sh<a class=\"headerlink\" href=\"#8-1-reportsh\" title=\"Permanent link\">#</a></h2>\n<h3 id=\"_16\">왜 하는가<a class=\"headerlink\" href=\"#_16\" title=\"Permanent link\">#</a></h3>\n<ul>\n<li>로그 파일을 사람이 직접 보면 흐름은 알 수 있지만 \"<strong>평균/최대/최소</strong>\" 같은 통계는 안 보인다.</li>\n<li><code>report.sh</code> 는 monitor.log 를 한 번 훑어 통계만 뽑아 콘솔에 보여 준다.</li>\n</ul>\n<div class=\"codehilite\"><pre><span></span><code>sudo<span class=\"w\"> </span>install<span class=\"w\"> </span>-m<span class=\"w\"> </span><span class=\"m\">0750</span><span class=\"w\"> </span>-o<span class=\"w\"> </span>agent-dev<span class=\"w\"> </span>-g<span class=\"w\"> </span>agent-core<span class=\"w\"> </span><span class=\"se\">\\</span>\n<span class=\"w\">    </span>/tmp/report.sh<span class=\"w\"> </span>/home/agent-admin/agent-app/bin/report.sh\nsudo<span class=\"w\"> </span>-u<span class=\"w\"> </span>agent-admin<span class=\"w\"> </span>/home/agent-admin/agent-app/bin/report.sh\n<span class=\"c1\"># (또는 구간 지정)</span>\nsudo<span class=\"w\"> </span>-u<span class=\"w\"> </span>agent-admin<span class=\"w\"> </span>/home/agent-admin/agent-app/bin/report.sh<span class=\"w\"> </span><span class=\"se\">\\</span>\n<span class=\"w\">    </span><span class=\"s2\">&quot;2026-05-11 12:00:00&quot;</span><span class=\"w\"> </span><span class=\"s2\">&quot;2026-05-11 13:00:00&quot;</span>\n</code></pre></div>\n\n<ul>\n<li>위 §6 과 같은 <code>install</code> 명령으로 권한·소유자 셋업.</li>\n<li>인자 없이 실행하면 전체 로그 통계, <strong>두 시각을 인자로 주면 그 구간만</strong> 통계.</li>\n</ul>\n<hr />\n<h2 id=\"9-2-archive_logssh\">9. (보너스 2) archive_logs.sh — 시간 기반 보존 정책<a class=\"headerlink\" href=\"#9-2-archive_logssh\" title=\"Permanent link\">#</a></h2>\n<h3 id=\"_17\">왜 하는가<a class=\"headerlink\" href=\"#_17\" title=\"Permanent link\">#</a></h3>\n<ul>\n<li>매분 한 줄씩 쌓이는 로그를 영영 보관하면 디스크가 가득 찬다.</li>\n<li>\n<p>정책: \"<strong>오래된 건 압축해서 따로 보관, 더 오래된 건 삭제</strong>\". 디스크 절약 + 필요할 때 조회 가능.</p>\n</li>\n<li>\n<p>7일 경과 <code>*.log</code> → <code>gzip</code> 후 <code>/var/log/monitor/agent-app/archive/</code> 로 이동</p>\n</li>\n<li>30일 경과 <code>*.gz</code> 삭제</li>\n<li>디렉토리 미존재/권한 부족/대상 0개에서 안전하게 종료(WARNING)</li>\n</ul>\n<div class=\"codehilite\"><pre><span></span><code>sudo<span class=\"w\"> </span>install<span class=\"w\"> </span>-m<span class=\"w\"> </span><span class=\"m\">0750</span><span class=\"w\"> </span>-o<span class=\"w\"> </span>agent-dev<span class=\"w\"> </span>-g<span class=\"w\"> </span>agent-core<span class=\"w\"> </span><span class=\"se\">\\</span>\n<span class=\"w\">    </span>/tmp/archive_logs.sh<span class=\"w\"> </span>/home/agent-admin/agent-app/bin/archive_logs.sh\n\n<span class=\"c1\"># cron (매일 03:10)</span>\nsudo<span class=\"w\"> </span>-u<span class=\"w\"> </span>agent-admin<span class=\"w\"> </span>bash<span class=\"w\"> </span>-c<span class=\"w\"> </span><span class=\"s1\">&#39;</span>\n<span class=\"s1\">( crontab -l 2&gt;/dev/null ;</span>\n<span class=\"s1\">  echo &quot;10 3 * * * /home/agent-admin/agent-app/bin/archive_logs.sh &gt;&gt; /home/agent-admin/archive.cron.log 2&gt;&amp;1&quot;</span>\n<span class=\"s1\">) | crontab -</span>\n<span class=\"s1\">&#39;</span>\n</code></pre></div>\n\n<p><strong>한 줄씩 설명</strong></p>\n<ul>\n<li>cron 표현 <code>10 3 * * *</code> 의 의미: \"<strong>매일 03시 10분에 실행</strong>\". 새벽 시간대를 고른 이유는 사용량이 적어 압축 작업이 운영에 거의 영향을 주지 않기 때문.</li>\n</ul>\n<hr />\n<h2 id=\"_18\">필수 증거 자료 체크리스트<a class=\"headerlink\" href=\"#_18\" title=\"Permanent link\">#</a></h2>\n<ul>\n<li>[ ] §1.3 SSH <code>Port 20022</code> / <code>PermitRootLogin no</code> 적용 + <code>ss -tulnp</code> 에 20022 LISTEN 출력</li>\n<li>[ ] §2  <code>ufw status verbose</code> 출력 — <code>Status: active</code> + 20022/tcp &amp; 15034/tcp ALLOW (v4/v6)</li>\n<li>[ ] §3  <code>id agent-admin / agent-dev / agent-test</code> 출력 — 소속 그룹 확인</li>\n<li>[ ] §4  <code>sudo ls -ld</code> + <code>sudo getfacl</code> 출력 — 디렉토리 4종 권한 + ACL <code>default:group:...</code> 확인</li>\n<li>[ ] §5  Boot Sequence 5/5 [OK] + \"Agent READY\" 콘솔 출력</li>\n<li>[ ] §5  <code>sudo ss -tlnp</code> 에 <code>0.0.0.0:15034</code> LISTEN + <code>python3</code> 프로세스 표시</li>\n<li>[ ] §6  monitor.sh 콘솔 출력 — HEALTH [OK] / RESOURCE / (firewall 활성 시 WARNING 미발생)</li>\n<li>[ ] §6  <code>sudo ls -l $AGENT_HOME/bin/monitor.sh</code> — 권한 <code>-rwxr-x---</code> + 소유 <code>agent-dev:agent-core</code></li>\n<li>[ ] §7  <code>sudo -u agent-admin crontab -l</code> — <code>* * * * * ... monitor.sh ...</code> 등록 확인</li>\n<li>[ ] §7  <code>sudo wc -l /var/log/agent-app/monitor.log</code> 1분 전 / 후 라인 증가</li>\n<li>[ ] §7  <code>sudo tail -n 3 /var/log/agent-app/monitor.log</code> — 최근 3 라인 로그 포맷 확인</li>\n</ul>", "toc": "<div class=\"toc\">\n<ul>\n<li><a href=\"#_1\">📖 읽기 전에 — 자주 등장하는 개념 미리보기</a></li>\n<li><a href=\"#0-orbstack\">0. OrbStack 환경 준비</a><ul>\n<li><a href=\"#docker-vm\">왜 Docker 컨테이너로는 안 되고 VM(머신 모드)으로 해야 하는가</a></li>\n</ul>\n</li>\n<li><a href=\"#1-ssh-20022-root\">1. SSH 설정 (포트 20022 + Root 차단)</a><ul>\n<li><a href=\"#_2\">왜 하는가</a></li>\n<li><a href=\"#11-openssh-server\">1.1 사전 단계 — openssh-server 설치</a></li>\n<li><a href=\"#12\">1.2 설정 변경 명령어</a></li>\n<li><a href=\"#13\">1.3 검증 (스크린샷/출력 첨부 위치)</a></li>\n</ul>\n</li>\n<li><a href=\"#2-ufw-20022tcp-15034tcp\">2. 방화벽 (UFW) — 20022/tcp, 15034/tcp만 허용</a><ul>\n<li><a href=\"#_3\">왜 하는가</a></li>\n<li><a href=\"#_4\">잠깐 — 우분투에는 이미 방화벽이 있지 않나?</a></li>\n<li><a href=\"#iptables-ufw\">왜 iptables 직접 안 쓰고 ufw 를 쓰나</a></li>\n<li><a href=\"#ufw\">UFW 선택의 실제 이점</a></li>\n<li><a href=\"#_5\">다른 선택지</a></li>\n<li><a href=\"#2\">미션 §2 의 실행 명령</a></li>\n</ul>\n</li>\n<li><a href=\"#3\">3. 계정/그룹 생성</a><ul>\n<li><a href=\"#_6\">왜 하는가</a></li>\n<li><a href=\"#_7\">보안 원칙 두 가지</a></li>\n<li><a href=\"#3_1\">계정 3종 — 누가 무엇을 맡나</a></li>\n<li><a href=\"#2_1\">그룹 2종 — 왜 굳이 둘로 나눴나</a></li>\n<li><a href=\"#agent-test-agent-core\">왜 agent-test 는 agent-core 에서 빠지는가</a></li>\n<li><a href=\"#agent-admin-devtest\">\"그러면 왜 agent-admin 한 명한테 다 시키지 않고 dev/test 까지 나누나\"</a></li>\n<li><a href=\"#cron-agent-admin\">cron 실행자가 왜 agent-admin 인가</a></li>\n<li><a href=\"#_8\">명령어</a></li>\n</ul>\n</li>\n<li><a href=\"#4-acl\">4. 디렉토리 구조 + ACL</a><ul>\n<li><a href=\"#_9\">왜 하는가</a></li>\n<li><a href=\"#acl\">ACL 이 뭔가 — 기본 권한과의 차이</a><ul>\n<li><a href=\"#1-posix\">1) 전통적 유닉스 권한 (POSIX 모드 비트) — 한계</a></li>\n<li><a href=\"#2-acl-access-control-list\">2) ACL (Access Control List) — 그 한계의 해소</a></li>\n</ul>\n</li>\n<li><a href=\"#acl_1\">이 미션에서 ACL 이 꼭 필요했던 이유</a><ul>\n<li><a href=\"#a\">시나리오 A — 기본 권한만 사용</a></li>\n<li><a href=\"#b-acl\">시나리오 B — ACL 사용 (이 미션의 선택)</a></li>\n</ul>\n</li>\n<li><a href=\"#setfacl\">setfacl 명령 한 줄씩</a></li>\n<li><a href=\"#getfacl\">확인 도구 getfacl</a></li>\n<li><a href=\"#acl_2\">ACL 의 다른 활용 예시 (참고)</a></li>\n<li><a href=\"#_10\">한 줄 요약</a></li>\n</ul>\n</li>\n<li><a href=\"#5\">5. 애플리케이션 실행 환경</a><ul>\n<li><a href=\"#_11\">왜 하는가</a></li>\n<li><a href=\"#_13\">부트 시퀀스 출력 (실제 출력 첨부)</a></li>\n</ul>\n</li>\n<li><a href=\"#6-monitorsh\">6. monitor.sh 배포 &amp; 실행</a><ul>\n<li><a href=\"#_14\">왜 하는가</a></li>\n</ul>\n</li>\n<li><a href=\"#7-crontab-agent-admin\">7. crontab (agent-admin, 매분 실행)</a><ul>\n<li><a href=\"#_15\">왜 하는가</a></li>\n</ul>\n</li>\n<li><a href=\"#8-1-reportsh\">8. (보너스 1) report.sh</a><ul>\n<li><a href=\"#_16\">왜 하는가</a></li>\n</ul>\n</li>\n<li><a href=\"#9-2-archive_logssh\">9. (보너스 2) archive_logs.sh — 시간 기반 보존 정책</a><ul>\n<li><a href=\"#_17\">왜 하는가</a></li>\n</ul>\n</li>\n<li><a href=\"#_18\">필수 증거 자료 체크리스트</a></li>\n</ul>\n</div>\n"}, {"title": "문제 설명", "file": "docs/md/문제_설명.md", "html": "<h1 id=\"codyssey-b1-1\">Codyssey B1-1 평가문항 답변 정리<a class=\"headerlink\" href=\"#codyssey-b1-1\" title=\"Permanent link\">#</a></h1>\n<blockquote>\n<p>작성자: 정세영 · 작성일: 2026-05-13\n본 문서는 codyssey 평가 시스템의 5개 항목(평가문항)에 대한 답변을 정리한 것이다.\n근거 파일: <a href=\"../../src/monitor.sh\">src/monitor.sh</a>, <a href=\"요구사항_수행_내역서.md\">요구사항_수행_내역서.md</a>, <code>bin/agent-app</code> (운영 측 제공 바이너리, Ubuntu 24.04 전용), <a href=\"../../src/report.sh\">src/report.sh</a>, <a href=\"../../src/archive_logs.sh\">src/archive_logs.sh</a>, <code>src/01_*.sh ~ 07_*.sh</code> (setup 7단계)</p>\n</blockquote>\n<hr />\n<h2 id=\"1\">항목 1 — 구현 완성 체크리스트<a class=\"headerlink\" href=\"#1\" title=\"Permanent link\">#</a></h2>\n<blockquote>\n<p>요구사항 충족 여부를 항목별로 정리한다. 모두 <strong>\"예\"</strong> 이며, 근거를 함께 첨부한다.</p>\n</blockquote>\n<h3 id=\"1-1-ssh-20022-root\">1-1. SSH 포트가 20022로 변경되었고, Root 원격 접속이 차단되었는가? — ✅ 예<a class=\"headerlink\" href=\"#1-1-ssh-20022-root\" title=\"Permanent link\">#</a></h3>\n<p><code>/etc/ssh/sshd_config</code>에서 다음 두 줄을 변경:</p>\n<div class=\"codehilite\"><pre><span></span><code>Port 20022\nPermitRootLogin no\n</code></pre></div>\n\n<p>검증:</p>\n<div class=\"codehilite\"><pre><span></span><code>$<span class=\"w\"> </span>sudo<span class=\"w\"> </span>grep<span class=\"w\"> </span>-E<span class=\"w\"> </span><span class=\"s1\">&#39;^(Port|PermitRootLogin)\\b&#39;</span><span class=\"w\"> </span>/etc/ssh/sshd_config\nPort<span class=\"w\"> </span><span class=\"m\">20022</span>\nPermitRootLogin<span class=\"w\"> </span>no\n\n$<span class=\"w\"> </span>sudo<span class=\"w\"> </span>ss<span class=\"w\"> </span>-tulnp<span class=\"w\"> </span><span class=\"p\">|</span><span class=\"w\"> </span>grep<span class=\"w\"> </span><span class=\"s1\">&#39;:20022&#39;</span>\ntcp<span class=\"w\">   </span>LISTEN<span class=\"w\"> </span><span class=\"m\">0</span><span class=\"w\">      </span><span class=\"m\">128</span><span class=\"w\">                </span><span class=\"m\">0</span>.0.0.0:20022<span class=\"w\">      </span><span class=\"m\">0</span>.0.0.0:*<span class=\"w\">    </span>users:<span class=\"o\">((</span><span class=\"s2\">&quot;sshd&quot;</span>,pid<span class=\"o\">=</span><span class=\"m\">3951</span>,fd<span class=\"o\">=</span><span class=\"m\">3</span><span class=\"o\">))</span><span class=\"w\">           </span>\ntcp<span class=\"w\">   </span>LISTEN<span class=\"w\"> </span><span class=\"m\">0</span><span class=\"w\">      </span><span class=\"m\">128</span><span class=\"w\">                   </span><span class=\"o\">[</span>::<span class=\"o\">]</span>:20022<span class=\"w\">         </span><span class=\"o\">[</span>::<span class=\"o\">]</span>:*<span class=\"w\">    </span>users:<span class=\"o\">((</span><span class=\"s2\">&quot;sshd&quot;</span>,pid<span class=\"o\">=</span><span class=\"m\">3951</span>,fd<span class=\"o\">=</span><span class=\"m\">4</span><span class=\"o\">))</span>\n</code></pre></div>\n\n<h3 id=\"1-2-20022tcp-15034tcp-ufw\">1-2. 방화벽이 활성화되어 있고, 20022/tcp · 15034/tcp만 허용되는가? — ✅ 예 (UFW 선택)<a class=\"headerlink\" href=\"#1-2-20022tcp-15034tcp-ufw\" title=\"Permanent link\">#</a></h3>\n<div class=\"codehilite\"><pre><span></span><code>sudo<span class=\"w\"> </span>ufw<span class=\"w\"> </span>default<span class=\"w\"> </span>deny<span class=\"w\"> </span>incoming\nsudo<span class=\"w\"> </span>ufw<span class=\"w\"> </span>default<span class=\"w\"> </span>allow<span class=\"w\"> </span>outgoing\nsudo<span class=\"w\"> </span>ufw<span class=\"w\"> </span>allow<span class=\"w\"> </span><span class=\"m\">20022</span>/tcp<span class=\"w\"> </span>comment<span class=\"w\"> </span><span class=\"s1\">&#39;SSH&#39;</span>\nsudo<span class=\"w\"> </span>ufw<span class=\"w\"> </span>allow<span class=\"w\"> </span><span class=\"m\">15034</span>/tcp<span class=\"w\"> </span>comment<span class=\"w\"> </span><span class=\"s1\">&#39;AGENT APP&#39;</span>\nsudo<span class=\"w\"> </span>ufw<span class=\"w\"> </span>--force<span class=\"w\"> </span><span class=\"nb\">enable</span>\n</code></pre></div>\n\n<p><code>ufw status verbose</code> 결과에 <code>Status: active</code> + 위 두 규칙만 노출됨.</p>\n<h3 id=\"1-3-agent-admindevtest-agent-commoncore\">1-3. agent-admin/dev/test 계정과 agent-common/core 그룹이 요구사항대로 구성되어 있는가? — ✅ 예<a class=\"headerlink\" href=\"#1-3-agent-admindevtest-agent-commoncore\" title=\"Permanent link\">#</a></h3>\n<table>\n<thead>\n<tr>\n<th>그룹</th>\n<th>멤버</th>\n<th>의미</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>agent-common</code></td>\n<td>admin, dev, test</td>\n<td>공용 작업 공간 공유</td>\n</tr>\n<tr>\n<td><code>agent-core</code></td>\n<td>admin, dev</td>\n<td>비밀(키)/로그 접근 가능</td>\n</tr>\n</tbody>\n</table>\n<p>검증: <code>id agent-admin / agent-dev / agent-test</code>로 각 계정의 소속 그룹 확인 완료.</p>\n<h3 id=\"1-4-boot-sequence-5-ok-agent-ready\">1-4. Boot Sequence 5단계 [OK] 통과 + \"Agent READY\" 출력 — ✅ 예<a class=\"headerlink\" href=\"#1-4-boot-sequence-5-ok-agent-ready\" title=\"Permanent link\">#</a></h3>\n<div class=\"codehilite\"><pre><span></span><code>[1/5] Checking User Account             [OK]\n[2/5] Verifying Environment Variables   [OK]\n[3/5] Checking Required Files           [OK]\n[4/5] Checking Port Availability        [OK]\n[5/5] Verifying Log Permission          [OK]\n------------------------------------------------------------\nAgent READY\n</code></pre></div>\n\n<p>각 단계의 검사 항목: ① 비-root UID, ② 환경변수 완전성, ③ 키 파일 존재·내용, ④ 15034 포트 가용성, ⑤ 로그 폴더 쓰기 권한.</p>\n<h3 id=\"1-5-monitorsh-exit-1\">1-5. monitor.sh가 프로세스/포트 점검 후 비정상 시 <code>exit 1</code>로 종료되는가? — ✅ 예<a class=\"headerlink\" href=\"#1-5-monitorsh-exit-1\" title=\"Permanent link\">#</a></h3>\n<p><a href=\"../../src/monitor.sh\">monitor.sh</a> §1 Health Check 블록에서:</p>\n<ul>\n<li>프로세스(<code>pgrep -x</code>) 미존재 → <code>[FAIL]</code> 출력 후 <code>exit 1</code></li>\n<li>포트(<code>ss -tlnH</code>) LISTEN 아님 → <code>[FAIL]</code> 출력 후 <code>exit 1</code></li>\n</ul>\n<h3 id=\"1-6-varlogagent-appmonitorlog\">1-6. <code>/var/log/agent-app/monitor.log</code>가 지정 포맷으로 누적 기록되는가? — ✅ 예<a class=\"headerlink\" href=\"#1-6-varlogagent-appmonitorlog\" title=\"Permanent link\">#</a></h3>\n<p>monitor.sh §5에서 한 줄씩 append:</p>\n<div class=\"codehilite\"><pre><span></span><code>[2026-05-13 21:35:01] PID:4445 CPU:0.0% MEM:3.9% DISK_USED:1%\n</code></pre></div>\n\n<p>포맷: <code>[YYYY-MM-DD HH:MM:SS] PID:&lt;n&gt; CPU:&lt;x&gt;% MEM:&lt;x&gt;% DISK_USED:&lt;x&gt;%</code></p>\n<h3 id=\"1-7-cron-monitorlog\">1-7. cron 매분 실행으로 monitor.log가 자동 증가하는가? — ✅ 예<a class=\"headerlink\" href=\"#1-7-cron-monitorlog\" title=\"Permanent link\">#</a></h3>\n<p>agent-admin의 crontab에 다음 등록:</p>\n<div class=\"codehilite\"><pre><span></span><code>* * * * * AGENT_HOME=... AGENT_PORT=15034 AGENT_LOG_DIR=/var/log/agent-app /home/agent-admin/agent-app/bin/monitor.sh &gt;&gt; /home/agent-admin/monitor.cron.log 2&gt;&amp;1\n</code></pre></div>\n\n<p>검증: 70초 간격으로 <code>wc -l</code>을 두 번 실행 시 라인 수가 1~2 증가함.</p>\n<h3 id=\"1-8-monitorlog-10mb10\">1-8. monitor.log 용량 관리(10MB/10개)가 설정·동작하는가? — ✅ 예<a class=\"headerlink\" href=\"#1-8-monitorlog-10mb10\" title=\"Permanent link\">#</a></h3>\n<p>monitor.sh §6에서 자체 구현된 size-based rotation:</p>\n<ul>\n<li><code>MAX_LOG_SIZE=$((10 * 1024 * 1024))</code>, <code>MAX_LOG_FILES=10</code></li>\n<li>매 실행 시 <code>stat -c %s</code>로 현재 크기 확인</li>\n<li>10MB 이상이면 <code>.10</code>을 삭제 → <code>.9 → .10</code>, <code>.8 → .9</code>, …, <code>.1 → .2</code>로 한 칸씩 밀고</li>\n<li>현재 파일을 <code>.1</code>로 이동 후 새 빈 파일 생성</li>\n</ul>\n<hr />\n<h2 id=\"2\">항목 2 — 구현 방식 설명<a class=\"headerlink\" href=\"#2\" title=\"Permanent link\">#</a></h2>\n<h3 id=\"2-1-pgrep-ss\">2-1. 프로세스 식별(<code>pgrep</code>) · 포트 확인(<code>ss</code>) 명령과 선택 이유<a class=\"headerlink\" href=\"#2-1-pgrep-ss\" title=\"Permanent link\">#</a></h3>\n<p><strong>프로세스 식별 — <code>pgrep -x \"agent-app\" | head -n1</code></strong></p>\n<ul>\n<li><code>pgrep</code>은 이름으로 PID를 바로 출력해 <code>ps aux | grep | grep -v grep | awk</code> 같은 파이프 체인을 없애 준다.</li>\n<li><code>-x</code>는 <strong>프로세스 이름(comm)과 정확히 일치</strong>하는 것만 잡는다 (<code>-f</code> 처럼 cmdline 전체를 보지 않음). 우리 케이스에서는 <code>agent-app</code> 이라는 문자열이 디렉토리 경로(<code>/home/agent-admin/agent-app/...</code>)에도 등장하므로 <code>-f</code> 를 쓰면 <code>monitor.sh</code> 자신을 매칭하는 자기참조 문제가 생긴다 → <code>-x</code> 가 안전.</li>\n<li><code>head -n1</code>은 다중 매치 시 첫 PID만 사용해 출력 일관성 확보.</li>\n</ul>\n<p><strong>포트 확인 — <code>ss -tlnH</code> (없으면 <code>netstat -tln</code>로 폴백)</strong></p>\n<ul>\n<li><code>ss</code>는 커널의 socket diagnostic netlink를 직접 읽어 <strong><code>netstat</code>보다 빠르고 정확</strong>하다 (Ubuntu 18+ 기본 도구).</li>\n<li>옵션 의미:</li>\n<li><code>-t</code> TCP만, <code>-l</code> LISTEN 상태만, <code>-n</code> 이름 해석 없이 숫자(빠름), <code>-H</code> 헤더 생략(awk가 편해짐)</li>\n<li><code>command -v ss</code>로 존재 여부를 체크해 미설치 환경에선 netstat로 fallback — <strong>이식성</strong> 확보.</li>\n<li><code>awk -v p=\":15034\" '$4 ~ p {print \"Y\"; exit}'</code>로 <code>0.0.0.0:15034</code>/<code>[::]:15034</code>를 모두 매치.</li>\n</ul>\n<h3 id=\"2-2-cpumemdisk\">2-2. CPU/MEM/DISK 추출·파싱 방식과 로그 포맷 고정 이유<a class=\"headerlink\" href=\"#2-2-cpumemdisk\" title=\"Permanent link\">#</a></h3>\n<p><strong>추출 방식</strong></p>\n<table>\n<thead>\n<tr>\n<th>자원</th>\n<th>명령</th>\n<th>파싱 방식</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>CPU</td>\n<td><code>top -bn1</code> 1회 샘플</td>\n<td><code>Cpu(s)</code> 줄에서 <code>id</code>(idle) 직전 값 추출, <code>100 - idle</code>로 사용률 산출</td>\n</tr>\n<tr>\n<td>MEM</td>\n<td><code>free</code></td>\n<td><code>Mem:</code> 줄에서 <code>$3/$2*100</code> (used/total)</td>\n</tr>\n<tr>\n<td>DISK</td>\n<td><code>df -P /</code></td>\n<td>root 파티션의 5번째 컬럼(%)에서 <code>%</code> 제거</td>\n</tr>\n</tbody>\n</table>\n<p><strong>소수점·기본값 처리</strong></p>\n<ul>\n<li><code>printf \"%.1f\"</code>로 소수 첫째 자리에 고정.</li>\n<li>파싱 실패 시 <code>[[ -z ... ]]</code>로 <code>\"0.0\"</code>/<code>\"0\"</code> 기본값 — 로그가 비지 않도록 방어.</li>\n</ul>\n<p><strong>임계값 비교는 <code>awk -v ... 'BEGIN {exit !(v+0 &gt; t+0)}'</code></strong></p>\n<ul>\n<li>bash의 <code>[[ ]]</code>는 정수만 비교 가능하므로 소수 비교에 <code>awk</code>를 사용.</li>\n</ul>\n<p><strong>로그 포맷을 <code>[ts] PID:n CPU:x% MEM:x% DISK_USED:x%</code>로 고정한 이유</strong></p>\n<ul>\n<li><strong>고정 토큰 + 사람 가독성 동시 충족</strong>: <code>[2026-05-13 21:35:01]</code> 부분은 정렬·정렬 가능, <code>KEY:VALUE</code> 구조는 <code>awk -F'[: ]'</code>로 후처리 쉬움.</li>\n<li>한 줄 한 레코드 (newline-delimited) → <code>tail</code>, <code>grep</code>, <code>wc -l</code> 같은 표준 도구로 즉시 분석 가능.</li>\n<li><code>report.sh</code>가 이 포맷을 가정하고 <code>awk</code> 한 번으로 평균/최대/최소를 산출.</li>\n</ul>\n<h3 id=\"2-3-vs\">2-3. 소유자 vs 실행자 권한 정책 — 어떻게 만족시켰는가<a class=\"headerlink\" href=\"#2-3-vs\" title=\"Permanent link\">#</a></h3>\n<table>\n<thead>\n<tr>\n<th>대상</th>\n<th>소유자</th>\n<th>그룹</th>\n<th>권한</th>\n<th>실행자가 가능한 이유</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>$AGENT_HOME/bin/monitor.sh</code></td>\n<td>agent-dev</td>\n<td>agent-core</td>\n<td><code>-rwxr-x---</code> (750)</td>\n<td>agent-admin이 agent-core 그룹 멤버 → 그룹 read+execute 적용</td>\n</tr>\n<tr>\n<td><code>/var/log/agent-app/</code></td>\n<td>root</td>\n<td>agent-core</td>\n<td><code>drwxrwx---+</code> (770) + ACL</td>\n<td>agent-core 멤버는 write 가능, ACL <code>default</code>로 신규 파일도 자동 상속</td>\n</tr>\n</tbody>\n</table>\n<p><strong>한 줄 요약</strong>: 스크립트 소유는 개발(agent-dev), 실행·로그 기록은 운영(agent-admin)이 하되, 둘 다 <strong>agent-core</strong> 그룹에 묶어 그룹 권한으로 read/write를 허용. 신규 파일도 권한이 풀리지 않도록 ACL <code>default:group:agent-core:rwx</code>을 부여.</p>\n<h3 id=\"2-4-logrotate\">2-4. 로그 용량 관리 — logrotate가 아니라 스크립트로 구현한 이유<a class=\"headerlink\" href=\"#2-4-logrotate\" title=\"Permanent link\">#</a></h3>\n<p><strong>구현 방식</strong>: monitor.sh §6에서 자체 size-based rotation (10MB · 10개 보관).</p>\n<p><strong>왜 logrotate가 아니라 스크립트 자체에서 했나</strong></p>\n<table>\n<thead>\n<tr>\n<th>항목</th>\n<th>logrotate</th>\n<th>스크립트 내장</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>트리거 시점</td>\n<td>cron.daily/hourly 가 깨워야 함</td>\n<td><strong>매분 monitor.sh 실행마다 검사</strong> — 폭주 시 더 신속히 차단</td>\n</tr>\n<tr>\n<td>권한</td>\n<td>logrotate 데몬은 root 권한으로 동작, 별도 설정 필요</td>\n<td>monitor.sh 실행 컨텍스트(agent-admin + agent-core) 그대로 사용</td>\n</tr>\n<tr>\n<td>의존성</td>\n<td><code>/etc/logrotate.d/agent-app</code> 추가 설정 + logrotate 패키지</td>\n<td><strong>추가 시스템 의존성 0</strong></td>\n</tr>\n<tr>\n<td>이식성</td>\n<td>배포판마다 logrotate 위치·옵션 차이</td>\n<td>bash + coreutils만으로 동일 동작</td>\n</tr>\n</tbody>\n</table>\n<p>미션 요구사항이 단순(10MB × 10개)하고, 매분 실행되는 monitor.sh가 이미 있으므로 자체 구현이 효율적이라 판단.</p>\n<hr />\n<h2 id=\"3\">항목 3 — 보안/운영 원칙<a class=\"headerlink\" href=\"#3\" title=\"Permanent link\">#</a></h2>\n<h3 id=\"3-1-ssh-root\">3-1. SSH 포트 변경 + Root 차단이 왜 보안에 효과적인가 (위협 모델 관점)<a class=\"headerlink\" href=\"#3-1-ssh-root\" title=\"Permanent link\">#</a></h3>\n<p><strong>위협 모델</strong></p>\n<ul>\n<li><strong>자동화된 무차별 스캔</strong>: 인터넷 봇넷은 22번 포트만 노린 ID/암호 사전 공격을 <strong>시간당 수천 회</strong> 시도한다.</li>\n<li><strong>자격 증명 유출 시 즉시 root 권한 탈취</strong>: <code>root@host</code> 접속이 허용되면 단 한 번의 root 비밀번호 유출로 시스템 전체가 장악됨.</li>\n</ul>\n<p><strong>대응 메커니즘</strong></p>\n<table>\n<thead>\n<tr>\n<th>조치</th>\n<th>효과</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>포트 22 → 20022</td>\n<td>자동 스캔 트래픽의 99% 회피 (대부분 봇이 22번만 노림). 로그 노이즈 격감 → 진짜 공격 탐지 쉬워짐</td>\n</tr>\n<tr>\n<td><code>PermitRootLogin no</code></td>\n<td>공격자가 root 계정 비밀번호를 얻어도 SSH로는 직접 들어올 수 없음. <strong>반드시 일반 사용자 → <code>sudo</code></strong> 2단계 강제</td>\n</tr>\n<tr>\n<td>결과</td>\n<td>\"<strong>누가</strong>(일반 계정) 무엇을 했는지 <code>/var/log/auth.log</code>에 남음\" → 사후 추적·차단 근거 확보</td>\n</tr>\n</tbody>\n</table>\n<p><strong>한계도 짚어두기</strong>: 포트 변경은 <strong>security through obscurity</strong> (감추기에 의한 보안)에 가까워 표적 공격엔 효과 제한적. 그래서 <code>fail2ban</code>, <code>key-only auth</code> 같은 추가 layer가 일반적이며, 이 미션에선 비밀번호 인증을 굳이 끊지 않았으나 다음 단계 보완 사항이다.</p>\n<h3 id=\"3-2-api_keys-agent-core\">3-2. api_keys · 로그를 agent-core로 제한한 이유 — 최소 권한 원칙<a class=\"headerlink\" href=\"#3-2-api_keys-agent-core\" title=\"Permanent link\">#</a></h3>\n<p><strong>최소 권한 원칙(Principle of Least Privilege, PoLP)</strong>: 어떤 주체에게도 <strong>그 작업을 수행하는 데 꼭 필요한 최소한의 권한</strong>만 부여한다.</p>\n<p><strong>그룹 분리 매트릭스</strong></p>\n<table>\n<thead>\n<tr>\n<th>자원</th>\n<th>누가 접근?</th>\n<th>어떤 그룹으로 제한?</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>업로드 파일 (<code>upload_files/</code>)</td>\n<td>admin/dev/test 모두 협업</td>\n<td><strong>agent-common</strong> (넓은 그룹)</td>\n</tr>\n<tr>\n<td>API 키 (<code>api_keys/</code>)</td>\n<td>운영(admin) + 개발(dev)만, test는 X</td>\n<td><strong>agent-core</strong> (좁은 그룹)</td>\n</tr>\n<tr>\n<td>운영 로그 (<code>/var/log/agent-app/</code>)</td>\n<td>모니터링·분석 권한자만</td>\n<td><strong>agent-core</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>효과</strong></p>\n<ul>\n<li><code>agent-test</code> 계정은 agent-common에는 있지만 <strong>agent-core엔 없으므로</strong> API 키와 로그를 OS 차원에서 <strong>자동 차단</strong>된다.</li>\n<li>코드 안에 별도 권한 체크를 안 넣어도 OS 권한 시스템이 강제. <strong>방어 계층(defense in depth)</strong> 확보.</li>\n<li>키 유출·로그 변조 사고가 나도 <strong>영향 범위(blast radius)</strong>가 좁은 그룹으로 한정됨.</li>\n</ul>\n<h3 id=\"3-3\">3-3. \"경고는 출력하되 종료하지 않는 항목\"을 분리한 운영상의 이유<a class=\"headerlink\" href=\"#3-3\" title=\"Permanent link\">#</a></h3>\n<p>monitor.sh에서 <strong>종료(<code>exit 1</code>)</strong>와 <strong>경고(<code>WARNING</code>만 출력)</strong>를 다음 기준으로 분리:</p>\n<table>\n<thead>\n<tr>\n<th>분류</th>\n<th>항목</th>\n<th>동작</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>즉시 종료 (exit 1)</strong></td>\n<td>앱 프로세스 미존재, 15034 포트 LISTEN 아님</td>\n<td>서비스 자체가 죽었거나 네트워크로 접근 불가 → <strong>서비스 중단 상태</strong></td>\n</tr>\n<tr>\n<td><strong>경고만 출력 (계속 진행)</strong></td>\n<td>방화벽 비활성, CPU/MEM/DISK 임계치 초과</td>\n<td>서비스는 살아있고, 즉시 조치는 필요하지만 <strong>모니터링 자체는 계속 돼야 함</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>운영상의 이유</strong></p>\n<ol>\n<li><strong>모니터링의 연속성</strong>: 임계치 초과 시 스크립트가 죽으면 그 순간의 자원 사용량 기록이 <code>monitor.log</code>에 안 남는다. <strong>장애를 분석할 단서가 사라짐</strong>.</li>\n<li><strong>장애 정의의 차이</strong>: \"프로세스/포트 없음\"은 <strong>서비스 다운</strong>이고, \"CPU 90% 초과\"는 <strong>성능 경고</strong>이다. 둘을 같은 무게로 다루면 알람이 과민해진다.</li>\n<li><strong>알람 시스템 연동</strong>: cron 종료 코드(<code>exit 1</code>)는 외부 알림 시스템과 연동되기 쉬움. 정말 중요한 것(서비스 다운)만 <code>exit 1</code>을 내야 알람이 신뢰성을 가짐.</li>\n<li><strong>사후 분석 자료 누적</strong>: 경고도 <code>monitor.log</code>에 기록되므로 시계열로 보면 \"CPU가 며칠째 임계 근처\"라는 추세를 발견 가능.</li>\n</ol>\n<h3 id=\"3-4\">3-4. <code>&gt;</code> 와 <code>&gt;&gt;</code> 차이, 로그 누적에 <code>&gt;&gt;</code>가 필요한 이유<a class=\"headerlink\" href=\"#3-4\" title=\"Permanent link\">#</a></h3>\n<table>\n<thead>\n<tr>\n<th>연산자</th>\n<th>동작</th>\n<th>결과</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>&gt;</code></td>\n<td>표준출력을 파일에 <strong>덮어쓰기</strong></td>\n<td>파일이 있으면 비우고 처음부터 다시 씀. 이전 내용 손실.</td>\n</tr>\n<tr>\n<td><code>&gt;&gt;</code></td>\n<td>표준출력을 파일에 <strong>이어 쓰기 (append)</strong></td>\n<td>파일이 있으면 끝에 추가. 이전 내용 보존.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>예시</strong></p>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"nb\">echo</span><span class=\"w\"> </span><span class=\"s2\">&quot;first&quot;</span><span class=\"w\">  </span>&gt;<span class=\"w\"> </span>out.log<span class=\"w\">    </span><span class=\"c1\"># out.log = &quot;first&quot;</span>\n<span class=\"nb\">echo</span><span class=\"w\"> </span><span class=\"s2\">&quot;second&quot;</span><span class=\"w\"> </span>&gt;<span class=\"w\"> </span>out.log<span class=\"w\">    </span><span class=\"c1\"># out.log = &quot;second&quot;  ← first가 사라짐</span>\n<span class=\"nb\">echo</span><span class=\"w\"> </span><span class=\"s2\">&quot;third&quot;</span><span class=\"w\"> </span>&gt;&gt;<span class=\"w\"> </span>out.log<span class=\"w\">    </span><span class=\"c1\"># out.log = &quot;second\\nthird&quot;  ← 추가됨</span>\n</code></pre></div>\n\n<p><strong>로그 누적에 <code>&gt;&gt;</code>가 필요한 이유</strong></p>\n<ul>\n<li>로그는 <strong>시계열 누적 기록</strong>이다. 매분 cron이 monitor.sh를 호출하는데, 만약 <code>&gt;</code>를 쓰면 매분 이전 분의 기록이 사라져 <strong>마지막 1줄만 남는다</strong>.</li>\n<li>monitor.sh §5의 <code>echo \"${LOG_LINE}\" &gt;&gt; \"${LOG_FILE}\"</code>이 그래서 반드시 <code>&gt;&gt;</code>여야 함.</li>\n<li>분석 도구(<code>report.sh</code>, <code>wc -l</code>, <code>tail</code>, <code>awk</code>)도 모두 \"여러 줄\"을 전제로 동작.</li>\n<li>마찬가지로 crontab에 적은 <code>&gt;&gt; /home/agent-admin/monitor.cron.log 2&gt;&amp;1</code>도 cron 표준출력·에러를 매분 누적하기 위함.</li>\n</ul>\n<hr />\n<h2 id=\"4\">항목 4 — 응용/확장<a class=\"headerlink\" href=\"#4\" title=\"Permanent link\">#</a></h2>\n<h3 id=\"4-1-nginx-monitorsh\">4-1. 모니터링 대상이 Nginx로 바뀐다면 monitor.sh의 핵심 변경 포인트<a class=\"headerlink\" href=\"#4-1-nginx-monitorsh\" title=\"Permanent link\">#</a></h3>\n<h4 id=\"nginx\">들어가기 전에 — Nginx 가 뭔가<a class=\"headerlink\" href=\"#nginx\" title=\"Permanent link\">#</a></h4>\n<blockquote>\n<p><strong>Nginx</strong> (\"엔진엑스\") 는 세상에서 가장 많이 쓰이는 <strong>웹 서버</strong> 중 하나다.\n누군가 브라우저에서 <code>https://example.com</code> 을 열면, 그 요청을 받아 HTML/이미지를 돌려보내거나, 뒤단의 다른 앱(파이썬·자바 등) 으로 요청을 넘겨주는 역할.</p>\n</blockquote>\n<p>우리 미션의 <code>agent-app</code> 과 비교해 보면 — <strong>둘 다 \"포트에서 듣고 있는 서버 프로그램\"</strong> 이라는 점은 같다. 그래서 monitor.sh 의 <strong>큰 구조(Health → Resource → Threshold → Log → Rotate)</strong> 는 그대로 재사용할 수 있고, <strong>세부 항목만</strong> 갈아 끼우면 된다. 어떤 부분이 어떻게 바뀌는지 하나씩 보자.</p>\n<h4 id=\"_1\">한눈에 보는 비교표<a class=\"headerlink\" href=\"#_1\" title=\"Permanent link\">#</a></h4>\n<table>\n<thead>\n<tr>\n<th>영역</th>\n<th>현재 (agent-app)</th>\n<th>Nginx 로 바꾸면</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>프로세스 이름</td>\n<td><code>agent-app</code></td>\n<td><code>nginx</code> (보통 master + worker 여러 개)</td>\n</tr>\n<tr>\n<td>듣는 포트</td>\n<td>15034 (단일 TCP)</td>\n<td>80 (HTTP) + 443 (HTTPS) 두 개</td>\n</tr>\n<tr>\n<td>동작 확인 방법</td>\n<td>\"포트가 열려 있나\"</td>\n<td>\"실제로 HTTP 응답을 주나\"(200 OK)</td>\n</tr>\n<tr>\n<td>로그 파일</td>\n<td><code>monitor.log</code> (우리가 직접 누적)</td>\n<td><code>access.log</code> + <code>error.log</code> (Nginx 가 자동으로 씀)</td>\n</tr>\n<tr>\n<td>추가 지표</td>\n<td>CPU/MEM/DISK</td>\n<td>위 + 요청 수, 5xx 비율, 워커 개수</td>\n</tr>\n<tr>\n<td>관리 방법</td>\n<td>직접 <code>nohup ./agent-app &amp;</code></td>\n<td><code>systemctl start/stop/reload nginx</code></td>\n</tr>\n</tbody>\n</table>\n<p>이제 각 항목을 풀어 설명한다.</p>\n<hr />\n<h4 id=\"1-pgrep\">(1) 프로세스 식별 — 같은 <code>pgrep</code> 이지만 한 단계 더<a class=\"headerlink\" href=\"#1-pgrep\" title=\"Permanent link\">#</a></h4>\n<p><strong>현재 monitor.sh 에서</strong>:</p>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"nv\">APP_PID</span><span class=\"o\">=</span><span class=\"s2\">&quot;</span><span class=\"k\">$(</span>pgrep<span class=\"w\"> </span>-x<span class=\"w\"> </span><span class=\"s2\">&quot;agent-app&quot;</span><span class=\"w\"> </span><span class=\"p\">|</span><span class=\"w\"> </span>head<span class=\"w\"> </span>-n1<span class=\"k\">)</span><span class=\"s2\">&quot;</span>\n</code></pre></div>\n\n<p><code>pgrep -x agent-app</code> 은 이름이 정확히 <code>agent-app</code> 인 프로세스의 PID 를 찾는다. agent-app 은 우리가 직접 띄운 단일 프로세스라 단순.</p>\n<p><strong>Nginx 로 바꾸면 두 가지 옵션</strong>:</p>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"c1\"># 옵션 A — 동일한 pgrep 패턴</span>\n<span class=\"nv\">NGINX_PID</span><span class=\"o\">=</span><span class=\"s2\">&quot;</span><span class=\"k\">$(</span>pgrep<span class=\"w\"> </span>-x<span class=\"w\"> </span>nginx<span class=\"w\"> </span><span class=\"p\">|</span><span class=\"w\"> </span>head<span class=\"w\"> </span>-n1<span class=\"k\">)</span><span class=\"s2\">&quot;</span>\n\n<span class=\"c1\"># 옵션 B — systemd 서비스 상태 직접 질의 (Nginx 는 보통 systemd 서비스로 동작)</span>\n<span class=\"k\">if</span><span class=\"w\"> </span>systemctl<span class=\"w\"> </span>is-active<span class=\"w\"> </span>--quiet<span class=\"w\"> </span>nginx<span class=\"p\">;</span><span class=\"w\"> </span><span class=\"k\">then</span>\n<span class=\"w\">    </span><span class=\"nb\">echo</span><span class=\"w\"> </span><span class=\"s2\">&quot;Nginx is running&quot;</span>\n<span class=\"k\">fi</span>\n</code></pre></div>\n\n<p><strong>왜 옵션 B 를 권장하나</strong> — Nginx 는 보통 <code>master process</code> 와 여러 <code>worker process</code> 로 구성된다.</p>\n<div class=\"codehilite\"><pre><span></span><code>$ pgrep -a nginx\n1234 nginx: master process /usr/sbin/nginx\n1235 nginx: worker process\n1236 nginx: worker process\n1237 nginx: worker process\n1238 nginx: worker process\n</code></pre></div>\n\n<p><code>pgrep -x nginx</code> 은 이 5개를 모두 잡아서 첫 PID 를 반환하는데, 어떤 게 잡힐지 매번 달라질 수 있다. 반면 <code>systemctl is-active</code> 는 <strong>\"서비스가 살아 있는가\"</strong> 라는 본질적 질문에 답하므로 더 안정적.</p>\n<p>→ Nginx 처럼 <strong>systemd 가 관리하는 서비스</strong>라면 <code>systemctl is-active</code> 가 더 정확.</p>\n<hr />\n<h4 id=\"2_1\">(2) 포트 — 단일에서 복수로<a class=\"headerlink\" href=\"#2_1\" title=\"Permanent link\">#</a></h4>\n<p><strong>현재</strong>: 15034 한 개만 확인.</p>\n<div class=\"codehilite\"><pre><span></span><code>sudo<span class=\"w\"> </span>ss<span class=\"w\"> </span>-tlnH<span class=\"w\"> </span><span class=\"p\">|</span><span class=\"w\"> </span>awk<span class=\"w\"> </span><span class=\"s1\">&#39;$4 ~ /:15034$/ {f=1} END{exit !f}&#39;</span>\n</code></pre></div>\n\n<p><strong>Nginx 로 바꾸면</strong>: 일반적으로 <strong>HTTP 80 + HTTPS 443</strong> 두 개를 동시에 듣는다. 둘 다 LISTEN 인지 확인해야 한다.</p>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"nv\">PORTS_OK</span><span class=\"o\">=</span><span class=\"m\">0</span>\n<span class=\"k\">for</span><span class=\"w\"> </span>port<span class=\"w\"> </span><span class=\"k\">in</span><span class=\"w\"> </span><span class=\"m\">80</span><span class=\"w\"> </span><span class=\"m\">443</span><span class=\"p\">;</span><span class=\"w\"> </span><span class=\"k\">do</span>\n<span class=\"w\">    </span><span class=\"k\">if</span><span class=\"w\"> </span>sudo<span class=\"w\"> </span>ss<span class=\"w\"> </span>-tlnH<span class=\"w\"> </span><span class=\"p\">|</span><span class=\"w\"> </span>awk<span class=\"w\"> </span>-v<span class=\"w\"> </span><span class=\"nv\">p</span><span class=\"o\">=</span><span class=\"s2\">&quot;:</span><span class=\"nv\">$port</span>$<span class=\"s2\">&quot;</span><span class=\"w\"> </span><span class=\"s1\">&#39;$4 ~ p {f=1} END{exit !f}&#39;</span><span class=\"p\">;</span><span class=\"w\"> </span><span class=\"k\">then</span>\n<span class=\"w\">        </span><span class=\"nb\">echo</span><span class=\"w\"> </span><span class=\"s2\">&quot;Port </span><span class=\"nv\">$port</span><span class=\"s2\"> LISTEN [OK]&quot;</span>\n<span class=\"w\">    </span><span class=\"k\">else</span>\n<span class=\"w\">        </span><span class=\"nb\">echo</span><span class=\"w\"> </span><span class=\"s2\">&quot;Port </span><span class=\"nv\">$port</span><span class=\"s2\"> not LISTEN [FAIL]&quot;</span>\n<span class=\"w\">        </span><span class=\"nv\">PORTS_OK</span><span class=\"o\">=</span><span class=\"m\">1</span>\n<span class=\"w\">    </span><span class=\"k\">fi</span>\n<span class=\"k\">done</span>\n<span class=\"o\">[[</span><span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"nv\">$PORTS_OK</span><span class=\"s2\">&quot;</span><span class=\"w\"> </span>!<span class=\"o\">=</span><span class=\"w\"> </span><span class=\"s2\">&quot;0&quot;</span><span class=\"w\"> </span><span class=\"o\">]]</span><span class=\"w\"> </span><span class=\"o\">&amp;&amp;</span><span class=\"w\"> </span><span class=\"nb\">exit</span><span class=\"w\"> </span><span class=\"m\">1</span>\n</code></pre></div>\n\n<p><strong>왜 둘 다 봐야 하나</strong> — HTTP 만 살아있고 HTTPS 가 죽으면 보안 접속을 못 하는 상태다. 사용자 입장에선 \"사이트가 안 열린다\" 라는 같은 증상이지만, 원인 진단을 빨리 하려면 어느 쪽이 죽었는지 분리해서 봐야 한다.</p>\n<hr />\n<h4 id=\"3_1\">(3) 헬스체크 — \"포트만 열려 있나\" → \"진짜 응답하나\"<a class=\"headerlink\" href=\"#3_1\" title=\"Permanent link\">#</a></h4>\n<p>이게 가장 큰 차이점이다. 한번 짚고 가자.</p>\n<p><strong>포트가 열려 있다 ≠ 정상 동작 중이다</strong></p>\n<p>다음 같은 상황을 생각해 보자:</p>\n<div class=\"codehilite\"><pre><span></span><code>포트 80 은 열려 있다 ✓\n그런데 Nginx 가 모든 요청에 500 Internal Server Error 만 돌려준다 ✗\n→ ss 로는 &quot;LISTEN [OK]&quot; 로 보이지만, 사용자는 사이트 못 씀.\n</code></pre></div>\n\n<p>이런 미묘한 고장(전문용어로 \"<strong>partial failure</strong>\") 을 잡으려면 <strong>실제 요청을 보내</strong> 응답을 봐야 한다.</p>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"c1\"># curl 로 실제 HTTP 응답 코드 받아오기</span>\n<span class=\"nv\">HTTP_CODE</span><span class=\"o\">=</span><span class=\"s2\">&quot;</span><span class=\"k\">$(</span>curl<span class=\"w\"> </span>-fsS<span class=\"w\"> </span>-o<span class=\"w\"> </span>/dev/null<span class=\"w\"> </span>-w<span class=\"w\"> </span><span class=\"s1\">&#39;%{http_code}&#39;</span><span class=\"w\"> </span><span class=\"se\">\\</span>\n<span class=\"w\">              </span>--connect-timeout<span class=\"w\"> </span><span class=\"m\">3</span><span class=\"w\"> </span>--max-time<span class=\"w\"> </span><span class=\"m\">5</span><span class=\"w\"> </span><span class=\"se\">\\</span>\n<span class=\"w\">              </span>http://127.0.0.1/<span class=\"w\"> </span><span class=\"o\">||</span><span class=\"w\"> </span><span class=\"nb\">echo</span><span class=\"w\"> </span><span class=\"m\">000</span><span class=\"k\">)</span><span class=\"s2\">&quot;</span>\n\n<span class=\"k\">if</span><span class=\"w\"> </span><span class=\"o\">[[</span><span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"nv\">$HTTP_CODE</span><span class=\"s2\">&quot;</span><span class=\"w\"> </span><span class=\"o\">==</span><span class=\"w\"> </span><span class=\"s2\">&quot;200&quot;</span><span class=\"w\"> </span><span class=\"o\">]]</span><span class=\"p\">;</span><span class=\"w\"> </span><span class=\"k\">then</span>\n<span class=\"w\">    </span><span class=\"nb\">echo</span><span class=\"w\"> </span><span class=\"s2\">&quot;HTTP health [OK]&quot;</span>\n<span class=\"k\">elif</span><span class=\"w\"> </span><span class=\"o\">[[</span><span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"nv\">$HTTP_CODE</span><span class=\"s2\">&quot;</span><span class=\"w\"> </span><span class=\"o\">==</span><span class=\"w\"> </span><span class=\"s2\">&quot;000&quot;</span><span class=\"w\"> </span><span class=\"o\">]]</span><span class=\"p\">;</span><span class=\"w\"> </span><span class=\"k\">then</span>\n<span class=\"w\">    </span><span class=\"nb\">echo</span><span class=\"w\"> </span><span class=\"s2\">&quot;HTTP health [FAIL] — 연결 자체 실패 (Nginx 죽음 / 방화벽)&quot;</span>\n<span class=\"w\">    </span><span class=\"nb\">exit</span><span class=\"w\"> </span><span class=\"m\">1</span>\n<span class=\"k\">else</span>\n<span class=\"w\">    </span><span class=\"nb\">echo</span><span class=\"w\"> </span><span class=\"s2\">&quot;HTTP health [WARN] — 응답 코드 </span><span class=\"nv\">$HTTP_CODE</span><span class=\"s2\">&quot;</span>\n<span class=\"k\">fi</span>\n</code></pre></div>\n\n<p><strong><code>curl</code> 옵션 풀이</strong> (자주 헷갈리는 부분):</p>\n<table>\n<thead>\n<tr>\n<th>옵션</th>\n<th>의미</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>-f</code></td>\n<td>HTTP 4xx/5xx 면 <code>curl</code> 자체가 실패로 끝나 (<code>exit 22</code>) — 종료코드로 분기 가능</td>\n</tr>\n<tr>\n<td><code>-s</code></td>\n<td>진행률 표시 같은 \"잡음\" 출력 안 함</td>\n</tr>\n<tr>\n<td><code>-S</code></td>\n<td>에러 메시지는 그래도 출력 (silent 모드에서도)</td>\n</tr>\n<tr>\n<td><code>-o /dev/null</code></td>\n<td>응답 본문은 화면이 아닌 휴지통으로 — HTML 이 콘솔로 쏟아지지 않음</td>\n</tr>\n<tr>\n<td><code>-w '%{http_code}'</code></td>\n<td>\"응답 헤더에서 HTTP 상태 코드만 추출해 출력해 줘\"</td>\n</tr>\n<tr>\n<td><code>--connect-timeout 3</code></td>\n<td>3초 안에 TCP 연결 안 되면 포기 (네트워크 멈춤 방지)</td>\n</tr>\n<tr>\n<td><code>--max-time 5</code></td>\n<td>전체 요청이 5초 넘으면 포기</td>\n</tr>\n<tr>\n<td><code>\\|\\| echo 000</code></td>\n<td>curl 자체가 실패하면 <code>000</code> 을 출력 → 분기 처리용 placeholder</td>\n</tr>\n</tbody>\n</table>\n<p>→ 이렇게 하면 \"포트는 열렸지만 실제론 망가진\" 상태까지 잡을 수 있다.</p>\n<hr />\n<h4 id=\"4-1-nginx-2\">(4) 로그 — \"직접 만든 1개\" → \"Nginx 가 만드는 2개\"<a class=\"headerlink\" href=\"#4-1-nginx-2\" title=\"Permanent link\">#</a></h4>\n<p><strong>현재</strong>: monitor.sh 가 직접 <code>/var/log/agent-app/monitor.log</code> 에 한 줄씩 누적한다 (스크립트가 만들어서 쓰는 로그).</p>\n<p><strong>Nginx 로 바꾸면</strong>: Nginx 가 자체적으로 두 종류의 로그를 자동 생성한다.</p>\n<table>\n<thead>\n<tr>\n<th>파일</th>\n<th>용도</th>\n<th>예시 한 줄</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>/var/log/nginx/access.log</code></td>\n<td>접속 요청 1건당 1줄 — \"누가 언제 어디로 요청했고 응답은 뭐였나\"</td>\n<td><code>192.168.1.5 - - [17/May/2026:18:23:11 +0900] \"GET / HTTP/1.1\" 200 1234 \"-\" \"Mozilla/5.0\"</code></td>\n</tr>\n<tr>\n<td><code>/var/log/nginx/error.log</code></td>\n<td>에러·경고 — 설정 문제, upstream 죽음 등</td>\n<td><code>2026/05/17 18:23:42 [error] 1235#0: *17 connect() failed (111: Connection refused)</code></td>\n</tr>\n</tbody>\n</table>\n<p>monitor.sh 입장에선 <strong>이 두 파일을 \"읽어서 분석\"</strong> 하는 쪽으로 역할이 바뀐다.</p>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"c1\"># 최근 1000건 중 5xx 에러 응답 수 세기</span>\n<span class=\"nv\">RECENT_5XX</span><span class=\"o\">=</span><span class=\"k\">$(</span>sudo<span class=\"w\"> </span>tail<span class=\"w\"> </span>-n<span class=\"w\"> </span><span class=\"m\">1000</span><span class=\"w\"> </span>/var/log/nginx/access.log<span class=\"w\"> </span><span class=\"se\">\\</span>\n<span class=\"w\">             </span><span class=\"p\">|</span><span class=\"w\"> </span>awk<span class=\"w\"> </span><span class=\"s1\">&#39;$9 ~ /^5/ {c++} END {print c+0}&#39;</span><span class=\"k\">)</span>\n\n<span class=\"k\">if</span><span class=\"w\"> </span><span class=\"o\">[[</span><span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"nv\">$RECENT_5XX</span><span class=\"s2\">&quot;</span><span class=\"w\"> </span>-gt<span class=\"w\"> </span><span class=\"m\">10</span><span class=\"w\"> </span><span class=\"o\">]]</span><span class=\"p\">;</span><span class=\"w\"> </span><span class=\"k\">then</span>\n<span class=\"w\">    </span><span class=\"nb\">echo</span><span class=\"w\"> </span><span class=\"s2\">&quot;[WARNING] 최근 1000건 중 5xx 응답이 </span><span class=\"nv\">$RECENT_5XX</span><span class=\"s2\"> 건&quot;</span>\n<span class=\"k\">fi</span>\n</code></pre></div>\n\n<p><strong>한 줄씩 설명</strong>:</p>\n<ul>\n<li><code>tail -n 1000 access.log</code> : 최근 1000줄만 보기 (전체 파일은 너무 크니까)</li>\n<li><code>awk '$9 ~ /^5/ {c++}'</code> : 9번째 컬럼(HTTP 상태 코드)이 <code>5</code> 로 시작하면 카운터 증가</li>\n<li><code>END {print c+0}</code> : 마지막에 카운트 출력. <code>c+0</code> 은 \"비어있으면 0으로\" 처리.</li>\n<li><code>[[ \"$RECENT_5XX\" -gt 10 ]]</code> : 10건 초과면 경고</li>\n</ul>\n<p>5xx 비율이 갑자기 튀면 → 백엔드 죽음 / 디스크 가득 / DB 다운 등 신호. 우리 임계값 경고 패턴(CPU&gt;20%) 과 같은 흐름.</p>\n<hr />\n<h4 id=\"5-nginx\">(5) 임계값 — Nginx 만의 새 지표<a class=\"headerlink\" href=\"#5-nginx\" title=\"Permanent link\">#</a></h4>\n<p><strong>현재 monitor.sh 의 임계값</strong>:</p>\n<div class=\"codehilite\"><pre><span></span><code>CPU &gt; 20%   → WARNING\nMEM &gt; 10%   → WARNING\nDISK &gt; 80%  → WARNING\n</code></pre></div>\n\n<p>CPU/MEM/DISK 는 운영체제 차원의 보편적 지표라 <strong>Nginx 로 바꿔도 그대로</strong> 가져간다. <strong>추가로 챙길 Nginx 고유 지표</strong>가 있다.</p>\n<table>\n<thead>\n<tr>\n<th>새 지표</th>\n<th>측정 방법</th>\n<th>임계값 예</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>5xx 응답 비율</strong></td>\n<td>위에서 본 <code>awk '$9 ~ /^5/'</code></td>\n<td>1% 초과 시 WARNING</td>\n</tr>\n<tr>\n<td><strong>분당 요청 수 (RPS)</strong></td>\n<td><code>awk '$4 ~ /현재시각/'</code></td>\n<td>평소의 10배 초과 시 (DDoS 의심)</td>\n</tr>\n<tr>\n<td><strong>워커 프로세스 수</strong></td>\n<td><code>pgrep -c nginx</code> (master + worker 총 개수)</td>\n<td>설정값과 불일치 시</td>\n</tr>\n<tr>\n<td><strong>upstream 타임아웃</strong></td>\n<td><code>grep \"upstream timed out\" error.log</code></td>\n<td>분당 5건 초과</td>\n</tr>\n</tbody>\n</table>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"c1\"># 워커 수 점검 예시</span>\n<span class=\"nv\">EXPECTED_WORKERS</span><span class=\"o\">=</span><span class=\"m\">4</span>\n<span class=\"nv\">ACTUAL</span><span class=\"o\">=</span><span class=\"k\">$(</span>pgrep<span class=\"w\"> </span>-c<span class=\"w\"> </span>nginx<span class=\"k\">)</span><span class=\"w\">   </span><span class=\"c1\"># master 1개 포함</span>\n<span class=\"k\">if</span><span class=\"w\"> </span><span class=\"o\">[[</span><span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"nv\">$ACTUAL</span><span class=\"s2\">&quot;</span><span class=\"w\"> </span>-ne<span class=\"w\"> </span><span class=\"k\">$((</span><span class=\"nv\">EXPECTED_WORKERS</span><span class=\"w\"> </span><span class=\"o\">+</span><span class=\"w\"> </span><span class=\"m\">1</span><span class=\"k\">))</span><span class=\"w\"> </span><span class=\"o\">]]</span><span class=\"p\">;</span><span class=\"w\"> </span><span class=\"k\">then</span>\n<span class=\"w\">    </span><span class=\"nb\">echo</span><span class=\"w\"> </span><span class=\"s2\">&quot;[WARNING] worker 개수 이상 (예상 </span><span class=\"k\">$((</span><span class=\"nv\">EXPECTED_WORKERS</span><span class=\"o\">+</span><span class=\"m\">1</span><span class=\"k\">))</span><span class=\"s2\"> / 실제 </span><span class=\"nv\">$ACTUAL</span><span class=\"s2\">)&quot;</span>\n<span class=\"k\">fi</span>\n</code></pre></div>\n\n<hr />\n<h4 id=\"_2\">종합 — 어떤 부분이 안 바뀌나<a class=\"headerlink\" href=\"#_2\" title=\"Permanent link\">#</a></h4>\n<p>핵심은 \"<strong>구조는 그대로, 세부만 교체</strong>\" 다. monitor.sh 전체를 새로 쓸 필요가 없다.</p>\n<div class=\"codehilite\"><pre><span></span><code>┌─────────────────────────────────────────────────────────┐\n│  [구조]  Health Check → Resource → Threshold            │\n│             → Log Append → Rotate                       │\n│                                                          │\n│  [재사용 가능 — 그대로]                                  │\n│    • set -u, set -o pipefail                            │\n│    • CPU/MEM/DISK 추출 awk 한 줄                        │\n│    • [WARNING] 출력 패턴                                │\n│    • 로그 로테이션 로직 (10MB × 10개)                   │\n│    • exit 1 vs WARNING 분기 정책                        │\n│                                                          │\n│  [갈아 끼우는 곳 — 변수·명령 4~5 군데]                  │\n│    • APP_NAME=agent-app    → APP_NAME=nginx             │\n│    • APP_PORT=15034         → APP_PORTS=(80 443)        │\n│    • 단순 LISTEN 체크       → curl HTTP 응답 체크 추가  │\n│    • monitor.log 쓰기       → access/error.log 읽기 추가│\n│    • (선택) 워커 수 점검 추가                            │\n└─────────────────────────────────────────────────────────┘\n</code></pre></div>\n\n<p>이게 monitor.sh 같은 <strong>잘 구조화된 자동화 스크립트의 본질적 가치</strong> 다 — 한 번 잘 짜두면 모니터링 대상이 바뀌어도 80% 는 재사용. <strong>\"무엇\" 만 바꾸고 \"어떻게\" 는 안 바꿔도 된다.</strong></p>\n<hr />\n<h4 id=\"_3\">한 줄 요약<a class=\"headerlink\" href=\"#_3\" title=\"Permanent link\">#</a></h4>\n<blockquote>\n<p><strong>프로세스명·포트·헬스체크 방식·로그 위치·임계값 정의</strong> 다섯 가지가 핵심 교체 포인트.\n구조(Health → Resource → Threshold → Log → Rotate) 는 그대로.\nNginx 같은 systemd 서비스라면 <code>systemctl is-active</code> + <code>curl</code> 응답 검증을 함께 쓰는 게 정석.</p>\n</blockquote>\n<h3 id=\"4-2\">4-2. 프로세스는 살아있는데 포트가 안 열리는 상황 — 원인 후보 + 확인 순서<a class=\"headerlink\" href=\"#4-2\" title=\"Permanent link\">#</a></h3>\n<p>이건 흔한 trouble case이고 진단 순서가 중요하다.</p>\n<p><strong>원인 후보 (가능성 순)</strong></p>\n<ol>\n<li><strong>포트 바인딩 실패</strong> — 다른 프로세스가 같은 포트를 선점.</li>\n<li><strong>부팅 단계 지연</strong> — 프로세스는 떴지만 LISTEN 준비 전 (DB 연결 등 대기 중).</li>\n<li><strong>잘못된 인터페이스 바인딩</strong> — <code>127.0.0.1:15034</code>만 듣는데 외부에서 접근.</li>\n<li><strong>방화벽 차단</strong> — 프로세스는 LISTEN 중이지만 UFW/iptables가 차단.</li>\n<li><strong>권한 문제</strong> — 1024 미만 포트를 비-root가 binding 시도 → 권한 거부.</li>\n<li><strong>앱 내부 에러</strong> — 시작했다가 listen 직전 crash, supervisor가 재시작 중인 상태.</li>\n</ol>\n<p><strong>확인 순서</strong></p>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"c1\"># 1. 프로세스 진짜 살아있는지 (좀비/멈춤 아닌지)</span>\nps<span class=\"w\"> </span>-eo<span class=\"w\"> </span>pid,stat,cmd<span class=\"w\"> </span><span class=\"p\">|</span><span class=\"w\"> </span>grep<span class=\"w\"> </span>agent-app\n<span class=\"c1\"># STAT 컬럼: R(running) / S(sleeping)은 정상, Z(zombie) / D(uninterruptible)면 문제</span>\n\n<span class=\"c1\"># 2. 포트가 실제로 어떤 프로세스/인터페이스에 묶였는지</span>\nsudo<span class=\"w\"> </span>ss<span class=\"w\"> </span>-tlnp<span class=\"w\"> </span><span class=\"p\">|</span><span class=\"w\"> </span>grep<span class=\"w\"> </span><span class=\"m\">15034</span>\n<span class=\"c1\"># 결과 없음 → 아무도 LISTEN 안 함</span>\n<span class=\"c1\"># 127.0.0.1:15034 → loopback만 → 외부 접근 불가</span>\n\n<span class=\"c1\"># 3. 같은 포트를 다른 프로세스가 잡고 있는지</span>\nsudo<span class=\"w\"> </span>lsof<span class=\"w\"> </span>-i<span class=\"w\"> </span>:15034\n<span class=\"c1\"># 또는 sudo fuser -n tcp 15034</span>\n\n<span class=\"c1\"># 4. 앱 로그에서 listen 실패 메시지 확인</span>\njournalctl<span class=\"w\"> </span>-u<span class=\"w\"> </span>agent-app<span class=\"w\"> </span>-n<span class=\"w\"> </span><span class=\"m\">50</span><span class=\"w\">          </span><span class=\"c1\"># systemd 서비스인 경우</span>\n<span class=\"c1\"># 또는 직접 로그 파일</span>\ntail<span class=\"w\"> </span>-n<span class=\"w\"> </span><span class=\"m\">100</span><span class=\"w\"> </span>/var/log/agent-app/app.log\n\n<span class=\"c1\"># 5. 방화벽 차단 여부</span>\nsudo<span class=\"w\"> </span>ufw<span class=\"w\"> </span>status<span class=\"w\"> </span>numbered\nsudo<span class=\"w\"> </span>iptables<span class=\"w\"> </span>-L<span class=\"w\"> </span>-n<span class=\"w\"> </span><span class=\"p\">|</span><span class=\"w\"> </span>grep<span class=\"w\"> </span><span class=\"m\">15034</span>\n\n<span class=\"c1\"># 6. SELinux/AppArmor 같은 강제 접근제어 (있다면)</span>\nsudo<span class=\"w\"> </span>dmesg<span class=\"w\"> </span><span class=\"p\">|</span><span class=\"w\"> </span>tail<span class=\"w\"> </span>-50\n</code></pre></div>\n\n<p>진단 결과에 따라:\n- \"LISTEN 자체가 없음\" → 앱 로그 → 코드 결함 또는 의존성 문제\n- \"127.0.0.1로만 LISTEN\" → 앱 설정 (<code>bind = '0.0.0.0'</code> 등) 변경\n- \"다른 PID가 점유\" → 그 프로세스 종료 또는 포트 변경\n- \"LISTEN OK인데 외부 안 됨\" → 방화벽 / 네트워크 ACL</p>\n<h3 id=\"4-3\">4-3. 로그가 급증해 디스크가 가득 찰 위험 — 단기 / 중기 대응<a class=\"headerlink\" href=\"#4-3\" title=\"Permanent link\">#</a></h3>\n<p><strong>단기 (5분 내 조치)</strong></p>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"c1\"># 1. 디스크 사용량 즉시 파악</span>\ndf<span class=\"w\"> </span>-h<span class=\"w\"> </span>/var\nsudo<span class=\"w\"> </span>du<span class=\"w\"> </span>-sh<span class=\"w\"> </span>/var/log/*<span class=\"w\"> </span><span class=\"p\">|</span><span class=\"w\"> </span>sort<span class=\"w\"> </span>-h<span class=\"w\"> </span><span class=\"p\">|</span><span class=\"w\"> </span>tail<span class=\"w\"> </span>-10\n\n<span class=\"c1\"># 2. 가장 큰 로그 파일 비우기 (truncate — 프로세스 핸들 유지)</span>\nsudo<span class=\"w\"> </span>truncate<span class=\"w\"> </span>-s<span class=\"w\"> </span><span class=\"m\">0</span><span class=\"w\"> </span>/var/log/agent-app/monitor.log\n<span class=\"c1\"># rm 으로 지우면 프로세스가 여전히 file descriptor를 잡고 있어 디스크가 안 비워짐.</span>\n<span class=\"c1\"># truncate -s 0 는 안전하게 0 바이트로 만든다.</span>\n\n<span class=\"c1\"># 3. 보관 가능한 로그는 즉시 압축</span>\nsudo<span class=\"w\"> </span>gzip<span class=\"w\"> </span>/var/log/agent-app/monitor.log.<span class=\"o\">{</span><span class=\"m\">1</span>..9<span class=\"o\">}</span><span class=\"w\"> </span><span class=\"m\">2</span>&gt;/dev/null\n</code></pre></div>\n\n<p><strong>중기 (당일~주간 조치)</strong></p>\n<ol>\n<li>\n<p><strong>로그 로테이션 정책 강화</strong>\n   - 현재 10MB × 10개 = 100MB 한계 → 더 짧은 주기로 (예: 5MB × 5개)\n   - 또는 <a href=\"../../src/archive_logs.sh\">archive_logs.sh</a>로 <strong>7일 이후 gzip 압축</strong>, 30일 이후 삭제 정책 강제</p>\n</li>\n<li>\n<p><strong>로그 레벨 검토</strong>\n   - DEBUG/INFO 폭주가 원인이라면 운영에선 WARN 이상만 기록하도록 앱 설정 변경\n   - monitor.sh는 한 줄/분이라 자체 폭주 가능성 낮지만, agent-app의 로그가 원인일 수 있음</p>\n</li>\n<li>\n<p><strong>별도 파티션 분리</strong>\n   - <code>/var/log</code>를 별도 LVM/마운트로 분리 → 다른 시스템 영역에 영향 없게</p>\n</li>\n<li>\n<p><strong>모니터링 알람 추가</strong>\n   - monitor.sh의 DISK 임계값을 80% → 70%로 낮추고, 90% 이상 시 cron이 자동으로 archive_logs.sh를 호출하도록 chain\n   - 외부 알림 (메일, 슬랙) 연계해 디스크 75% 시점에 운영자 알림</p>\n</li>\n<li>\n<p><strong>로그 외부 전송</strong>\n   - 장기 보존이 필요하면 rsyslog/logstash로 원격 수집 서버에 전송 → 로컬에는 단기만 보관</p>\n</li>\n</ol>\n<hr />\n<h2 id=\"5-100\">항목 5 — 보너스 (크레딧 100)<a class=\"headerlink\" href=\"#5-100\" title=\"Permanent link\">#</a></h2>\n<h3 id=\"1-reportsh\">보너스 1 — report.sh: 통계 리포트<a class=\"headerlink\" href=\"#1-reportsh\" title=\"Permanent link\">#</a></h3>\n<p><a href=\"../../src/report.sh\">report.sh</a>는 monitor.log를 후처리해 평균/최대/최소를 출력한다.</p>\n<ul>\n<li>인자 없이 실행: 전체 로그 통계</li>\n<li>두 시각 인자: 그 구간만 통계\n  <code>bash\n  ./report.sh \"2026-05-11 12:00:00\" \"2026-05-11 13:00:00\"</code></li>\n<li>핵심 도구: <code>awk</code>로 한 번에 합/개수/최대/최소 산출. 외부 의존성 0.</li>\n</ul>\n<h3 id=\"2-archive_logssh\">보너스 2 — archive_logs.sh: 시간 기반 보존 정책<a class=\"headerlink\" href=\"#2-archive_logssh\" title=\"Permanent link\">#</a></h3>\n<p><a href=\"../../src/archive_logs.sh\">archive_logs.sh</a>는 cron으로 매일 03:10에 실행되며:</p>\n<ul>\n<li>7일 경과 <code>*.log</code> → <code>gzip</code> 후 <code>/var/log/monitor/agent-app/archive/</code>로 이동</li>\n<li>30일 경과 <code>*.gz</code> 삭제</li>\n<li>디렉토리 미존재/권한 부족/대상 0개 등 예외 상황에서 안전 종료(WARNING 출력 후 exit 0)</li>\n</ul>\n<blockquote>\n<p><strong>운영상의 의미</strong>: monitor.sh의 size-based rotation(즉시성)과 archive_logs.sh의 time-based archive(보존)가 <strong>2단 방어</strong>를 이룬다. 폭주는 monitor.sh가 막고, 일상 누적은 archive_logs.sh가 정리.</p>\n</blockquote>\n<hr />\n<h2 id=\"_4\">참고 — 핵심 파일 위치<a class=\"headerlink\" href=\"#_4\" title=\"Permanent link\">#</a></h2>\n<table>\n<thead>\n<tr>\n<th>파일</th>\n<th>역할</th>\n<th>위치</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>monitor.sh</code></td>\n<td>분당 모니터링 + 로그 + 로테이션</td>\n<td><code>$AGENT_HOME/bin/monitor.sh</code></td>\n</tr>\n<tr>\n<td><code>agent-app</code></td>\n<td>데모 애플리케이션 (Boot Sequence + LISTEN)</td>\n<td><code>$AGENT_HOME/agent-app</code></td>\n</tr>\n<tr>\n<td><code>report.sh</code></td>\n<td>로그 통계 리포트</td>\n<td><code>$AGENT_HOME/bin/report.sh</code></td>\n</tr>\n<tr>\n<td><code>archive_logs.sh</code></td>\n<td>시간 기반 압축·삭제</td>\n<td><code>$AGENT_HOME/bin/archive_logs.sh</code></td>\n</tr>\n<tr>\n<td><code>01_*.sh ~ 07_*.sh</code></td>\n<td>환경 셋업 7 단계 (SSH·UFW·계정·ACL·env·deploy·cron)</td>\n<td><code>src/</code></td>\n</tr>\n<tr>\n<td><code>00_run_all.sh</code></td>\n<td>01~07 일괄 실행 wrapper</td>\n<td><code>src/</code></td>\n</tr>\n<tr>\n<td><code>요구사항_수행_내역서.md</code></td>\n<td>단계별 셋업·검증 가이드</td>\n<td>(작업 디렉토리 루트)</td>\n</tr>\n</tbody>\n</table>", "toc": "<div class=\"toc\">\n<ul>\n<li><a href=\"#1\">항목 1 — 구현 완성 체크리스트</a><ul>\n<li><a href=\"#1-1-ssh-20022-root\">1-1. SSH 포트가 20022로 변경되었고, Root 원격 접속이 차단되었는가? — ✅ 예</a></li>\n<li><a href=\"#1-2-20022tcp-15034tcp-ufw\">1-2. 방화벽이 활성화되어 있고, 20022/tcp · 15034/tcp만 허용되는가? — ✅ 예 (UFW 선택)</a></li>\n<li><a href=\"#1-3-agent-admindevtest-agent-commoncore\">1-3. agent-admin/dev/test 계정과 agent-common/core 그룹이 요구사항대로 구성되어 있는가? — ✅ 예</a></li>\n<li><a href=\"#1-4-boot-sequence-5-ok-agent-ready\">1-4. Boot Sequence 5단계 [OK] 통과 + \"Agent READY\" 출력 — ✅ 예</a></li>\n<li><a href=\"#1-5-monitorsh-exit-1\">1-5. monitor.sh가 프로세스/포트 점검 후 비정상 시 exit 1로 종료되는가? — ✅ 예</a></li>\n<li><a href=\"#1-6-varlogagent-appmonitorlog\">1-6. /var/log/agent-app/monitor.log가 지정 포맷으로 누적 기록되는가? — ✅ 예</a></li>\n<li><a href=\"#1-7-cron-monitorlog\">1-7. cron 매분 실행으로 monitor.log가 자동 증가하는가? — ✅ 예</a></li>\n<li><a href=\"#1-8-monitorlog-10mb10\">1-8. monitor.log 용량 관리(10MB/10개)가 설정·동작하는가? — ✅ 예</a></li>\n</ul>\n</li>\n<li><a href=\"#2\">항목 2 — 구현 방식 설명</a><ul>\n<li><a href=\"#2-1-pgrep-ss\">2-1. 프로세스 식별(pgrep) · 포트 확인(ss) 명령과 선택 이유</a></li>\n<li><a href=\"#2-2-cpumemdisk\">2-2. CPU/MEM/DISK 추출·파싱 방식과 로그 포맷 고정 이유</a></li>\n<li><a href=\"#2-3-vs\">2-3. 소유자 vs 실행자 권한 정책 — 어떻게 만족시켰는가</a></li>\n<li><a href=\"#2-4-logrotate\">2-4. 로그 용량 관리 — logrotate가 아니라 스크립트로 구현한 이유</a></li>\n</ul>\n</li>\n<li><a href=\"#3\">항목 3 — 보안/운영 원칙</a><ul>\n<li><a href=\"#3-1-ssh-root\">3-1. SSH 포트 변경 + Root 차단이 왜 보안에 효과적인가 (위협 모델 관점)</a></li>\n<li><a href=\"#3-2-api_keys-agent-core\">3-2. api_keys · 로그를 agent-core로 제한한 이유 — 최소 권한 원칙</a></li>\n<li><a href=\"#3-3\">3-3. \"경고는 출력하되 종료하지 않는 항목\"을 분리한 운영상의 이유</a></li>\n<li><a href=\"#3-4\">3-4. &gt; 와 &gt;&gt; 차이, 로그 누적에 &gt;&gt;가 필요한 이유</a></li>\n</ul>\n</li>\n<li><a href=\"#4\">항목 4 — 응용/확장</a><ul>\n<li><a href=\"#4-1-nginx-monitorsh\">4-1. 모니터링 대상이 Nginx로 바뀐다면 monitor.sh의 핵심 변경 포인트</a><ul>\n<li><a href=\"#nginx\">들어가기 전에 — Nginx 가 뭔가</a></li>\n<li><a href=\"#_1\">한눈에 보는 비교표</a></li>\n<li><a href=\"#1-pgrep\">(1) 프로세스 식별 — 같은 pgrep 이지만 한 단계 더</a></li>\n<li><a href=\"#2_1\">(2) 포트 — 단일에서 복수로</a></li>\n<li><a href=\"#3_1\">(3) 헬스체크 — \"포트만 열려 있나\" → \"진짜 응답하나\"</a></li>\n<li><a href=\"#4-1-nginx-2\">(4) 로그 — \"직접 만든 1개\" → \"Nginx 가 만드는 2개\"</a></li>\n<li><a href=\"#5-nginx\">(5) 임계값 — Nginx 만의 새 지표</a></li>\n<li><a href=\"#_2\">종합 — 어떤 부분이 안 바뀌나</a></li>\n<li><a href=\"#_3\">한 줄 요약</a></li>\n</ul>\n</li>\n<li><a href=\"#4-2\">4-2. 프로세스는 살아있는데 포트가 안 열리는 상황 — 원인 후보 + 확인 순서</a></li>\n<li><a href=\"#4-3\">4-3. 로그가 급증해 디스크가 가득 찰 위험 — 단기 / 중기 대응</a></li>\n</ul>\n</li>\n<li><a href=\"#5-100\">항목 5 — 보너스 (크레딧 100)</a><ul>\n<li><a href=\"#1-reportsh\">보너스 1 — report.sh: 통계 리포트</a></li>\n<li><a href=\"#2-archive_logssh\">보너스 2 — archive_logs.sh: 시간 기반 보존 정책</a></li>\n</ul>\n</li>\n<li><a href=\"#_4\">참고 — 핵심 파일 위치</a></li>\n</ul>\n</div>\n"}, {"title": "스크립트 설명", "file": "docs/md/스크립트_설명.md", "html": "<h1 id=\"src\">쉘 스크립트 처음부터 — <code>src/</code> 전체 한 줄씩 읽기<a class=\"headerlink\" href=\"#src\" title=\"Permanent link\">#</a></h1>\n<p>이 문서는 <code>src/</code> 아래 <strong>11 개 쉘 스크립트가 왜 그렇게 쓰였는지</strong> 를 처음 보는 사람 기준으로 설명한다. 11 개 모두 한 가지씩만 단단하게 하는 작은 스크립트라 길어 보여도 패턴은 몇 개 안 된다.</p>\n<hr />\n<h2 id=\"0\">0. 전체 구조 한눈에<a class=\"headerlink\" href=\"#0\" title=\"Permanent link\">#</a></h2>\n<div class=\"codehilite\"><pre><span></span><code>src/\n├── 00_run_all.sh                ← wrapper : 01~07 을 순서대로 실행\n│\n├── 01_ssh_hardening.sh          ┐\n├── 02_firewall_allowlist.sh     │\n├── 03_users_and_groups.sh       │ setup 7 단계 (1회성)\n├── 04_directories_and_acl.sh    │ sudo 가 가능한 관리자 계정에서 실행\n├── 05_env_and_keyfile.sh        │\n├── 06_deploy_app_and_scripts.sh │\n├── 07_cron_schedule.sh          ┘\n│\n├── monitor.sh                   ┐\n├── report.sh                    │ 운영 (반복 실행)\n└── archive_logs.sh              ┘ agent-admin 계정 / cron 으로 동작\n</code></pre></div>\n\n<p><strong>두 갈래로 나뉜다.</strong></p>\n<ul>\n<li><strong>setup 7 단계 (<code>01_…</code> ~ <code>07_…</code>)</strong> — 머신을 처음 셋업할 때 한 번만 돌린다. 각 단계는 <strong>하나의 주제</strong>(SSH, 방화벽, 계정, …) 만 다룬다.</li>\n<li><strong>운영 3 종 (<code>monitor.sh</code>, <code>report.sh</code>, <code>archive_logs.sh</code>)</strong> — setup 이 끝난 뒤 cron 또는 손으로 계속 호출하는 스크립트. agent-app 의 상태를 측정·집계·보관한다.</li>\n</ul>\n<p><code>00_run_all.sh</code> 는 setup 7 단계를 <strong>순서대로</strong> 부르는 wrapper. \"한 번에\" 가 필요할 때만 쓰고, 학습 목적이라면 01~07 을 손으로 한 줄씩 돌려 출력을 확인하는 게 좋다.</p>\n<hr />\n<h2 id=\"1-1\">1. 쉘 스크립트가 뭐냐 — 1 분 요약<a class=\"headerlink\" href=\"#1-1\" title=\"Permanent link\">#</a></h2>\n<p>쉘 스크립트는 <strong>터미널에 한 줄씩 치던 명령어를 파일에 모아둔 것</strong>이다. 그뿐이다.</p>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"nb\">echo</span><span class=\"w\"> </span><span class=\"s2\">&quot;hello&quot;</span>\nls<span class=\"w\"> </span>/tmp\ndate\n</code></pre></div>\n\n<p>이걸 <code>hello.sh</code> 라는 파일에 저장한 뒤 <code>bash hello.sh</code> 라고 실행하면, 위 세 줄을 순서대로 터미널에 친 것과 똑같이 동작한다. 변수·반복문·조건문은 그 위에 얹는 편의 기능.</p>\n<hr />\n<h2 id=\"15\">1.5 처음 만나는 단어들 — 한 페이지 사전<a class=\"headerlink\" href=\"#15\" title=\"Permanent link\">#</a></h2>\n<p>스크립트를 한 줄도 읽기 전에 알아두면 좋은 단어들. 뒤에서 자꾸 나온다.</p>\n<table>\n<thead>\n<tr>\n<th>단어</th>\n<th>한 줄 설명</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>종료 코드 (exit code)</strong></td>\n<td>모든 명령은 끝날 때 0~255 의 숫자를 반환한다. <strong>0 = 성공</strong>, 그 외 = 실패. 사람 직관과 반대라 처음에 헷갈린다. <code>echo $?</code> 로 직전 명령의 종료 코드를 볼 수 있다.</td>\n</tr>\n<tr>\n<td><strong>표준 출력 (stdout, 1번)</strong></td>\n<td>명령이 \"정상 결과\" 를 흘려보내는 통로. <code>echo hello</code> 의 <code>hello</code> 가 여기로.</td>\n</tr>\n<tr>\n<td><strong>표준 에러 (stderr, 2번)</strong></td>\n<td>명령이 \"에러 메시지\" 를 흘려보내는 별개 통로. 화면에는 같이 섞여 보이지만 내부적으론 따로다.</td>\n</tr>\n<tr>\n<td><strong>표준 입력 (stdin, 0번)</strong></td>\n<td>명령이 \"읽어 들이는\" 통로. 키보드 입력이나 파이
