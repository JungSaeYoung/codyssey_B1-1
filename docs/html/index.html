<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codyssey B1-1 — Documentation</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">

  <style>
    :root {
      --bg:#ffffff; --bg-alt:#f6f8fa; --bg-soft:#eef2f5;
      --fg:#1f2328; --fg-muted:#656d76;
      --border:#d0d7de; --accent:#0969da; --accent-soft:#ddf4ff;
      --code-bg:#f6f8fa;
      --side-w:300px;
    }
    [data-theme="dark"] {
      --bg:#0d1117; --bg-alt:#161b22; --bg-soft:#1c2330;
      --fg:#e6edf3; --fg-muted:#8b949e;
      --border:#30363d; --accent:#58a6ff; --accent-soft:#1f2d3d;
      --code-bg:#161b22;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,
                   'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
      background: var(--bg); color: var(--fg);
      line-height: 1.75; font-size: 16px;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Layout ─────────────────────────────────────────────────────── */
    aside.sidebar {
      position: fixed; top: 0; left: 0; bottom: 0; width: var(--side-w);
      background: var(--bg-alt); border-right: 1px solid var(--border);
      padding: 24px 20px; overflow-y: auto;
    }
    main.content {
      margin-left: var(--side-w); max-width: 920px;
      padding: 56px 64px 120px;
    }
    @media (max-width: 900px) {
      aside.sidebar {
        transform: translateX(-100%); transition: transform .2s; z-index: 50;
        box-shadow: 0 0 24px rgba(0,0,0,.2);
      }
      aside.sidebar.open { transform: translateX(0); }
      main.content { margin-left: 0; padding: 24px; }
      #menu-btn { display: flex !important; }
    }

    /* ── Sidebar ────────────────────────────────────────────────────── */
    .brand {
      display: flex; align-items: center; gap: 8px;
      font-size: 17px; font-weight: 700;
      padding: 4px 8px 0; margin-bottom: 8px;
    }
    .brand small { font-weight: 500; color: var(--fg-muted); font-size: 12px; }
    .sec-label {
      font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
      color: var(--fg-muted); padding: 14px 8px 6px; font-weight: 600;
    }
    .nav-list, .toc-list, .toc-list ul { list-style: none; padding: 0; margin: 0; }
    .nav-list a {
      display: block; padding: 8px 12px; color: var(--fg);
      border-radius: 6px; font-size: 14px; margin-bottom: 1px;
    }
    .nav-list a:hover { background: var(--bg-soft); text-decoration: none; }
    .nav-list a.active { background: var(--accent); color: #fff; }
    .nav-list a.active:hover { text-decoration: none; }

    /* TOC (Python markdown extension 이 만든 nested ul 형태) */
    .toc-list a {
      display: block; padding: 3px 10px;
      color: var(--fg-muted); font-size: 13px;
      border-left: 2px solid transparent;
      line-height: 1.45;
    }
    .toc-list a:hover { color: var(--fg); text-decoration: none; }
    .toc-list a.active {
      color: var(--accent); border-left-color: var(--accent);
      background: var(--accent-soft);
    }
    .toc-list ul ul a { padding-left: 24px; font-size: 12.5px; }
    .toc-list ul ul ul a { padding-left: 38px; font-size: 12px; opacity: .85; }

    /* ── Controls ───────────────────────────────────────────────────── */
    .controls {
      position: fixed; top: 16px; right: 24px; display: flex; gap: 8px; z-index: 20;
    }
    .ctl-btn {
      background: var(--bg-alt); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 12px; cursor: pointer;
      color: var(--fg); font-size: 13px; font-family: inherit;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .ctl-btn:hover { background: var(--bg-soft); }

    #menu-btn {
      display: none; position: fixed; top: 16px; left: 16px; z-index: 60;
      background: var(--bg-alt); border: 1px solid var(--border);
      border-radius: 8px; width: 38px; height: 38px;
      align-items: center; justify-content: center; cursor: pointer;
      color: var(--fg); font-size: 18px;
    }

    /* ── Content typography ─────────────────────────────────────────── */
    main.content h1, main.content h2, main.content h3,
    main.content h4, main.content h5 {
      color: var(--fg); font-weight: 700; line-height: 1.35;
      scroll-margin-top: 24px;
    }
    main.content h1 {
      font-size: 2.1em; margin: 0 0 .6em;
      border-bottom: 1px solid var(--border); padding-bottom: 14px;
    }
    main.content h2 {
      font-size: 1.55em; margin: 2.2em 0 .6em;
      border-bottom: 1px solid var(--border); padding-bottom: 8px;
    }
    main.content h3 { font-size: 1.25em; margin: 1.8em 0 .5em; }
    main.content h4 { font-size: 1.08em; margin: 1.4em 0 .4em; color: var(--fg-muted); }
    main.content p { margin: 0.9em 0; }
    main.content ul, main.content ol { padding-left: 1.5em; }
    main.content li { margin: .25em 0; }
    main.content hr { border: 0; border-top: 1px solid var(--border); margin: 2em 0; }

    /* Inline code & code blocks */
    main.content :not(pre) > code {
      background: var(--code-bg);
      padding: 0.18em 0.42em; border-radius: 5px;
      font-family: 'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;
      font-size: 0.875em; word-break: break-word;
    }
    main.content pre, main.content .codehilite pre {
      background: var(--code-bg); padding: 16px 18px;
      border-radius: 8px; overflow-x: auto;
      border: 1px solid var(--border);
      font-family: 'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;
      font-size: 13px; line-height: 1.55;
    }
    main.content pre code {
      background: none; padding: 0; font-size: inherit; border-radius: 0;
    }
    .codehilite { margin: 1em 0; }

    /* Blockquote */
    main.content blockquote {
      margin: 1em 0; padding: 10px 18px;
      background: var(--bg-soft); border-left: 4px solid var(--accent);
      border-radius: 0 6px 6px 0; color: var(--fg);
    }
    main.content blockquote > :first-child { margin-top: 0; }
    main.content blockquote > :last-child { margin-bottom: 0; }

    /* Table */
    main.content table {
      border-collapse: collapse; margin: 1.2em 0;
      font-size: 0.92em; max-width: 100%;
    }
    main.content th, main.content td {
      border: 1px solid var(--border); padding: 8px 14px; text-align: left;
      vertical-align: top;
    }
    main.content th { background: var(--bg-soft); font-weight: 600; }
    main.content tr:nth-child(2n) td { background: var(--bg-alt); }

    /* TOC permalink (#) */
    main.content .headerlink {
      opacity: 0; margin-left: 8px; font-size: .85em; color: var(--fg-muted);
      text-decoration: none;
    }
    main.content h1:hover .headerlink,
    main.content h2:hover .headerlink,
    main.content h3:hover .headerlink,
    main.content h4:hover .headerlink { opacity: 1; }

    /* Doc meta */
    .doc-meta {
      color: var(--fg-muted); font-size: 13px;
      margin: -8px 0 28px;
    }
    .doc-meta code { font-size: .95em; background: var(--bg-soft);
                      padding: 2px 6px; border-radius: 4px; }

    /* Print */
    @media print {
      aside.sidebar, .controls, #menu-btn { display: none !important; }
      main.content { margin-left: 0; max-width: 100%; padding: 0; }
      a { color: var(--fg) !important; text-decoration: underline; }
      pre, .codehilite pre { break-inside: avoid; }
    }

    /* Scrollbar */
    aside.sidebar::-webkit-scrollbar { width: 8px; }
    aside.sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  <script>
    const DOCS = [{"title": "README", "file": "README.md", "html": "<h1 id=\"codyssey-b1-1\">Codyssey B1-1 — 리눅스 서버 보안 &amp; 시스템 관제 자동화<a class=\"headerlink\" href=\"#codyssey-b1-1\" title=\"Permanent link\">#</a></h1>\n<blockquote>\n<p>다중 사용자 환경의 권한 관리와 네트워크 보안 설정부터 시스템 리소스 관제와 로그 관리 자동화까지, 실제 서버 운영 흐름을 직접 구축한다.\n실행 환경: <strong>macOS + OrbStack Ubuntu 24.04 머신</strong></p>\n</blockquote>\n<hr />\n<h2 id=\"1\">1. 미션 개요<a class=\"headerlink\" href=\"#1\" title=\"Permanent link\">#</a></h2>\n<p>서버 장애가 났을 때 로그가 없으면 원인 분석은 '감'에 의존하게 된다. 단순히 리눅스 명령어를 암기하는 게 아니라, <strong>권한 관리 → 네트워크 보안 → 리소스 관제 → 로그 자동화</strong> 까지 서버 운영자 시점에서 직접 설계해 본다.</p>\n<p>학습 목표 (수료 후 스스로 설명할 수 있어야 한다):</p>\n<ul>\n<li>SSH 포트 변경과 root 원격 접속 차단이 왜 기본 보안에 해당하는가</li>\n<li>\"필요 포트만 허용\"하는 방화벽 정책을 구성·검증하는 방법</li>\n<li>역할 기반 계정/그룹과 ACL로 공유/보안 디렉토리를 분리하는 이유</li>\n<li>환경 변수로 실행 환경을 고정하는 이유와 검증 방법</li>\n<li>쉘 스크립트로 프로세스/포트/리소스 상태를 수집·로깅해 운영 문제를 추적하는 흐름</li>\n<li>crontab 주기 실행과 로그 보존 정책(압축/삭제)이 왜 필요한가</li>\n</ul>\n<hr />\n<h2 id=\"2\">2. 디렉토리 구조<a class=\"headerlink\" href=\"#2\" title=\"Permanent link\">#</a></h2>\n<div class=\"codehilite\"><pre><span></span><code>codyssey_B1-1/\n├── README.md                       ← 이 파일 (루트 유지)\n│\n├── docs/\n│   ├── md/                                ← 원본 .md 문서들\n│   │   ├── 요구사항_수행_내역서.md       ← 제출용 문서 (필수)\n│   │   ├── 문제_설명.md                  ← 평가문항 답변 정리\n│   │   ├── 스크립트_설명.md              ← bash 입문자용 해설\n│   │   └── agent-app_리버스엔지니어링.md ← 바이너리 정적 분석 학습용 (선택)\n│   └── html/\n│       └── index.html                    ← tools/build_docs.py 가 생성한 정적 사이트\n│\n├── bin/\n│   └── agent-app                   ← 운영 측 제공 Linux 바이너리 (Ubuntu 24.04 전용)\n├── src/\n│   ├── monitor.sh                  ← 시스템 상태 수집·로깅 (필수 산출물)\n│   ├── report.sh                   ← 로그 분석 리포트 (보너스 1)\n│   ├── archive_logs.sh             ← 시간 기반 로그 보존 (보너스 2)\n│   │\n│   ├── 00_run_all.sh               ← 01~07 setup 단계를 한 번에 실행 (wrapper)\n│   ├── 01_ssh_hardening.sh         ← SSH 포트 20022 + Root 차단\n│   ├── 02_firewall_allowlist.sh    ← UFW 화이트리스트 (20022/15034)\n│   ├── 03_users_and_groups.sh      ← 계정 3종 + 그룹 2종\n│   ├── 04_directories_and_acl.sh   ← 디렉토리 + ACL (default 상속 포함)\n│   ├── 05_env_and_keyfile.sh       ← 환경변수 5종 + API 키 파일\n│   ├── 06_deploy_app_and_scripts.sh ← agent-app + *.sh 배포\n│   └── 07_cron_schedule.sh         ← cron 매분/매일 등록\n│\n├── demo.sh                         ← 시연 자동화 (시연 모드)\n├── verify_orbstack.sh              ← OrbStack 기반 자동 검증\n│\n├── tools/                          ← 분석 / 문서 빌드 도구 (학습용)\n│   ├── build_docs.py               ← docs/md/*.md + README.md → docs/html/index.html\n│   ├── analyze_binary.py           ← agent-app ELF / PyInstaller 정적 분석\n│   ├── extract_pyinstaller.py      ← PyInstaller 번들 추출\n│   ├── decompile_metadata.py       ← .pyc code object 메타데이터 재귀 덤프\n│   └── disasm_pyc.py               ← dis 모듈 기반 바이트코드 분해\n│\n└── .github/workflows/verify.yml    ← GitHub Actions 자동 검증\n</code></pre></div>\n\n<h2 id=\"3\">3. 최종 산출물<a class=\"headerlink\" href=\"#3\" title=\"Permanent link\">#</a></h2>\n<table>\n<thead>\n<tr>\n<th>#</th>\n<th>산출물</th>\n<th>비고</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td><a href=\"docs/md/요구사항_수행_내역서.md\">요구사항_수행_내역서.md</a></td>\n<td>설정/명령어/검증 출력을 모은 제출 문서</td>\n</tr>\n<tr>\n<td>2</td>\n<td><a href=\"src/monitor.sh\">src/monitor.sh</a></td>\n<td>시스템 상태 수집 + 로깅 (필수)</td>\n</tr>\n<tr>\n<td>3</td>\n<td><a href=\"src/report.sh\">src/report.sh</a></td>\n<td>로그 분석 리포트 (보너스 1)</td>\n</tr>\n<tr>\n<td>4</td>\n<td><a href=\"src/archive_logs.sh\">src/archive_logs.sh</a></td>\n<td>시간 기반 로그 보존 정책 (보너스 2)</td>\n</tr>\n<tr>\n<td>5</td>\n<td><a href=\"src/00_run_all.sh\">src/00_run_all.sh</a> ~ <a href=\"src/07_cron_schedule.sh\">src/07_cron_schedule.sh</a></td>\n<td>환경 구축 7단계 스크립트 (각 단계 분리, 번호 순서대로 실행)</td>\n</tr>\n<tr>\n<td>6</td>\n<td><code>bin/agent-app</code></td>\n<td>미션 측이 제공하는 Linux 바이너리 (Ubuntu 24.04 전용). 학습자가 만들지 않음</td>\n</tr>\n<tr>\n<td>7</td>\n<td><a href=\"docs/md/스크립트_설명.md\">스크립트_설명.md</a></td>\n<td>bash 입문자용 스크립트 해설</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2 id=\"3_1\">3. 기능 요구 사항<a class=\"headerlink\" href=\"#3_1\" title=\"Permanent link\">#</a></h2>\n<h3 id=\"31-ssh\">3.1 SSH<a class=\"headerlink\" href=\"#31-ssh\" title=\"Permanent link\">#</a></h3>\n<ul>\n<li>포트를 <strong>20022</strong> 로 변경</li>\n<li><strong>root 원격 로그인 차단</strong> (<code>PermitRootLogin no</code>)</li>\n<li>검증: <code>grep -E '^(Port|PermitRootLogin)' /etc/ssh/sshd_config</code> / <code>ss -tulnp</code></li>\n</ul>\n<h3 id=\"32-ufw-firewalld-1\">3.2 방화벽 (UFW 또는 firewalld 택1)<a class=\"headerlink\" href=\"#32-ufw-firewalld-1\" title=\"Permanent link\">#</a></h3>\n<ul>\n<li>활성화 후 <strong>인바운드는 <code>20022/tcp</code>(SSH), <code>15034/tcp</code>(APP) 만 허용</strong></li>\n<li>검증: <code>ufw status</code> 또는 <code>firewall-cmd --list-all</code></li>\n</ul>\n<h3 id=\"33\">3.3 계정 / 그룹<a class=\"headerlink\" href=\"#33\" title=\"Permanent link\">#</a></h3>\n<table>\n<thead>\n<tr>\n<th>계정</th>\n<th>역할</th>\n<th>소속 그룹</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>agent-admin</code></td>\n<td>운영/관리, cron 실행자</td>\n<td><code>agent-common</code>, <code>agent-core</code></td>\n</tr>\n<tr>\n<td><code>agent-dev</code></td>\n<td>개발/운영, monitor.sh 작성자</td>\n<td><code>agent-common</code>, <code>agent-core</code></td>\n</tr>\n<tr>\n<td><code>agent-test</code></td>\n<td>QA/테스트</td>\n<td><code>agent-common</code></td>\n</tr>\n</tbody>\n</table>\n<table>\n<thead>\n<tr>\n<th>그룹</th>\n<th>멤버</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>agent-common</code></td>\n<td>admin, dev, test</td>\n</tr>\n<tr>\n<td><code>agent-core</code></td>\n<td>admin, dev</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"34-acl\">3.4 디렉토리 구조 &amp; ACL<a class=\"headerlink\" href=\"#34-acl\" title=\"Permanent link\">#</a></h3>\n<div class=\"codehilite\"><pre><span></span><code>$AGENT_HOME                          (= /home/agent-admin/agent-app)\n├── upload_files/   ← group=agent-common, R/W\n├── api_keys/       ← group=agent-core ONLY, R/W\n└── bin/            ← monitor.sh 등 자동화 스크립트\n/var/log/agent-app/ ← group=agent-core ONLY, R/W\n</code></pre></div>\n\n<ul>\n<li>ACL <code>-d</code>(default) 옵션으로 신규 파일도 동일 권한 자동 상속</li>\n</ul>\n<h3 id=\"35\">3.5 애플리케이션 실행 환경<a class=\"headerlink\" href=\"#35\" title=\"Permanent link\">#</a></h3>\n<p>환경 변수:</p>\n<table>\n<thead>\n<tr>\n<th>변수</th>\n<th>값</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>AGENT_HOME</code></td>\n<td><code>/home/agent-admin/agent-app</code></td>\n</tr>\n<tr>\n<td><code>AGENT_PORT</code></td>\n<td><code>15034</code></td>\n</tr>\n<tr>\n<td><code>AGENT_UPLOAD_DIR</code></td>\n<td><code>$AGENT_HOME/upload_files</code></td>\n</tr>\n<tr>\n<td><code>AGENT_KEY_PATH</code></td>\n<td><code>$AGENT_HOME/api_keys/t_secret.key</code></td>\n</tr>\n<tr>\n<td><code>AGENT_LOG_DIR</code></td>\n<td><code>/var/log/agent-app</code></td>\n</tr>\n</tbody>\n</table>\n<p>키 파일: <code>$AGENT_HOME/api_keys/t_secret.key</code> 내용 = <code>agent_api_key_test</code> (1줄)</p>\n<p>성공 기준:</p>\n<ul>\n<li>일반 계정으로 실행 (루트 금지)</li>\n<li>Boot Sequence <strong>5단계 모두 <code>[OK]</code></strong> + <code>Agent READY</code> 출력</li>\n<li><code>0.0.0.0:15034</code> LISTEN</li>\n<li>종료는 <code>Ctrl+C</code></li>\n</ul>\n<h3 id=\"36-monitorsh\">3.6 monitor.sh<a class=\"headerlink\" href=\"#36-monitorsh\" title=\"Permanent link\">#</a></h3>\n<table>\n<thead>\n<tr>\n<th>항목</th>\n<th>정책</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>위치</td>\n<td><code>$AGENT_HOME/bin/monitor.sh</code></td>\n</tr>\n<tr>\n<td>소유</td>\n<td><code>agent-dev:agent-core</code></td>\n</tr>\n<tr>\n<td>권한</td>\n<td><code>750</code> (<code>rwxr-x---</code>)</td>\n</tr>\n<tr>\n<td>실행 계정</td>\n<td><code>agent-admin</code> (cron)</td>\n</tr>\n</tbody>\n</table>\n<p>동작:</p>\n<ol>\n<li><strong>Health Check (실패 시 <code>exit 1</code>)</strong>\n   - 프로세스 <code>agent-app</code> 실행 여부\n   - TCP <code>15034</code> LISTEN 여부</li>\n<li><strong>상태 점검 (경고만)</strong>\n   - 방화벽 활성 상태 → 비활성 시 <code>[WARNING]</code></li>\n<li><strong>자원 수집</strong>\n   - CPU 사용률(%) / MEM 사용률(%) / 디스크 사용률(/, Used %)</li>\n<li><strong>임계값 경고 (경고만)</strong>\n   - CPU <code>&gt; 20%</code>, MEM <code>&gt; 10%</code>, DISK <code>&gt; 80%</code> → <code>[WARNING]</code></li>\n<li><strong>로그 기록</strong>\n   - 파일: <code>/var/log/agent-app/monitor.log</code>\n   - 포맷: <code>[YYYY-MM-DD HH:MM:SS] PID:... CPU:..% MEM:..% DISK_USED:..%</code></li>\n<li><strong>로그 용량 관리</strong>\n   - 최대 <strong>10MB / 10개 파일</strong> 유지 (logrotate 또는 스크립트 자체 로직)</li>\n</ol>\n<h3 id=\"37-cron\">3.7 cron<a class=\"headerlink\" href=\"#37-cron\" title=\"Permanent link\">#</a></h3>\n<ul>\n<li><code>agent-admin</code> 계정 crontab 에 <code>monitor.sh</code> <strong>매분 실행</strong> 등록</li>\n<li>1~2분 내 <code>monitor.log</code> 신규 라인 누적 확인</li>\n</ul>\n<hr />\n<h2 id=\"4\">4. 보너스 과제<a class=\"headerlink\" href=\"#4\" title=\"Permanent link\">#</a></h2>\n<h3 id=\"1-reportsh\">보너스 1 — <code>report.sh</code><a class=\"headerlink\" href=\"#1-reportsh\" title=\"Permanent link\">#</a></h3>\n<p><code>monitor.log</code> 분석:</p>\n<ul>\n<li>CPU/MEM/DISK 의 <strong>평균/최대/최소 + 샘플 수</strong> 콘솔 출력</li>\n<li>(선택) 시작/종료 시간 인자로 받아 구간 분석</li>\n</ul>\n<h3 id=\"2-archive_logssh\">보너스 2 — 시간 기반 로그 보존 정책 (<code>archive_logs.sh</code>)<a class=\"headerlink\" href=\"#2-archive_logssh\" title=\"Permanent link\">#</a></h3>\n<ul>\n<li><strong>7일 경과</strong> <code>/var/log/agent-app/*.log</code> → <code>gzip</code> 압축</li>\n<li>아카이브 이동: <code>/var/log/monitor/agent-app/archive/</code></li>\n<li><strong>30일 경과</strong> <code>*.gz</code> 삭제</li>\n<li>디렉토리 미존재 / 권한 부족 / 대상 0개 → 안전 종료(WARNING)</li>\n</ul>\n<hr />\n<h2 id=\"5\">5. 제약 사항<a class=\"headerlink\" href=\"#5\" title=\"Permanent link\">#</a></h2>\n<ul>\n<li>자동화 스크립트는 <strong>Bash 로만</strong> (Python 등으로 대체 금지)</li>\n<li>필요한 경우에만 <code>sudo</code> 사용 (일반 계정 작업 권장)</li>\n<li>제공된 Python 앱은 <strong>실행 대상</strong>일 뿐, 과제 핵심은 관제/자동화 스크립트 구현</li>\n</ul>\n<hr />\n<h2 id=\"6-orbstack\">6. 빠른 실행 가이드 (OrbStack)<a class=\"headerlink\" href=\"#6-orbstack\" title=\"Permanent link\">#</a></h2>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"c1\"># macOS 호스트</span>\nbrew<span class=\"w\"> </span>install<span class=\"w\"> </span>orbstack\norb<span class=\"w\"> </span>create<span class=\"w\"> </span>ubuntu:24.04<span class=\"w\"> </span>codyssey\norb<span class=\"w\"> </span>push<span class=\"w\"> </span>-m<span class=\"w\"> </span>codyssey<span class=\"w\"> </span>src/*.sh<span class=\"w\"> </span>bin/agent-app<span class=\"w\"> </span>/tmp/<span class=\"w\">   </span><span class=\"c1\"># 01~07 + monitor/report/archive + 바이너리</span>\norb<span class=\"w\"> </span>shell<span class=\"w\"> </span>-m<span class=\"w\"> </span>codyssey\n\n<span class=\"c1\"># 머신 내부 (Windows 작성 파일이면 CRLF 정리)</span>\nsudo<span class=\"w\"> </span>apt-get<span class=\"w\"> </span>install<span class=\"w\"> </span>-y<span class=\"w\"> </span>dos2unix\ndos2unix<span class=\"w\"> </span>/tmp/*.sh<span class=\"w\"> </span><span class=\"o\">&amp;&amp;</span><span class=\"w\"> </span>chmod<span class=\"w\"> </span>+x<span class=\"w\"> </span>/tmp/*.sh\n\n<span class=\"c1\"># 이후 01~07 setup 스크립트를 순서대로 실행</span>\nbash<span class=\"w\"> </span>/tmp/00_run_all.sh<span class=\"w\">           </span><span class=\"c1\"># 한 번에 (권장)</span>\n<span class=\"c1\"># 또는 단계별로 직접 확인하며:</span>\nbash<span class=\"w\"> </span>/tmp/01_ssh_hardening.sh\nbash<span class=\"w\"> </span>/tmp/02_firewall_allowlist.sh\n<span class=\"c1\"># ...</span>\nbash<span class=\"w\"> </span>/tmp/07_cron_schedule.sh\n</code></pre></div>\n\n<p>검증 체크리스트는 <a href=\"docs/md/요구사항_수행_내역서.md\">요구사항_수행_내역서.md</a> 마지막 절 참고.</p>\n<h3 id=\"orbstack\">OrbStack 업데이트 알림 끄기 (선택)<a class=\"headerlink\" href=\"#orbstack\" title=\"Permanent link\">#</a></h3>\n<p><code>orb</code> 명령마다 \"OrbStack X.Y.Z 업데이트 가능\" 안내가 떠 시연에 거슬리는 경우 한 가지 이상의 방법으로 비활성화 가능.</p>\n<p><strong>A) macOS 셸 프로파일에 영구 등록 (권장)</strong></p>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"c1\"># zsh 사용자</span>\n<span class=\"nb\">echo</span><span class=\"w\"> </span><span class=\"s1\">&#39;export ORBSTACK_NO_UPDATE_CHECK=1&#39;</span><span class=\"w\"> </span>&gt;&gt;<span class=\"w\"> </span>~/.zshrc\n<span class=\"nb\">echo</span><span class=\"w\"> </span><span class=\"s1\">&#39;export ORB_NO_UPDATE_CHECK=1&#39;</span><span class=\"w\">      </span>&gt;&gt;<span class=\"w\"> </span>~/.zshrc\n\n<span class=\"c1\"># bash 사용자</span>\n<span class=\"nb\">echo</span><span class=\"w\"> </span><span class=\"s1\">&#39;export ORBSTACK_NO_UPDATE_CHECK=1&#39;</span><span class=\"w\"> </span>&gt;&gt;<span class=\"w\"> </span>~/.bashrc\n\n<span class=\"nb\">source</span><span class=\"w\"> </span>~/.zshrc<span class=\"w\">   </span><span class=\"c1\"># 또는 새 터미널 열기</span>\n</code></pre></div>\n\n<p><strong>B) OrbStack 앱 자체 설정</strong></p>\n<p>OrbStack 메뉴바 아이콘 → <strong>Settings</strong> → <strong>System</strong> → <strong>Software Update</strong> 에서 \"Check for updates automatically\" 체크 해제.</p>\n<p><strong>C) 본 저장소 스크립트 사용 시</strong></p>\n<p><code>demo.sh</code> / <code>verify_orbstack.sh</code> 안에서 위 환경변수를 자동 set 하고, 새는 안내 줄은 <code>sed</code> 필터로 제거하도록 처리해 두었음 → 별도 작업 불필요.</p>\n<hr />\n<h2 id=\"7\">7. 필수 증거 자료 체크리스트<a class=\"headerlink\" href=\"#7\" title=\"Permanent link\">#</a></h2>\n<ul>\n<li>[ ] SSH <code>Port 20022</code> / <code>PermitRootLogin no</code> 적용 + <code>ss -tulnp</code> LISTEN 확인</li>\n<li>[ ] <code>ufw status</code> (또는 <code>firewall-cmd --list-all</code>) — <code>20022/tcp</code>, <code>15034/tcp</code> 만 ALLOW</li>\n<li>[ ] <code>id agent-admin / agent-dev / agent-test</code> 출력</li>\n<li>[ ] <code>ls -ld</code> + <code>getfacl</code> 로 디렉토리 권한 &amp; ACL 확인</li>\n<li>[ ] 앱 Boot Sequence 5/5 <code>[OK]</code> + <code>Agent READY</code> 출력</li>\n<li>[ ] <code>0.0.0.0:15034</code> LISTEN 확인 (<code>ss -tlnp</code>)</li>\n<li>[ ] <code>monitor.sh</code> 수동 실행 결과 (HEALTH / RESOURCE / WARNING)</li>\n<li>[ ] <code>/var/log/agent-app/monitor.log</code> 최근 라인</li>\n<li>[ ] <code>crontab -l</code> 등록 + 1분 후 로그 라인 증가 확인</li>\n</ul>\n<hr />\n<h2 id=\"8\">8. 개발 환경<a class=\"headerlink\" href=\"#8\" title=\"Permanent link\">#</a></h2>\n<ul>\n<li>Ubuntu 24.04 LTS (OrbStack 머신 권장)</li>\n<li>bash, ss/netstat, ufw 또는 firewalld, acl(<code>setfacl</code>/<code>getfacl</code>), cron, python3</li>\n</ul>", "toc": "<div class=\"toc\">\n<ul>\n<li><a href=\"#1\">1. 미션 개요</a></li>\n<li><a href=\"#2\">2. 디렉토리 구조</a></li>\n<li><a href=\"#3\">3. 최종 산출물</a></li>\n<li><a href=\"#3_1\">3. 기능 요구 사항</a><ul>\n<li><a href=\"#31-ssh\">3.1 SSH</a></li>\n<li><a href=\"#32-ufw-firewalld-1\">3.2 방화벽 (UFW 또는 firewalld 택1)</a></li>\n<li><a href=\"#33\">3.3 계정 / 그룹</a></li>\n<li><a href=\"#34-acl\">3.4 디렉토리 구조 &amp; ACL</a></li>\n<li><a href=\"#35\">3.5 애플리케이션 실행 환경</a></li>\n<li><a href=\"#36-monitorsh\">3.6 monitor.sh</a></li>\n<li><a href=\"#37-cron\">3.7 cron</a></li>\n</ul>\n</li>\n<li><a href=\"#4\">4. 보너스 과제</a><ul>\n<li><a href=\"#1-reportsh\">보너스 1 — report.sh</a></li>\n<li><a href=\"#2-archive_logssh\">보너스 2 — 시간 기반 로그 보존 정책 (archive_logs.sh)</a></li>\n</ul>\n</li>\n<li><a href=\"#5\">5. 제약 사항</a></li>\n<li><a href=\"#6-orbstack\">6. 빠른 실행 가이드 (OrbStack)</a><ul>\n<li><a href=\"#orbstack\">OrbStack 업데이트 알림 끄기 (선택)</a></li>\n</ul>\n</li>\n<li><a href=\"#7\">7. 필수 증거 자료 체크리스트</a></li>\n<li><a href=\"#8\">8. 개발 환경</a></li>\n</ul>\n</div>\n"}, {"title": "요구사항 수행 내역서", "file": "docs/md/요구사항_수행_내역서.md", "html": "<h1 id=\"codyssey-b1-1\">요구사항 수행 내역서 (Codyssey B1-1)<a class=\"headerlink\" href=\"#codyssey-b1-1\" title=\"Permanent link\">#</a></h1>\n<blockquote>\n<p>실행 환경: <strong>macOS + OrbStack Ubuntu 24.04 머신</strong> (<code>orb create ubuntu:24.04 codyssey</code>)\n작성자: 정세영  /  제출일: 2026.05.13</p>\n</blockquote>\n<hr />\n<h2 id=\"_1\">📖 읽기 전에 — 자주 등장하는 개념 미리보기<a class=\"headerlink\" href=\"#_1\" title=\"Permanent link\">#</a></h2>\n<p>이 문서는 처음 보는 사람도 이해할 수 있도록 명령어 한 줄마다 풀어 설명한다. 본문에 들어가기 전에 자주 등장하는 키워드부터 정리한다.</p>\n<table>\n<thead>\n<tr>\n<th>용어</th>\n<th>한 줄 설명</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>터미널 / 쉘 (shell)</strong></td>\n<td>키보드로 명령어를 쳐서 컴퓨터에 시키는 입력 창. 우리가 쓰는 쉘은 <code>bash</code>.</td>\n</tr>\n<tr>\n<td><strong>루트 (root)</strong></td>\n<td>리눅스의 최고 권한자. 아이디는 <code>root</code>, 사용자 번호(UID)는 0. 뭐든지 할 수 있어서 위험하기도 함.</td>\n</tr>\n<tr>\n<td><strong>sudo</strong></td>\n<td>\"지금 이 한 줄만 root 권한으로 실행\" 이라는 뜻. (super user do)</td>\n</tr>\n<tr>\n<td><strong>패키지 / <code>apt</code></strong></td>\n<td>우분투에서 프로그램을 설치하는 공식 도구. <code>apt-get install 패키지명</code>.</td>\n</tr>\n<tr>\n<td><strong>데몬 (daemon)</strong></td>\n<td>백그라운드에서 계속 돌아가는 서비스 프로그램 (예: <code>sshd</code> SSH 데몬, <code>cron</code> 데몬).</td>\n</tr>\n<tr>\n<td><strong>systemd / <code>systemctl</code></strong></td>\n<td>우분투의 서비스 관리자. <code>systemctl start/stop/restart/enable 서비스명</code>.</td>\n</tr>\n<tr>\n<td><strong>포트 (port)</strong></td>\n<td>네트워크의 \"문 번호\". 한 IP에서 여러 서비스를 구분하려고 0~65535 중 하나를 골라 사용. SSH=22, HTTP=80, 우리 앱=15034.</td>\n</tr>\n<tr>\n<td><strong>방화벽 (firewall)</strong></td>\n<td>어떤 포트로 들어오고 나가는 통신을 허용/차단할지 결정하는 문지기. 여기서는 <code>ufw</code> 사용.</td>\n</tr>\n<tr>\n<td><strong>계정(user) / 그룹(group)</strong></td>\n<td>리눅스는 \"누가\" 무엇을 할 수 있는지를 계정/그룹 단위로 관리. 한 사람이 여러 그룹에 속할 수 있다.</td>\n</tr>\n<tr>\n<td><strong>권한 (permission)</strong></td>\n<td>파일/폴더마다 \"읽기(r) 쓰기(w) 실행(x)\"을 누구에게 줄지 정함. <code>chmod</code> 로 변경.</td>\n</tr>\n<tr>\n<td><strong>ACL (Access Control List)</strong></td>\n<td>기본 권한(rwx-rwx-rwx) 만으로 부족할 때 \"특정 그룹에 추가로 권한 부여\" 하는 정밀 도구. <code>setfacl/getfacl</code>.</td>\n</tr>\n<tr>\n<td><strong>환경 변수</strong></td>\n<td>모든 프로그램이 공유하는 \"전역 메모\"(예: <code>AGENT_HOME=/home/agent-admin/agent-app</code>). <code>export</code> 로 등록.</td>\n</tr>\n<tr>\n<td><strong>crontab</strong></td>\n<td>\"매분/매일 N시에 이 명령을 자동 실행\" 같은 예약 스케줄. <code>cron</code> 데몬이 실행해 준다.</td>\n</tr>\n<tr>\n<td><strong><code>#</code> 으로 시작하는 줄</strong></td>\n<td>코드/명령 블록 안에서 <code>#</code> 은 주석 (실행되지 않는 메모).</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2 id=\"0-orbstack\">0. OrbStack 환경 준비<a class=\"headerlink\" href=\"#0-orbstack\" title=\"Permanent link\">#</a></h2>\n<p>OrbStack 은 macOS 위에서 Linux 가상머신을 띄워주는 무료 도구다. 도커 컨테이너처럼 가볍지만, <strong>머신(machine) 모드</strong>를 쓰면 systemd·sshd·cron 같은 시스템 서비스를 <strong>진짜 서버처럼</strong> 사용할 수 있다. 이 미션은 SSH/방화벽/cron 을 다뤄야 하므로 반드시 머신 모드로 만든다.</p>\n<h4 id=\"docker-vm\">왜 Docker 컨테이너로는 안 되고 VM(머신 모드)으로 해야 하는가<a class=\"headerlink\" href=\"#docker-vm\" title=\"Permanent link\">#</a></h4>\n<p>이 미션은 \"서버 한 대를 실제로 운영하는 시나리오\"다. 즉 <strong>OS 한 대를 통째로</strong> 다루는 작업(시스템 서비스 등록, 커널 방화벽 제어, 부팅 시 자동 시작 등)이 핵심이라, 단일 프로세스를 패키징하는 <strong>Docker 컨테이너로는 요구사항을 충족할 수 없다</strong>. 항목별로 정리하면 다음과 같다.</p>\n<table>\n<thead>\n<tr>\n<th>#</th>\n<th>미션 요구사항</th>\n<th>Docker 컨테이너에서의 문제</th>\n<th>VM(OrbStack 머신/일반 VM)에서 동작 방식</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td><strong>systemd / <code>systemctl is-active ufw</code></strong></td>\n<td>컨테이너 기본 PID 1 은 단일 프로세스(예: <code>bash</code>, <code>nginx</code>). <code>systemd</code> 가 PID 1 으로 돌지 않아 <code>systemctl</code> 자체가 작동 안 함 (<code>System has not been booted with systemd</code> 에러). 억지로 <code>--privileged</code> + <code>/sys/fs/cgroup</code> 마운트해 띄우는 편법이 있으나 표준 운영 환경과 다름.</td>\n<td>일반 부팅 과정을 거치므로 <code>systemd</code> 가 PID 1. <code>systemctl enable --now ufw</code> 가 정상 등록되고, 재부팅 후에도 자동 시작.</td>\n</tr>\n<tr>\n<td>2</td>\n<td><strong><code>sshd</code> 데몬 (포트 20022)</strong></td>\n<td>컨테이너는 \"한 프로세스 = 하나의 컨테이너\" 가 원칙. sshd 를 띄우려면 supervisord 같은 init 흉내가 필요하고, \"포트 변경\" 도 컨테이너 안 설정과 호스트의 <code>-p</code> 매핑이 따로 놀아 미션이 검증하려는 <strong>OS 수준의 포트 변경</strong> 이 안 됨.</td>\n<td>VM 안에 진짜 sshd 가 데몬으로 돌고, <code>/etc/ssh/sshd_config</code> 의 <code>Port 20022</code> 가 그대로 OS 리스닝 포트가 됨. <code>ss -tulnp</code> 로 검증 가능.</td>\n</tr>\n<tr>\n<td>3</td>\n<td><strong>UFW / 방화벽 (netfilter 규칙)</strong></td>\n<td>컨테이너는 호스트 커널의 netfilter 를 공유한다. <code>iptables -L</code> 은 <strong>호스트 규칙</strong> 을 보여주고, 컨테이너 내부에서 UFW 를 활성화해도 호스트 트래픽 제어와 충돌한다. Docker 자체가 <code>DOCKER</code> 체인을 동적으로 관리하기 때문에 충돌 가능성도 큼. <code>--privileged</code> + <code>--cap-add=NET_ADMIN</code> 을 줘도 \"호스트 방화벽\" 시나리오를 재현하는 게 아님.</td>\n<td>VM 은 <strong>자체 커널/네임스페이스/iptables 테이블</strong>을 가진다. <code>ufw enable</code> → 그 VM 의 netfilter 에만 적용되고, 호스트 macOS 와 완전히 분리. 미션이 측정하려는 \"서버 한 대의 방화벽 정책\" 이 그대로 성립.</td>\n</tr>\n<tr>\n<td>4</td>\n<td><strong><code>cron</code> 매분 실행</strong></td>\n<td>cron 데몬을 별도로 띄워야 하고(역시 1프로세스 원칙 위배), 컨테이너가 중지되면 cron 도 멈춤. 컨테이너 재시작 정책으로 우회하는 게 일반적이지만 미션이 가정한 \"서버에서 매분 실행\" 의미와 다름.</td>\n<td>systemd 가 <code>cron.service</code> 를 부팅 시 자동 시작. 머신을 꺼도 다음 부팅에 자동 복귀.</td>\n</tr>\n<tr>\n<td>5</td>\n<td><strong>계정 / 그룹 / PAM</strong></td>\n<td>useradd, groupadd 자체는 컨테이너에서도 동작하지만, <strong>로그인 PAM 흐름</strong>(예: <code>su -</code>, sshd 의 PAM 인증)이 컨테이너에서는 누락되기 쉽다. <code>loginctl</code> / <code>journalctl</code> 같은 감사 로그 도구가 systemd 부재로 무력화.</td>\n<td>OS 표준 PAM 스택 그대로 동작. <code>journalctl _COMM=sshd</code> 같은 감사 추적이 가능.</td>\n</tr>\n<tr>\n<td>6</td>\n<td><strong>POSIX ACL (<code>setfacl</code> + default ACL)</strong></td>\n<td>컨테이너 파일시스템(overlayfs/aufs) 이 ACL 을 부분적으로만 지원하거나, <code>mount</code> 옵션에 <code>acl</code> 이 빠져 <code>setfacl</code> 가 silently 실패하는 사례가 있다. VM 처럼 깨끗한 ext4 가 아님.</td>\n<td>일반 ext4 마운트라 ACL/default ACL 이 완전 지원. <code>getfacl</code> 출력이 미션 요구사항과 1:1 매칭.</td>\n</tr>\n<tr>\n<td>7</td>\n<td><strong><code>agent-app</code> 바이너리 실행 (glibc 2.38)</strong></td>\n<td><code>ubuntu:24.04</code> <em>이미지</em> 로 컨테이너를 띄워도 호스트 커널/일부 라이브러리 의존성이 섞일 수 있다. 또한 PyInstaller 번들 안의 <code>/tmp/_MEIxxxx</code> 추출 과정에서 컨테이너의 임시 파일시스템 제약(특히 <code>--read-only</code> 나 <code>noexec /tmp</code>)에 부딪힘.</td>\n<td>24.04 VM 은 <strong>glibc/커널/유저스페이스 전체가 24.04</strong> 라 ABI 가 그대로 맞는다. PyInstaller 의 <code>/tmp</code> 추출도 일반 디스크처럼 동작.</td>\n</tr>\n<tr>\n<td>8</td>\n<td><strong>보안 경계 자체의 학습 의의</strong></td>\n<td>컨테이너는 호스트 커널을 공유하므로 \"방화벽으로 침입 차단\" 같은 시나리오의 의미가 약하다. 컨테이너 탈출 = 호스트 root.</td>\n<td>VM 은 하드웨어 가상화(또는 OrbStack 의 macOS 가상화 프레임워크)로 격리되어 있어, 미션이 학습시키려는 <strong>OS 단위의 격리·하드닝 개념</strong>이 자연스럽게 성립.</td>\n</tr>\n</tbody>\n</table>\n<p>요약하면 <strong>\"한 프로세스를 패키징하는 도구(Docker)\"</strong> 와 <strong>\"OS 한 대를 통째로 띄우는 도구(VM)\"</strong> 는 사용 목적이 다르고, 본 미션은 후자에 속한다. 그래서 OrbStack 의 <strong><code>orb create</code>(머신 모드, 내부적으로 lightweight VM)</strong> 를 쓰고, <code>orb run</code>(컨테이너 모드) 은 쓰지 않는다.</p>\n<blockquote>\n<p>참고 — OrbStack 자체는 Docker 컨테이너 기능도 제공하지만(<code>orb run --image</code>), 이번 미션처럼 systemd/sshd/cron/방화벽까지 다뤄야 할 때는 <strong>머신(machine) 모드</strong> 가 정답이다. 머신 모드는 macOS 의 Virtualization.framework 위에서 실제 Ubuntu 커널을 부팅하므로, 위 표의 1~8 모두 일반 서버와 동일하게 동작한다.</p>\n</blockquote>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"c1\"># macOS 호스트 터미널</span>\nbrew<span class=\"w\"> </span>install<span class=\"w\"> </span>orbstack\norb<span class=\"w\"> </span>create<span class=\"w\"> </span>ubuntu:24.04<span class=\"w\"> </span>codyssey\norb<span class=\"w\"> </span>shell<span class=\"w\"> </span>-m<span class=\"w\"> </span>codyssey<span class=\"w\">         </span><span class=\"c1\"># 머신 진입</span>\n</code></pre></div>\n\n<p><strong>한 줄씩 설명</strong></p>\n<ul>\n<li><code>brew install orbstack</code> : macOS 의 패키지 매니저 Homebrew(<code>brew</code>)로 OrbStack 을 설치.</li>\n<li><code>orb create ubuntu:24.04 codyssey</code> : <strong>Ubuntu 24.04 (noble)</strong> 머신을 \"codyssey\" 라는 이름으로 새로 만든다. 버전을 명시 안 하면 OrbStack 기본값(시점마다 다름)이 잡혀 22.04 가 될 수도 있어 명시 권장. (이번 미션에서 제공되는 <code>agent-app</code> 바이너리가 24.04 의 glibc/라이브러리에 맞춰 빌드돼 있음)</li>\n<li><code>orb shell -m codyssey</code> : <code>-m</code> 은 \"어떤 머신인지\" 지정하는 옵션. 그 머신 안에 들어가 터미널을 연다. 이 시점부터는 macOS 가 아닌 <strong>Ubuntu 안에서</strong> 명령을 친다.</li>\n</ul>\n<p>스크립트 전송 및 줄바꿈 정리 (Windows에서 작성한 경우 필수):</p>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"c1\"># macOS 호스트 — src 의 모든 .sh + bin 의 바이너리를 /tmp/ 로 한 번에</span>\norb<span class=\"w\"> </span>push<span class=\"w\"> </span>-m<span class=\"w\"> </span>codyssey<span class=\"w\"> </span>src/*.sh<span class=\"w\"> </span>bin/agent-app<span class=\"w\"> </span>/tmp/\n\n<span class=\"c1\"># 머신 내부 — CRLF 정리 + 실행권한</span>\nsudo<span class=\"w\"> </span>apt-get<span class=\"w\"> </span>install<span class=\"w\"> </span>-y<span class=\"w\"> </span>dos2unix\ndos2unix<span class=\"w\"> </span>/tmp/*.sh<span class=\"w\"> </span><span class=\"o\">&amp;&amp;</span><span class=\"w\"> </span>chmod<span class=\"w\"> </span>+x<span class=\"w\"> </span>/tmp/*.sh\n</code></pre></div>\n\n<p>setup 7 단계는 번호 순서대로 실행하면 된다:</p>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"c1\"># 머신 내부 (sudoer 계정에서) — 한 번에</span>\nbash<span class=\"w\"> </span>/tmp/00_run_all.sh\n\n<span class=\"c1\"># 또는 학습 목적으로 단계별 확인</span>\nbash<span class=\"w\"> </span>/tmp/01_ssh_hardening.sh\nbash<span class=\"w\"> </span>/tmp/02_firewall_allowlist.sh\nbash<span class=\"w\"> </span>/tmp/03_users_and_groups.sh\nbash<span class=\"w\"> </span>/tmp/04_directories_and_acl.sh\nbash<span class=\"w\"> </span>/tmp/05_env_and_keyfile.sh\n<span class=\"nv\">SOURCE_DIR</span><span class=\"o\">=</span>/tmp<span class=\"w\"> </span>bash<span class=\"w\"> </span>/tmp/06_deploy_app_and_scripts.sh\nbash<span class=\"w\"> </span>/tmp/07_cron_schedule.sh\n</code></pre></div>\n\n<p><strong>한 줄씩 설명</strong></p>\n<ul>\n<li><code>orb push</code> : macOS 의 파일을 머신 안으로 복사 (반대 방향은 <code>orb pull</code>). <code>/tmp/</code> 는 머신 안의 임시 폴더.</li>\n<li><code>sudo apt-get install -y dos2unix</code> : Windows 의 줄바꿈(<code>CR+LF</code>)을 Linux 의 줄바꿈(<code>LF</code>)으로 바꿔주는 변환 도구를 설치. <code>-y</code> 는 \"설치 중에 묻지 말고 Yes 로\".</li>\n<li><code>dos2unix /tmp/*.sh</code> : <code>*.sh</code> 모든 파일을 일괄 변환. (이걸 안 하면 bash 가 보이지 않는 <code>\\r</code> 문자까지 명령 일부로 해석해서 에러난다.)</li>\n<li><code>chmod +x /tmp/*.sh</code> : 해당 파일들을 \"실행 가능한 파일\"로 표시. (<code>+x</code> = add eXecute permission)</li>\n</ul>\n<hr />\n<h2 id=\"1-ssh-20022-root\">1. SSH 설정 (포트 20022 + Root 차단)<a class=\"headerlink\" href=\"#1-ssh-20022-root\" title=\"Permanent link\">#</a></h2>\n<h3 id=\"_2\">왜 하는가<a class=\"headerlink\" href=\"#_2\" title=\"Permanent link\">#</a></h3>\n<ul>\n<li><strong>SSH</strong> 는 원격에서 서버에 접속해 명령을 칠 수 있게 해주는 표준 프로토콜이다.</li>\n<li>기본 포트인 <strong>22번</strong>은 전 세계 해커가 봇으로 자동 스캔하는 대표 포트라, 매분 수십~수백 회 무작위 로그인 시도가 들어온다.</li>\n<li>포트를 <strong>20022 같은 비표준 번호</strong>로 옮기면 그런 자동 공격을 대부분 회피할 수 있고, root 직접 로그인을 막아 두면 일반 계정 → <code>sudo</code> 라는 2단계를 강제할 수 있다 (= \"누가\" 무엇을 했는지 로그가 남는다).</li>\n</ul>\n<h3 id=\"11-openssh-server\">1.1 사전 단계 — <code>openssh-server</code> 설치<a class=\"headerlink\" href=\"#11-openssh-server\" title=\"Permanent link\">#</a></h3>\n<p>OrbStack 의 Ubuntu 머신에는 SSH 서버(<code>sshd</code>) 데몬이 <strong>기본 설치돼 있지 않다</strong>. OrbStack 은 자체 통로(<code>orb shell</code>) 로 머신에 들어가게 해주기 때문에 표준 sshd 가 빠져 있다. 미션 요구사항(포트 20022 sshd)을 만족하려면 직접 설치해야 한다.</p>\n<p>처음 시도 시 다음과 같이 실패할 수 있다:</p>\n<div class=\"codehilite\"><pre><span></span><code>$<span class=\"w\"> </span>sudo<span class=\"w\"> </span>cp<span class=\"w\"> </span>-a<span class=\"w\"> </span>/etc/ssh/sshd_config<span class=\"w\"> </span>/etc/ssh/sshd_config.bak.<span class=\"k\">$(</span>date<span class=\"w\"> </span>+%Y%m%d<span class=\"k\">)</span>\ncp:<span class=\"w\"> </span>cannot<span class=\"w\"> </span>stat<span class=\"w\"> </span><span class=\"s1\">&#39;/etc/ssh/sshd_config&#39;</span>:<span class=\"w\"> </span>No<span class=\"w\"> </span>such<span class=\"w\"> </span>file<span class=\"w\"> </span>or<span class=\"w\"> </span>directory\n</code></pre></div>\n\n<p>→ <code>/etc/ssh/sshd_config</code> 파일 자체가 없다는 의미. SSH 서버 패키지를 먼저 설치한다.</p>\n<div class=\"codehilite\"><pre><span></span><code>sudo<span class=\"w\"> </span>apt-get<span class=\"w\"> </span>update\nsudo<span class=\"w\"> </span>apt-get<span class=\"w\"> </span>install<span class=\"w\"> </span>-y<span class=\"w\"> </span>openssh-server\nls<span class=\"w\"> </span>-l<span class=\"w\"> </span>/etc/ssh/sshd_config<span class=\"w\">    </span><span class=\"c1\"># 설치 후 파일이 생겼는지 확인</span>\n</code></pre></div>\n\n<p><strong>한 줄씩 설명</strong></p>\n<ul>\n<li><code>apt-get update</code> : 우분투의 패키지 카탈로그(어떤 프로그램을 어디서 받을 수 있는지) 를 최신화. 설치 전 관례적으로 1회 실행.</li>\n<li><code>apt-get install -y openssh-server</code> : SSH 서버 데몬(<code>sshd</code>)과 설정 파일들을 설치. 설치가 끝나면 <code>/etc/ssh/sshd_config</code> 가 생기고 <code>ssh</code> 서비스가 등록된다. <code>-y</code> 는 \"설치 중 묻지 말고 Yes\".</li>\n<li><code>ls -l /etc/ssh/sshd_config</code> : 설정 파일이 정상적으로 만들어졌는지 1줄로 확인.</li>\n</ul>\n<h3 id=\"12\">1.2 설정 변경 명령어<a class=\"headerlink\" href=\"#12\" title=\"Permanent link\">#</a></h3>\n<div class=\"codehilite\"><pre><span></span><code>sudo<span class=\"w\"> </span>cp<span class=\"w\"> </span>-a<span class=\"w\"> </span>/etc/ssh/sshd_config<span class=\"w\"> </span>/etc/ssh/sshd_config.bak.<span class=\"k\">$(</span>date<span class=\"w\"> </span>+%Y%m%d<span class=\"k\">)</span>\nsudo<span class=\"w\"> </span>sed<span class=\"w\"> </span>-i<span class=\"w\"> </span>-E<span class=\"w\"> </span><span class=\"se\">\\</span>\n<span class=\"w\">    </span>-e<span class=\"w\"> </span><span class=\"s1\">&#39;s/^#?Port .*/Port 20022/&#39;</span><span class=\"w\"> </span><span class=\"se\">\\</span>\n<span class=\"w\">    </span>-e<span class=\"w\"> </span><span class=\"s1\">&#39;s/^#?PermitRootLogin .*/PermitRootLogin no/&#39;</span><span class=\"w\"> </span><span class=\"se\">\\</span>\n<span class=\"w\">    </span>/etc/ssh/sshd_config\nsudo<span class=\"w\"> </span>systemctl<span class=\"w\"> </span>disable<span class=\"w\"> </span>--now<span class=\"w\"> </span>ssh.socket<span class=\"w\"> </span><span class=\"m\">2</span>&gt;/dev/null<span class=\"w\"> </span><span class=\"o\">||</span><span class=\"w\"> </span><span class=\"nb\">true</span>\nsudo<span class=\"w\"> </span>systemctl<span class=\"w\"> </span><span class=\"nb\">enable</span><span class=\"w\"> </span>--now<span class=\"w\"> </span>ssh\nsudo<span class=\"w\"> </span>systemctl<span class=\"w\"> </span>restart<span class=\"w\"> </span>ssh\n</code></pre></div>\n\n<p><strong>한 줄씩 설명</strong></p>\n<ul>\n<li><code>/etc/ssh/sshd_config</code> 는 <strong>SSH 서버의 설정 파일</strong>. 이 파일 안의 <code>Port</code> 와 <code>PermitRootLogin</code> 두 줄을 바꿔야 한다.</li>\n<li><code>sudo cp -a 원본 사본</code> : 설정 파일을 백업. <code>-a</code> 는 \"권한·소유자까지 그대로 복사\". 사본 이름 끝 <code>.bak.20260513</code> 처럼 날짜를 붙여 언제 만든 백업인지 표시 (<code>$(date +%Y%m%d)</code> 가 오늘 날짜로 치환됨).</li>\n<li><code>sed</code> 는 <strong>텍스트 파일을 명령어로 수정하는 도구</strong>. <code>-i</code> = in-place(파일 자체를 수정), <code>-E</code> = 확장 정규식 사용.</li>\n<li><code>s/^#?Port .*/Port 20022/</code> 의 의미: \"줄 맨 앞(<code>^</code>)이 <code>#</code> 0~1개로 시작하고 그 뒤가 <code>Port</code> 로 시작하는 줄을 통째로 <code>Port 20022</code> 로 교체\". <code>#?</code> 는 \"주석 처리된 채로 있어도 풀어서 교체\" 하기 위함.</li>\n<li>두 번째 <code>-e</code> 도 같은 방식으로 <code>PermitRootLogin no</code> 로 변경.</li>\n<li><code>ssh.socket</code> 비활성화 : Ubuntu 24.04 는 SSH 를 \"소켓 활성화\" 방식으로 띄우기도 한다. 그 경우 sshd_config 의 Port 변경이 무시되므로, 소켓을 끄고 일반 서비스로만 쓰게 한다. <code>2&gt;/dev/null || true</code> 는 \"에러나도 무시하고 다음 줄로\".</li>\n<li><code>systemctl enable --now ssh</code> : SSH 서비스를 지금 켜고 + 부팅 시 자동 시작 등록.</li>\n<li><code>systemctl restart ssh</code> : 변경된 설정을 적용하기 위해 SSH 서비스 재시작.</li>\n</ul>\n<h3 id=\"13\">1.3 검증 (스크린샷/출력 첨부 위치)<a class=\"headerlink\" href=\"#13\" title=\"Permanent link\">#</a></h3>\n<div class=\"codehilite\"><pre><span></span><code>sudo<span class=\"w\"> </span>grep<span class=\"w\"> </span>-E<span class=\"w\"> </span><span class=\"s1\">&#39;^(Port|PermitRootLogin)\\b&#39;</span><span class=\"w\"> </span>/etc/ssh/sshd_config\n<span class=\"c1\"># Port 20022</span>\n<span class=\"c1\"># PermitRootLogin no</span>\n\nsudo<span class=\"w\"> </span>ss<span class=\"w\"> </span>-tulnp<span class=\"w\"> </span><span class=\"p\">|</span><span class=\"w\"> </span>grep<span class=\"w\"> </span>-E<span class=\"w\"> </span><span class=\"s1\">&#39;:20022&#39;</span>\n<span class=\"c1\"># tcp   LISTEN 0  128       0.0.0.0:20022   0.0.0.0:*   users:((&quot;sshd&quot;,pid=3245,fd=6))</span>\n<span class=\"c1\"># tcp   LISTEN 0  128          [::]:20022      [::]:*   users:((&quot;sshd&quot;,pid=3245,fd=7))</span>\n</code></pre></div>\n\n<p><strong>한 줄씩 설명</strong></p>\n<ul>\n<li><code>grep -E</code> : 파일 안에서 특정 패턴을 찾는 도구 (<code>-E</code> 확장 정규식). 여기선 \"줄 처음이 Port 또는 PermitRootLogin 인 줄\"을 출력 → 우리가 바꾼 값이 실제로 들어갔는지 확인.</li>\n<li><code>ss -tulnp</code> : 현재 시스템이 듣고(LISTEN) 있는 네트워크 포트를 보여주는 도구. 옵션 의미:</li>\n<li><code>-t</code> TCP, <code>-u</code> UDP, <code>-l</code> LISTEN 중인 것만, <code>-n</code> 이름 변환 없이 숫자로, <code>-p</code> 어느 프로세스가 쓰는지 같이 표시.</li>\n<li>결과에 <code>0.0.0.0:20022</code> 가 나오면 \"모든 인터페이스의 20022 포트에서 SSH 가 대기 중\" 이라는 뜻.</li>\n</ul>\n<blockquote>\n<p><strong>이유</strong>: 기본 포트(22)는 자동화된 스캔/브루트포스의 1차 표적이다. 비표준 포트로 변경해 노이즈를 줄이고, root 직접 로그인을 막아 만약 자격 증명이 유출돼도 사용자 계정 단계의 사후 추적·차단 여지를 확보한다.</p>\n</blockquote>\n<hr />\n<h2 id=\"2-ufw-20022tcp-15034tcp\">2. 방화벽 (UFW) — 20022/tcp, 15034/tcp만 허용<a class=\"headerlink\" href=\"#2-ufw-20022tcp-15034tcp\" title=\"Permanent link\">#</a></h2>\n<h3 id=\"_3\">왜 하는가<a class=\"headerlink\" href=\"#_3\" title=\"Permanent link\">#</a></h3>\n<ul>\n<li>서버는 기본적으로 \"모든 포트를 열어둔\" 상태일 수 있다. 필요 없는 포트가 열려 있으면 그게 곧 공격 통로.</li>\n<li><strong>UFW (Uncomplicated FireWall)</strong> 는 우분투에서 가장 쉬운 방화벽 도구. 한 줄짜리 명령으로 \"이 포트만 허용\" 정책을 만들 수 있다.</li>\n</ul>\n<h3 id=\"_4\">잠깐 — 우분투에는 이미 방화벽이 있지 않나?<a class=\"headerlink\" href=\"#_4\" title=\"Permanent link\">#</a></h3>\n<p>절반 맞는 말이다. 리눅스의 방화벽은 <strong>3개 계층</strong>으로 나뉘어 있다.</p>\n<div class=\"codehilite\"><pre><span></span><code>┌─────────────────────────────────────────────────────────┐\n│  [사람 친화 도구 계층]                                    │\n│     ufw   /   firewalld   /   iptables 직접 사용          │\n└───────────────────┬─────────────────────────────────────┘\n                    │ 룰을 등록\n                    ▼\n┌─────────────────────────────────────────────────────────┐\n│  [룰셋 도구 계층]                                         │\n│     iptables  (구버전)  →   nftables  (신버전)            │\n└───────────────────┬─────────────────────────────────────┘\n                    │ 같은 API 호출\n                    ▼\n┌─────────────────────────────────────────────────────────┐\n│  [커널 내장 엔진]                                         │\n│     netfilter   ← 패킷을 보고 통과/차단 실제로 결정       │\n└─────────────────────────────────────────────────────────┘\n</code></pre></div>\n\n<ul>\n<li>진짜 방화벽 엔진은 맨 아래 <strong><code>netfilter</code></strong> — 리눅스 커널 안에 내장돼 있고 끌 수 없다.</li>\n<li>우리가 보는 <code>ufw</code>, <code>iptables</code>, <code>firewalld</code> 는 <strong>netfilter 에게 룰을 알려주는 입구</strong>일 뿐 별개 방화벽이 아니다.</li>\n<li>그래서 \"우분투에 방화벽이 있다\" = <code>netfilter</code> 는 항상 켜져 있다. 하지만 <strong>기본 룰이 비어 있어</strong> = \"아무것도 차단 안 함\" 상태. 우리가 <code>ufw enable</code> 로 한 일은 <strong>룰을 채워 넣어 정책을 살리는 것</strong>이다.</li>\n</ul>\n<h3 id=\"iptables-ufw\">왜 <code>iptables</code> 직접 안 쓰고 <code>ufw</code> 를 쓰나<a class=\"headerlink\" href=\"#iptables-ufw\" title=\"Permanent link\">#</a></h3>\n<p>같은 정책을 두 방식으로 비교하면 직관적이다.</p>\n<p><strong><code>iptables</code> (저수준)</strong> — 한 줄에 정보가 많고 순서가 중요:</p>\n<div class=\"codehilite\"><pre><span></span><code>sudo<span class=\"w\"> </span>iptables<span class=\"w\"> </span>-P<span class=\"w\"> </span>INPUT<span class=\"w\"> </span>DROP<span class=\"w\">                                                  </span><span class=\"c1\"># 기본: 들어오는 거 다 차단</span>\nsudo<span class=\"w\"> </span>iptables<span class=\"w\"> </span>-A<span class=\"w\"> </span>INPUT<span class=\"w\"> </span>-i<span class=\"w\"> </span>lo<span class=\"w\"> </span>-j<span class=\"w\"> </span>ACCEPT<span class=\"w\">                                       </span><span class=\"c1\"># 루프백(자기 자신 통신) 허용</span>\nsudo<span class=\"w\"> </span>iptables<span class=\"w\"> </span>-A<span class=\"w\"> </span>INPUT<span class=\"w\"> </span>-m<span class=\"w\"> </span>conntrack<span class=\"w\"> </span>--ctstate<span class=\"w\"> </span>ESTABLISHED,RELATED<span class=\"w\"> </span>-j<span class=\"w\"> </span>ACCEPT<span class=\"w\">  </span><span class=\"c1\"># 응답 패킷 허용</span>\nsudo<span class=\"w\"> </span>iptables<span class=\"w\"> </span>-A<span class=\"w\"> </span>INPUT<span class=\"w\"> </span>-p<span class=\"w\"> </span>tcp<span class=\"w\"> </span>--dport<span class=\"w\"> </span><span class=\"m\">20022</span><span class=\"w\"> </span>-j<span class=\"w\"> </span>ACCEPT<span class=\"w\">                        </span><span class=\"c1\"># SSH</span>\nsudo<span class=\"w\"> </span>iptables<span class=\"w\"> </span>-A<span class=\"w\"> </span>INPUT<span class=\"w\"> </span>-p<span class=\"w\"> </span>tcp<span class=\"w\"> </span>--dport<span class=\"w\"> </span><span class=\"m\">15034</span><span class=\"w\"> </span>-j<span class=\"w\"> </span>ACCEPT<span class=\"w\">                        </span><span class=\"c1\"># 앱</span>\n<span class=\"c1\"># ↑ IPv6 도 ip6tables 로 똑같이 한 번 더</span>\n<span class=\"c1\"># ↑ 재부팅 후 사라짐 → iptables-persistent 같은 별도 도구로 저장 필요</span>\n</code></pre></div>\n\n<p><strong><code>ufw</code> (고수준)</strong> — 같은 일:</p>\n<div class=\"codehilite\"><pre><span></span><code>sudo<span class=\"w\"> </span>ufw<span class=\"w\"> </span>default<span class=\"w\"> </span>deny<span class=\"w\"> </span>incoming\nsudo<span class=\"w\"> </span>ufw<span class=\"w\"> </span>default<span class=\"w\"> </span>allow<span class=\"w\"> </span>outgoing\nsudo<span class=\"w\"> </span>ufw<span class=\"w\"> </span>allow<span class=\"w\"> </span><span class=\"m\">20022</span>/tcp\nsudo<span class=\"w\"> </span>ufw<span class=\"w\"> </span>allow<span class=\"w\"> </span><span class=\"m\">15034</span>/tcp\nsudo<span class=\"w\"> </span>ufw<span class=\"w\"> </span><span class=\"nb\">enable</span>\n<span class=\"c1\"># ↑ IPv4/IPv6 동시 적용</span>\n<span class=\"c1\"># ↑ 부팅 시 자동 복원</span>\n<span class=\"c1\"># ↑ comment 메모 내장</span>\n</code></pre></div>\n\n<p>ufw 가 내부적으로 만드는 룰은 결국 첫 번째 블록과 동일하다. <code>sudo iptables -L -n -v</code> 를 쳐보면 ufw 가 깐 룰이 다 보인다.</p>\n<h3 id=\"ufw\">UFW 선택의 실제 이점<a class=\"headerlink\" href=\"#ufw\" title=\"Permanent link\">#</a></h3>\n<table>\n<thead>\n<tr>\n<th>이유</th>\n<th>설명</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>사람이 외울 수 있는 문법</strong></td>\n<td><code>allow 20022/tcp</code> 가 <code>-A INPUT -p tcp --dport 20022 -j ACCEPT</code> 보다 직관적</td>\n</tr>\n<tr>\n<td><strong>루프백/응답 패킷 자동 처리</strong></td>\n<td>iptables 직접 쓰다 가장 많이 자기 발등 찍는 부분. ufw 는 알아서 처리</td>\n</tr>\n<tr>\n<td><strong>영속화 내장</strong></td>\n<td><code>ufw enable</code> 한 번이면 부팅 시 자동 적용</td>\n</tr>\n<tr>\n<td><strong>IPv4 + IPv6 동시</strong></td>\n<td>iptables / ip6tables 따로 안 만들어도 됨</td>\n</tr>\n<tr>\n<td><strong>comment 메모 기능</strong></td>\n<td><code>ufw allow 20022/tcp comment 'SSH'</code> — 6개월 뒤에도 무슨 룰이었는지 알 수 있음</td>\n</tr>\n<tr>\n<td><strong>감사 한 줄</strong></td>\n<td><code>ufw status verbose</code> 만으로 현재 정책 전체 확인 가능</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"_5\">다른 선택지<a class=\"headerlink\" href=\"#_5\" title=\"Permanent link\">#</a></h3>\n<table>\n<thead>\n<tr>\n<th>도구</th>\n<th>누가 쓰나</th>\n<th>비고</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>ufw</strong></td>\n<td>Ubuntu / Debian</td>\n<td>\"Uncomplicated FireWall\" — 이 미션의 선택</td>\n</tr>\n<tr>\n<td><strong>firewalld</strong></td>\n<td>RHEL / CentOS / Fedora</td>\n<td>zone(집/회사/공용) 개념 기반, 표현력 ↑</td>\n</tr>\n<tr>\n<td><strong>iptables</strong></td>\n<td>모든 리눅스</td>\n<td>정통 도구. 풀 컨트롤 가능하지만 복잡</td>\n</tr>\n<tr>\n<td><strong>nftables</strong></td>\n<td>최신 커널</td>\n<td>iptables 후계자. ufw 도 내부적으로 점차 이전 중</td>\n</tr>\n<tr>\n<td><strong>클라우드 보안그룹</strong></td>\n<td>AWS SG / GCP Firewall</td>\n<td>VM <em>밖</em>에서 막음. 호스트 방화벽과 다층 방어</td>\n</tr>\n</tbody>\n</table>\n<p>실무 패턴: <strong>클라우드 보안그룹(1차) + 호스트 ufw/firewalld(2차)</strong> 의 이중 방어.</p>\n<blockquote>\n<p>한 줄 비유: ufw 와 iptables 는 \"GUI 그래픽 카드 설정\" 과 \"레지스트리·드라이버 직접 편집\" 의 차이 — 같은 GPU 를 다루지만 추상화 수준이 다르다.</p>\n</blockquote>\n<h3 id=\"2\">미션 §2 의 실행 명령<a class=\"headerlink\" href=\"#2\" title=\"Permanent link\">#</a></h3>\n<div class=\"codehilite\"><pre><span></span><code>sudo<span class=\"w\"> </span>apt-get<span class=\"w\"> </span>install<span class=\"w\"> </span>-y<span class=\"w\"> </span>ufw\nsudo<span class=\"w\"> </span>ufw<span class=\"w\"> </span>default<span class=\"w\"> </span>deny<span class=\"w\"> </span>incoming\nsudo<span class=\"w\"> </span>ufw<span class=\"w\"> </span>default<span class=\"w\"> </span>allow<span class=\"w\"> </span>outgoing\nsudo<span class=\"w\"> </span>ufw<span class=\"w\"> </span>allow<span class=\"w\"> </span><span class=\"m\">20022</span>/tcp<span class=\"w\"> </span>comment<span class=\"w\"> </span><span class=\"s1\">&#39;SSH&#39;</span>\nsudo<span class=\"w\"> </span>ufw<span class=\"w\"> </span>allow<span class=\"w\"> </span><span class=\"m\">15034</span>/tcp<span class=\"w\"> </span>comment<span class=\"w\"> </span><span class=\"s1\">&#39;AGENT APP&#39;</span>\nsudo<span class=\"w\"> </span>ufw<span class=\"w\"> </span>--force<span class=\"w\"> </span><span class=\"nb\">enable</span>\nsudo<span class=\"w\"> </span>ufw<span class=\"w\"> </span>status<span class=\"w\"> </span>verbose\n</code></pre></div>\n\n<p><strong>한 줄씩 설명</strong></p>\n<ul>\n<li><code>apt-get install -y ufw</code> : UFW 패키지 설치. (도구 자체가 없으면 명령을 못 쓰니까 먼저 설치)</li>\n<li><code>ufw default deny incoming</code> : \"<strong>기본 정책 = 들어오는 통신은 모두 거부</strong>\". 화이트리스트 방식의 기반.</li>\n<li><code>ufw default allow outgoing</code> : 나가는 통신은 모두 허용. (서버가 외부에 패키지 다운로드 등을 할 수 있어야 하므로)</li>\n<li><code>ufw allow 20022/tcp comment 'SSH'</code> : 20022번 TCP만 예외로 허용. <code>comment</code> 는 나중에 정책을 봤을 때 무슨 용도였는지 알려주는 메모.</li>\n<li><code>ufw allow 15034/tcp comment 'AGENT APP'</code> : 에이전트 앱이 듣는 15034번도 허용.</li>\n<li><code>ufw --force enable</code> : 방화벽 활성화. <code>--force</code> 는 \"정말 켤까요?\" 라는 확인 질문을 건너뛰는 옵션 (스크립트화하려면 필요).</li>\n<li><code>ufw status verbose</code> : 현재 적용된 규칙을 자세히 출력 → 검증용.</li>\n</ul>\n<p>검증 출력 예:</p>\n<div class=\"codehilite\"><pre><span></span><code>Status: active\nLogging: on (low)\nDefault: deny (incoming), allow (outgoing), deny (routed)\nNew profiles: skip\n\nTo                         Action      From\n--                         ------      ----\n20022/tcp                  ALLOW IN    Anywhere                   # SSH\n15034/tcp                  ALLOW IN    Anywhere                   # AGENT APP\n20022/tcp (v6)             ALLOW IN    Anywhere (v6)              # SSH\n15034/tcp (v6)             ALLOW IN    Anywhere (v6)              # AGENT APP\n</code></pre></div>\n\n<blockquote>\n<p><strong>이유</strong>: \"필요한 포트만 허용(allow-list)\" 정책은 공격 표면을 최소화한다. UFW는 iptables/nftables 추상화로 정책을 단순 명령으로 표현·관리하기 쉽다.</p>\n</blockquote>\n<hr />\n<h2 id=\"3\">3. 계정/그룹 생성<a class=\"headerlink\" href=\"#3\" title=\"Permanent link\">#</a></h2>\n<h3 id=\"_6\">왜 하는가<a class=\"headerlink\" href=\"#_6\" title=\"Permanent link\">#</a></h3>\n<ul>\n<li>한 서버를 여러 명이 쓸 때, <strong>모두가 root 로 일하면 누가 뭐 했는지 추적 불가</strong>하고, 실수로 시스템을 망가뜨릴 위험도 크다.</li>\n<li>그래서 <strong>역할별로 계정을 나누고, 권한이 필요한 그룹에만 묶어 두는 것</strong>이 표준이다.</li>\n</ul>\n<h3 id=\"_7\">보안 원칙 두 가지<a class=\"headerlink\" href=\"#_7\" title=\"Permanent link\">#</a></h3>\n<p>이 절의 계정·그룹 구조는 다음 두 원칙에서 출발한다.</p>\n<ol>\n<li><strong>최소 권한 원칙 (Principle of Least Privilege)</strong>\n   각 계정은 <strong>자기 역할에 꼭 필요한 권한만</strong> 가진다. 더 많이 주면 사고 반경이 커진다. (예: QA 가 운영 키 파일을 볼 필요는 없다)</li>\n<li><strong>직무 분리 (Separation of Duties)</strong>\n   여러 사람이 한 서버를 쓸 때 <strong>소유자/실행자/감시자/검증자</strong>를 일부러 분리한다. 그래야 한 계정이 털려도 피해가 격리되고, 누가 무엇을 했는지 추적이 가능하다.</li>\n</ol>\n<h3 id=\"3_1\">계정 3종 — 누가 무엇을 맡나<a class=\"headerlink\" href=\"#3_1\" title=\"Permanent link\">#</a></h3>\n<table>\n<thead>\n<tr>\n<th>계정</th>\n<th>역할 비유</th>\n<th>이 미션에서의 책임</th>\n<th>가지면 안 되는 권한</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong><code>agent-admin</code></strong></td>\n<td>\"운영자(SRE)\"</td>\n<td>• 앱(<code>agent-app</code>) 실행<br>• cron 으로 <code>monitor.sh</code> 매분 돌리기<br>• 키 파일·로그를 읽음</td>\n<td><strong>루트(sudo) 권한 없음</strong> — 시스템 전체에 영향 주는 작업은 못 함</td>\n</tr>\n<tr>\n<td><strong><code>agent-dev</code></strong></td>\n<td>\"개발자\"</td>\n<td>• <code>monitor.sh</code> 같은 자동화 스크립트 작성/배포<br>• 운영 로그를 보며 디버깅<br>• 키 파일도 읽을 수 있음 (코드가 어떻게 동작하는지 확인)</td>\n<td><strong>앱을 실제 실행하지는 않는다</strong> — cron 실행자는 admin</td>\n</tr>\n<tr>\n<td><strong><code>agent-test</code></strong></td>\n<td>\"QA / 테스터\"</td>\n<td>• 업로드 폴더에 테스트 파일을 넣어 보고 결과 확인<br>• 앱 동작을 외부에서 호출해 테스트</td>\n<td><strong>운영 키(API key)·로그를 볼 수 없다</strong> — 운영 비밀에 접근 차단</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>핵심</strong>: 세 계정 모두 <strong>일반 계정</strong>이다. 어느 누구도 sudo 권한을 갖지 않는다. (sudo 가 필요한 setup 은 OrbStack 의 첫 사용자 같은 별개 관리자 계정이 수행)</p>\n</blockquote>\n<h3 id=\"2_1\">그룹 2종 — 왜 굳이 둘로 나눴나<a class=\"headerlink\" href=\"#2_1\" title=\"Permanent link\">#</a></h3>\n<p>\"공유 디렉토리(업로드)\" 와 \"기밀 디렉토리(키·로그)\" 라는 <strong>민감도가 다른 두 자원</strong>이 있기 때문이다. 같은 그룹 하나로 묶으면, 업로드 폴더에 접근 가능한 사람이 키 파일까지 자동으로 보게 된다.</p>\n<div class=\"codehilite\"><pre><span></span><code>                     ┌────────── 업로드 폴더 ──────────┐\nagent-common  ───→  │ admin, dev, test 가 모두 R/W 가능 │\n                     └─────────────────────────────────┘\n\n                     ┌──── 키 / 로그 폴더 ────┐\nagent-core    ───→  │  admin, dev 만 R/W 가능 │\n                     └────────────────────────┘\n</code></pre></div>\n\n<table>\n<thead>\n<tr>\n<th>그룹</th>\n<th>멤버</th>\n<th>의미</th>\n<th>묶이는 자원</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong><code>agent-common</code></strong></td>\n<td>admin, dev, test (3명)</td>\n<td>\"셋이서 같이 작업하는 공용 라인\"</td>\n<td><code>$AGENT_HOME/upload_files</code></td>\n</tr>\n<tr>\n<td><strong><code>agent-core</code></strong></td>\n<td>admin, dev (2명)</td>\n<td>\"민감 자원을 다루는 코어 라인\"</td>\n<td><code>$AGENT_HOME/api_keys</code>, <code>/var/log/agent-app</code></td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"agent-test-agent-core\">왜 <code>agent-test</code> 는 <code>agent-core</code> 에서 빠지는가<a class=\"headerlink\" href=\"#agent-test-agent-core\" title=\"Permanent link\">#</a></h3>\n<p><strong>\"Need to Know\" 원칙</strong> — 누군가 작업하는 데 굳이 필요 없는 정보는 안 보여 준다.</p>\n<ul>\n<li>QA(<code>agent-test</code>) 가 하는 일: 앱을 외부에서 호출해 결과 확인, 업로드 폴더에 샘플 파일 투입</li>\n<li>QA 가 안 해도 되는 일: 운영 API 키 내용 확인, 운영 로그 내용 분석</li>\n<li>→ API 키·운영 로그는 <code>agent-core</code> 라는 좁은 그룹에만 권한을 줘서 <strong>QA 계정이 털려도 키가 안 새도록</strong> 함</li>\n</ul>\n<h3 id=\"agent-admin-devtest\">\"그러면 왜 agent-admin 한 명한테 다 시키지 않고 dev/test 까지 나누나\"<a class=\"headerlink\" href=\"#agent-admin-devtest\" title=\"Permanent link\">#</a></h3>\n<table>\n<thead>\n<tr>\n<th>만약 한 계정이라면</th>\n<th>실제로 일어나는 일</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>\"admin 하나로 다 처리\"</td>\n<td>그 계정 비번/SSH 키가 털리면 <strong>개발·테스트·운영 모두 동시 손상</strong>. 또한 누가 무엇을 했는지 로그에서 구분 불가.</td>\n</tr>\n<tr>\n<td>\"역할별로 따로\"</td>\n<td>admin 이 털려도 <strong>dev 의 스크립트 변경 이력</strong>과 <strong>test 의 테스트 흔적</strong>은 별도. 사고 봉쇄·포렌식 가능.</td>\n</tr>\n</tbody>\n</table>\n<p>실무에서는 더 세분화해서 <code>agent-deploy</code>, <code>agent-monitor</code>, <code>agent-readonly</code> 같은 식으로 5~10개까지 나누기도 한다. 이 미션은 학습용으로 가장 작은 의미 있는 분리(3계정/2그룹)를 보여 주는 셈이다.</p>\n<h3 id=\"cron-agent-admin\">cron 실행자가 왜 <code>agent-admin</code> 인가<a class=\"headerlink\" href=\"#cron-agent-admin\" title=\"Permanent link\">#</a></h3>\n<table>\n<thead>\n<tr>\n<th>후보</th>\n<th>합리적인가</th>\n<th>이유</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>root</code></td>\n<td>❌</td>\n<td>모니터링은 root 권한이 필요 없다. root 로 도는 cron 작업이 많을수록 사고 반경 ↑</td>\n</tr>\n<tr>\n<td><code>agent-dev</code></td>\n<td>△</td>\n<td>dev 는 \"작성자\". cron 처럼 <strong>계속 도는 자동 프로세스의 소유자</strong> 는 운영자(<code>agent-admin</code>) 인 게 자연스럽다</td>\n</tr>\n<tr>\n<td><code>agent-test</code></td>\n<td>❌</td>\n<td>test 는 <code>agent-core</code> 그룹이 아니라 <code>/var/log/agent-app</code> 에 쓸 권한이 없다</td>\n</tr>\n<tr>\n<td><strong><code>agent-admin</code></strong></td>\n<td>✅</td>\n<td>운영자이면서 <code>agent-core</code> 멤버라 로그 디렉토리 쓰기 가능. monitor.sh 실행 권한도 그룹(<code>agent-core</code>)으로 확보</td>\n</tr>\n</tbody>\n</table>\n<p>이 매핑 때문에 <code>monitor.sh</code> 가 <code>agent-dev:agent-core</code> 소유의 <code>0750</code> (소유자 rwx / 그룹 r-x / 그 외 0) 으로 배포된다. <code>agent-admin</code> 은 <code>agent-core</code> 그룹 멤버라 <code>r-x</code> 권한으로 <strong>실행 가능</strong>하다.</p>\n<h3 id=\"_8\">명령어<a class=\"headerlink\" href=\"#_8\" title=\"Permanent link\">#</a></h3>\n<div class=\"codehilite\"><pre><span></span><code>sudo<span class=\"w\"> </span>groupadd<span class=\"w\"> </span>-f<span class=\"w\"> </span>agent-common\nsudo<span class=\"w\"> </span>groupadd<span class=\"w\"> </span>-f<span class=\"w\"> </span>agent-core\n<span class=\"k\">for</span><span class=\"w\"> </span>u<span class=\"w\"> </span><span class=\"k\">in</span><span class=\"w\"> </span>agent-admin<span class=\"w\"> </span>agent-dev<span class=\"w\"> </span>agent-test<span class=\"p\">;</span><span class=\"w\"> </span><span class=\"k\">do</span>\n<span class=\"w\">    </span>sudo<span class=\"w\"> </span>useradd<span class=\"w\"> </span>-m<span class=\"w\"> </span>-s<span class=\"w\"> </span>/bin/bash<span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"nv\">$u</span><span class=\"s2\">&quot;</span><span class=\"w\"> </span><span class=\"m\">2</span>&gt;/dev/null<span class=\"w\"> </span><span class=\"o\">||</span><span class=\"w\"> </span><span class=\"nb\">true</span>\n<span class=\"k\">done</span>\nsudo<span class=\"w\"> </span>usermod<span class=\"w\"> </span>-aG<span class=\"w\"> </span>agent-common<span class=\"w\"> </span>agent-admin\nsudo<span class=\"w\"> </span>usermod<span class=\"w\"> </span>-aG<span class=\"w\"> </span>agent-common<span class=\"w\"> </span>agent-dev\nsudo<span class=\"w\"> </span>usermod<span class=\"w\"> </span>-aG<span class=\"w\"> </span>agent-common<span class=\"w\"> </span>agent-test\nsudo<span class=\"w\"> </span>usermod<span class=\"w\"> </span>-aG<span class=\"w\"> </span>agent-core<span class=\"w\">   </span>agent-admin\nsudo<span class=\"w\"> </span>usermod<span class=\"w\"> </span>-aG<span class=\"w\"> </span>agent-core<span class=\"w\">   </span>agent-dev\n</code></pre></div>\n\n<p><strong>한 줄씩 설명</strong></p>\n<ul>\n<li><code>groupadd -f 이름</code> : 새 그룹을 만든다. <code>-f</code> 는 \"이미 있어도 에러 내지 말고 그냥 넘어가라\" (스크립트 재실행 시 안전).</li>\n<li><code>for u in agent-admin agent-dev agent-test; do ... done</code> : bash 의 반복문. 변수 <code>u</code> 가 세 이름을 순서대로 받아 안쪽 명령을 3번 실행.</li>\n<li><code>useradd -m -s /bin/bash \"$u\"</code> : 새 계정 생성.</li>\n<li><code>-m</code> : 홈 디렉토리(<code>/home/agent-admin</code> 같은)를 같이 만들어 줘.</li>\n<li><code>-s /bin/bash</code> : 이 계정의 기본 쉘을 bash 로. (안 지정하면 sh 가 될 수 있고 기능이 적다.)</li>\n<li><code>2&gt;/dev/null || true</code> : 이미 있는 계정이면 에러 나는데, 그걸 무시.</li>\n<li><code>usermod -aG 그룹 계정</code> : 기존 계정을 그룹에 <strong>추가</strong> 한다.</li>\n<li><code>-a</code> = append (기존 그룹 유지), <code>-G</code> = secondary 그룹. <strong><code>-a</code> 빼면 기존 그룹이 다 날아가니</strong> 항상 같이 써야 한다.</li>\n</ul>\n<p>검증:</p>\n<div class=\"codehilite\"><pre><span></span><code>id<span class=\"w\"> </span>agent-admin\n<span class=\"c1\"># uid=1000(agent-admin) gid=1002(agent-admin) groups=1002(agent-admin),1000(agent-common),1001(agent-core)</span>\n\nid<span class=\"w\"> </span>agent-dev\n<span class=\"c1\"># uid=1001(agent-dev) gid=1003(agent-dev) groups=1003(agent-dev),1000(agent-common),1001(agent-core)</span>\n\nid<span class=\"w\"> </span>agent-test\n<span class=\"c1\"># uid=1002(agent-test) gid=1004(agent-test) groups=1004(agent-test),1000(agent-common)</span>\n</code></pre></div>\n\n<ul>\n<li><code>id 계정</code> : 그 계정의 UID, GID, 소속 그룹을 보여 준다. <strong>기대한 그룹 3종 (agent-common / agent-core / 본인 이름) 이 다 나오는지</strong> 확인. 단, agent-test 는 agent-core 에 속하지 않으므로 2종.</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>그룹</th>\n<th>멤버</th>\n<th>의미</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>agent-common</code></td>\n<td>admin, dev, test</td>\n<td>공용 작업 공간 공유</td>\n</tr>\n<tr>\n<td><code>agent-core</code></td>\n<td>admin, dev</td>\n<td>비밀(키)/로그 접근 가능 코어</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2 id=\"4-acl\">4. 디렉토리 구조 + ACL<a class=\"headerlink\" href=\"#4-acl\" title=\"Permanent link\">#</a></h2>\n<h3 id=\"_9\">왜 하는가<a class=\"headerlink\" href=\"#_9\" title=\"Permanent link\">#</a></h3>\n<ul>\n<li>같은 서버 안에서도 <strong>누구나 봐도 되는 파일</strong>(예: 업로드 자료)과 <strong>소수만 봐야 하는 파일</strong>(예: API 키, 운영 로그)이 섞여 있다.</li>\n<li>폴더마다 \"<strong>소유자/그룹</strong>\" 과 \"<strong>rwx 권한</strong>\"을 정해 두면 OS 가 자동으로 차단해 준다.</li>\n<li>기본 권한(<code>chmod 770</code> 등) 만으로 부족할 때는 <strong>ACL</strong> 로 \"특정 그룹에 추가 권한\"을 부여한다.</li>\n</ul>\n<h3 id=\"acl\">ACL 이 뭔가 — 기본 권한과의 차이<a class=\"headerlink\" href=\"#acl\" title=\"Permanent link\">#</a></h3>\n<h4 id=\"1-posix\">1) 전통적 유닉스 권한 (POSIX 모드 비트) — 한계<a class=\"headerlink\" href=\"#1-posix\" title=\"Permanent link\">#</a></h4>\n<p>지금까지 본 <code>rwxr-x---</code> 같은 권한은 파일/폴더마다 <strong>세 단위로만 표현</strong>된다.</p>\n<div class=\"codehilite\"><pre><span></span><code>   rwx  r-x  ---\n    │    │    │\n    │    │    └─ 그 외 모든 사용자(other)\n    │    └────── 단 하나의 &quot;그룹&quot;\n    └─────────── 단 하나의 &quot;소유자&quot;\n</code></pre></div>\n\n<p>문제: <strong>그룹은 딱 하나만 지정 가능</strong>.</p>\n<blockquote>\n<p>\"이 폴더는 <code>agent-common</code> 도 R/W 하고 싶고, <code>agent-readonly</code> 라는 다른 그룹은 읽기만 시키고 싶다\" 같은 정책을 <strong>기본 권한만으로는 표현 못 한다</strong>.\n또 \"어떤 한 사람(예: <code>alice</code>)에게만 추가로 R/W를 주고 싶다\" 도 마찬가지.</p>\n</blockquote>\n<h4 id=\"2-acl-access-control-list\">2) ACL (Access Control List) — 그 한계의 해소<a class=\"headerlink\" href=\"#2-acl-access-control-list\" title=\"Permanent link\">#</a></h4>\n<p>ACL 은 한 파일/폴더에 <strong>여러 개의 권한 규칙을 리스트로 붙일 수 있게</strong> 해 준다.</p>\n<div class=\"codehilite\"><pre><span></span><code>파일: api_keys/\n┌─────────────────────────────────────────┐\n│ 소유자(agent-admin)         : rwx       │  ← 전통 권한\n│ 기본 그룹(agent-core)       : rwx       │  ← 전통 권한\n│ 그 외                       : ---       │  ← 전통 권한\n│ ─────────── ACL 추가 ──────────────     │\n│ group:agent-core:rwx                   │  ← 그룹 X 에게 rwx\n│ user:alice:r--                         │  ← 특정 사용자 alice 에게 r\n│ default:group:agent-core:rwx           │  ← 신규 파일에도 자동 부여\n└─────────────────────────────────────────┘\n</code></pre></div>\n\n<p><strong>\"리스트\" 라는 이름이 붙은 이유</strong> — 규칙을 여러 줄로 쌓을 수 있어서다. POSIX 모드 비트는 단 한 줄(그룹·사용자 각각 하나) 이지만, ACL 은 N 명의 사용자 + N 개의 그룹 + 기본값까지 동시 표현 가능.</p>\n<h3 id=\"acl_1\">이 미션에서 ACL 이 꼭 필요했던 이유<a class=\"headerlink\" href=\"#acl_1\" title=\"Permanent link\">#</a></h3>\n<p><strong>기본 권한 <code>770</code> + 그룹 <code>agent-core</code> 만으로 끝낼 수 있지 않나?</strong> 라는 질문이 자연스럽다. 둘 차이를 보자.</p>\n<h4 id=\"a\">시나리오 A — 기본 권한만 사용<a class=\"headerlink\" href=\"#a\" title=\"Permanent link\">#</a></h4>\n<div class=\"codehilite\"><pre><span></span><code>chown<span class=\"w\"> </span>agent-admin:agent-core<span class=\"w\"> </span>api_keys/\nchmod<span class=\"w\"> </span><span class=\"m\">770</span><span class=\"w\"> </span>api_keys/<span class=\"w\">        </span><span class=\"c1\"># 소유자 rwx + 그룹 rwx</span>\n</code></pre></div>\n\n<ul>\n<li>✅ 현재 폴더 자체는 정책대로 동작.</li>\n<li>❌ 그런데 <strong>agent-admin 이 안에 새 파일을 만들면</strong> 그 파일의 그룹은 agent-admin 의 primary group (= <code>agent-admin</code>) 이 되고, 권한은 <code>umask</code> 에 따라 <code>644</code> 같은 기본값. → <strong>agent-dev 가 그 파일을 못 본다</strong>.</li>\n<li>결과: 폴더 권한은 맞는데 안의 파일은 정책 위반. 새 파일 만들 때마다 사람이 <code>chown</code>/<code>chmod</code> 를 다시 쳐야 정상화됨.</li>\n</ul>\n<h4 id=\"b-acl\">시나리오 B — ACL 사용 (이 미션의 선택)<a class=\"headerlink\" href=\"#b-acl\" title=\"Permanent link\">#</a></h4>\n<div class=\"codehilite\"><pre><span></span><code>chmod<span class=\"w\"> </span><span class=\"m\">770</span><span class=\"w\"> </span>api_keys/\nsetfacl<span class=\"w\"> </span>-m<span class=\"w\">  </span>g:agent-core:rwx<span class=\"w\"> </span>api_keys/<span class=\"w\">   </span><span class=\"c1\"># 현재</span>\nsetfacl<span class=\"w\"> </span>-dm<span class=\"w\"> </span>g:agent-core:rwx<span class=\"w\"> </span>api_keys/<span class=\"w\">   </span><span class=\"c1\"># ← default ACL</span>\n</code></pre></div>\n\n<ul>\n<li>✅ 폴더 자체 정책: 시나리오 A 와 동일.</li>\n<li>✅ 이제부터 <strong>그 폴더 안에 새로 만들어지는 모든 파일이 자동으로 <code>agent-core:rwx</code> 를 상속</strong>. agent-admin 이 새 키 파일을 떨궈도, monitor.sh 가 로그를 새로 쓸 때도 정책이 깨지지 않는다.</li>\n<li>결과: <strong>\"정책을 폴더에 한 번만 박아두면 영구히 유지\"</strong>.</li>\n</ul>\n<blockquote>\n<p>핵심: 미션의 <code>monitor.sh</code> 는 <strong>매분 새 로그 라인을 쓰고, 가끔 새 로그 파일을 로테이트</strong>한다. 이때마다 권한이 풀리면 다음 cron 실행에서 agent-dev 가 로그를 못 보거나 다른 사용자가 로그를 훔쳐볼 수 있다. <strong>default ACL 만이 이 자동화 환경을 무결하게 유지</strong>한다.</p>\n</blockquote>\n<h3 id=\"setfacl\"><code>setfacl</code> 명령 한 줄씩<a class=\"headerlink\" href=\"#setfacl\" title=\"Permanent link\">#</a></h3>\n<div class=\"codehilite\"><pre><span></span><code>sudo<span class=\"w\"> </span>setfacl<span class=\"w\"> </span>-m<span class=\"w\">  </span>g:agent-core:rwx<span class=\"w\"> </span>/path\n<span class=\"c1\">#         │   │  │</span>\n<span class=\"c1\">#         │   │  └─ &quot;group:agent-core:rwx&quot; — &#39;agent-core 그룹에 rwx 부여&#39; 라는 규칙</span>\n<span class=\"c1\">#         │   └──── -m (modify): 기존 ACL 에 이 규칙을 추가/수정</span>\n<span class=\"c1\">#         └──────── sudo: 소유자/root 만 ACL 변경 가능</span>\n\nsudo<span class=\"w\"> </span>setfacl<span class=\"w\"> </span>-dm<span class=\"w\"> </span>g:agent-core:rwx<span class=\"w\"> </span>/path\n<span class=\"c1\">#         │     │</span>\n<span class=\"c1\">#         │     └ 같은 규칙</span>\n<span class=\"c1\">#         └── -d (default): 이 폴더 안에 **새로 생기는 파일/폴더**에 자동 적용될 ACL 규칙</span>\n</code></pre></div>\n\n<ul>\n<li><code>-m</code> (modify): 현재 상태에 즉시 적용 — 이미 있는 폴더/파일 권한.</li>\n<li><code>-dm</code> (default + modify): <strong>앞으로 만들어질 항목</strong>에 적용 — \"정책 상속\" 효과.</li>\n<li><strong>두 줄을 한 쌍으로 항상 같이 쓴다.</strong> 한 쪽만 쓰면 현재만 맞거나 미래만 맞는 반쪽짜리가 된다.</li>\n</ul>\n<h3 id=\"getfacl\">확인 도구 <code>getfacl</code><a class=\"headerlink\" href=\"#getfacl\" title=\"Permanent link\">#</a></h3>\n<div class=\"codehilite\"><pre><span></span><code>sudo<span class=\"w\"> </span>getfacl<span class=\"w\"> </span>/home/agent-admin/agent-app/api_keys\n<span class=\"c1\"># # file: home/agent-admin/agent-app/api_keys</span>\n<span class=\"c1\"># # owner: agent-admin</span>\n<span class=\"c1\"># # group: agent-core</span>\n<span class=\"c1\"># user::rwx                       ← 전통 권한: 소유자</span>\n<span class=\"c1\"># group::rwx                      ← 전통 권한: 기본 그룹</span>\n<span class=\"c1\"># group:agent-core:rwx            ← ACL: 추가 그룹 권한 (-m 결과)</span>\n<span class=\"c1\"># mask::rwx                       ← 그룹/추가 ACL 에 허용되는 최대 권한</span>\n<span class=\"c1\"># other::---                      ← 전통 권한: 그 외</span>\n<span class=\"c1\"># default:user::rwx               ← 신규 파일 기본값</span>\n<span class=\"c1\"># default:group::rwx              ← ↑</span>\n<span class=\"c1\"># default:group:agent-core:rwx    ← ACL 상속 (-dm 결과)  ★ 미션 요점</span>\n<span class=\"c1\"># default:mask::rwx</span>\n<span class=\"c1\"># default:other::---</span>\n</code></pre></div>\n\n<ul>\n<li>한 폴더의 <strong>현재 정책 + 미래 정책</strong>이 한 화면에 다 보임.</li>\n<li><code>ls -ld</code> 출력 끝에 <code>+</code> 가 붙어 있으면 ACL 이 적용된 상태 (예: <code>drwxrwx---+</code>).</li>\n</ul>\n<h3 id=\"acl_2\">ACL 의 다른 활용 예시 (참고)<a class=\"headerlink\" href=\"#acl_2\" title=\"Permanent link\">#</a></h3>\n<table>\n<thead>\n<tr>\n<th>상황</th>\n<th>명령</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>특정 사용자 <code>alice</code> 에게만 r 허용</td>\n<td><code>setfacl -m u:alice:r /path</code></td>\n</tr>\n<tr>\n<td>두 그룹에 다른 권한</td>\n<td><code>setfacl -m g:A:rwx,g:B:r-x /path</code></td>\n</tr>\n<tr>\n<td>룰 하나 제거</td>\n<td><code>setfacl -x g:agent-core /path</code></td>\n</tr>\n<tr>\n<td>모든 ACL 초기화</td>\n<td><code>setfacl -b /path</code></td>\n</tr>\n<tr>\n<td>다른 곳에 동일 ACL 복사</td>\n<td><code>getfacl src \\| setfacl --set-file=- dst</code></td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"_10\">한 줄 요약<a class=\"headerlink\" href=\"#_10\" title=\"Permanent link\">#</a></h3>\n<blockquote>\n<p><strong>POSIX 권한</strong> = \"한 그룹에만 적용되는 단일 규칙\",\n<strong>ACL</strong> = \"여러 사용자·그룹에 동시에, 그리고 미래 파일까지 자동 상속되도록 한 규칙 리스트\".</p>\n<p>자동화(cron, 앱이 로그를 계속 쓰는 환경)에서는 <strong>default ACL 없이는 정책이 시간이 지날수록 풀린다</strong> — 이 미션이 ACL 을 쓰는 이유.</p>\n</blockquote>\n<div class=\"codehilite\"><pre><span></span><code>sudo<span class=\"w\"> </span>apt-get<span class=\"w\"> </span>install<span class=\"w\"> </span>-y<span class=\"w\"> </span>acl\n<span class=\"nv\">AGENT_HOME</span><span class=\"o\">=</span>/home/agent-admin/agent-app\n<span class=\"nv\">LOG_DIR</span><span class=\"o\">=</span>/var/log/agent-app\n\nsudo<span class=\"w\"> </span>-u<span class=\"w\"> </span>agent-admin<span class=\"w\"> </span>mkdir<span class=\"w\"> </span>-p<span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"nv\">$AGENT_HOME</span><span class=\"s2\">&quot;</span>/<span class=\"o\">{</span>upload_files,api_keys,bin<span class=\"o\">}</span>\nsudo<span class=\"w\"> </span>mkdir<span class=\"w\"> </span>-p<span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"nv\">$LOG_DIR</span><span class=\"s2\">&quot;</span>\n\nsudo<span class=\"w\"> </span>chown<span class=\"w\"> </span>-R<span class=\"w\"> </span>agent-admin:agent-common<span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"nv\">$AGENT_HOME</span><span class=\"s2\">&quot;</span>\nsudo<span class=\"w\"> </span>chgrp<span class=\"w\"> </span>-R<span class=\"w\"> </span>agent-core<span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"nv\">$AGENT_HOME</span><span class=\"s2\">/api_keys&quot;</span>\nsudo<span class=\"w\"> </span>chown<span class=\"w\"> </span>root:agent-core<span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"nv\">$LOG_DIR</span><span class=\"s2\">&quot;</span>\n\nsudo<span class=\"w\"> </span>chmod<span class=\"w\"> </span><span class=\"m\">750</span><span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"nv\">$AGENT_HOME</span><span class=\"s2\">&quot;</span>\nsudo<span class=\"w\"> </span>chmod<span class=\"w\"> </span><span class=\"m\">770</span><span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"nv\">$AGENT_HOME</span><span class=\"s2\">/upload_files&quot;</span><span class=\"w\">   </span><span class=\"c1\"># agent-common R/W</span>\nsudo<span class=\"w\"> </span>chmod<span class=\"w\"> </span><span class=\"m\">770</span><span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"nv\">$AGENT_HOME</span><span class=\"s2\">/api_keys&quot;</span><span class=\"w\">       </span><span class=\"c1\"># agent-core ONLY</span>\nsudo<span class=\"w\"> </span>chmod<span class=\"w\"> </span><span class=\"m\">770</span><span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"nv\">$LOG_DIR</span><span class=\"s2\">&quot;</span><span class=\"w\">                   </span><span class=\"c1\"># agent-core ONLY</span>\nsudo<span class=\"w\"> </span>chmod<span class=\"w\"> </span><span class=\"m\">750</span><span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"nv\">$AGENT_HOME</span><span class=\"s2\">/bin&quot;</span>\n\nsudo<span class=\"w\"> </span>setfacl<span class=\"w\"> </span>-m<span class=\"w\">  </span>g:agent-common:rwx<span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"nv\">$AGENT_HOME</span><span class=\"s2\">/upload_files&quot;</span>\nsudo<span class=\"w\"> </span>setfacl<span class=\"w\"> </span>-dm<span class=\"w\"> </span>g:agent-common:rwx<span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"nv\">$AGENT_HOME</span><span class=\"s2\">/upload_files&quot;</span>\nsudo<span class=\"w\"> </span>setfacl<span class=\"w\"> </span>-m<span class=\"w\">  </span>g:agent-core:rwx<span class=\"w\">   </span><span class=\"s2\">&quot;</span><span class=\"nv\">$AGENT_HOME</span><span class=\"s2\">/api_keys&quot;</span>\nsudo<span class=\"w\"> </span>setfacl<span class=\"w\"> </span>-dm<span class=\"w\"> </span>g:agent-core:rwx<span class=\"w\">   </span><span class=\"s2\">&quot;</span><span class=\"nv\">$AGENT_HOME</span><span class=\"s2\">/api_keys&quot;</span>\nsudo<span class=\"w\"> </span>setfacl<span class=\"w\"> </span>-m<span class=\"w\">  </span>g:agent-core:rwx<span class=\"w\">   </span><span class=\"s2\">&quot;</span><span class=\"nv\">$LOG_DIR</span><span class=\"s2\">&quot;</span>\nsudo<span class=\"w\"> </span>setfacl<span class=\"w\"> </span>-dm<span class=\"w\"> </span>g:agent-core:rwx<span class=\"w\">   </span><span class=\"s2\">&quot;</span><span class=\"nv\">$LOG_DIR</span><span class=\"s2\">&quot;</span>\n</code></pre></div>\n\n<p><strong>설치하는 것</strong></p>\n<ul>\n<li><code>acl</code> 패키지 : <code>setfacl</code> / <code>getfacl</code> 명령을 제공. 우분투에 기본 포함이 아닐 수 있어서 명시적으로 설치.</li>\n</ul>\n<p><strong>한 줄씩 설명</strong></p>\n<ul>\n<li><code>AGENT_HOME=...</code> : 쉘 변수 정의 (이 터미널 세션에서만 유효). 이후 <code>\"$AGENT_HOME\"</code> 으로 재사용해 오타를 줄인다.</li>\n<li><code>sudo -u agent-admin mkdir -p ...</code> : \"agent-admin 권한으로 폴더 생성\". <code>-p</code> 는 \"중간 폴더가 없으면 같이 만들어 줘\". 중괄호 <code>{a,b,c}</code> 표현은 한 번에 여러 폴더를 만드는 bash 의 약식 문법.</li>\n<li><code>chown 소유자:그룹 경로</code> : 파일/폴더의 소유자와 그룹을 변경. <code>-R</code> 은 재귀(하위 전체).</li>\n<li><code>chgrp 그룹 경로</code> : 그룹만 변경 (소유자는 그대로).</li>\n<li><code>chmod NNN 경로</code> : 권한 변경. 세 자리 숫자의 의미는:</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>자릿수</th>\n<th>누구</th>\n<th>4=읽기 + 2=쓰기 + 1=실행</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1번째</td>\n<td>소유자(owner)</td>\n<td></td>\n</tr>\n<tr>\n<td>2번째</td>\n<td>그룹(group)</td>\n<td></td>\n</tr>\n<tr>\n<td>3번째</td>\n<td>그 외(others)</td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li><code>770</code> = 소유자 rwx, 그룹 rwx, 그 외 0 (= 아무 권한 없음). 비밀 폴더에 적합.</li>\n<li>\n<p><code>750</code> = 소유자 rwx, 그룹 r-x (읽기·실행), 그 외 0. 실행 파일이 들어가는 <code>bin</code> 폴더에 적합.</p>\n</li>\n<li>\n<p><strong>ACL 부분</strong> :</p>\n</li>\n<li><code>setfacl -m g:그룹:rwx 경로</code> : 그 폴더에 \"이 그룹은 rwx 가능\" 이라는 규칙을 추가.</li>\n<li><code>setfacl -dm g:그룹:rwx 경로</code> : <strong><code>-d</code> 는 default</strong> — \"앞으로 이 폴더 안에 새로 생기는 파일도 같은 규칙을 자동 상속\". 이게 없으면 새 파일을 만들 때마다 권한이 풀려서 보안 정책이 무너진다.</li>\n</ul>\n<p>검증:</p>\n<blockquote>\n<p>💡 <strong>주의</strong> : 일반 sudoer 계정 (예: <code>ashofrondol9475</code>) 으로 그냥 <code>ls -ld</code> 를 치면 <code>Permission denied</code> 가 뜬다. 그건 정책이 정상 동작 한다는 증거지만, 채점용 증거로는 부족하다 → <code>sudo</code> 를 붙여서 다시 확인한다.</p>\n</blockquote>\n<div class=\"codehilite\"><pre><span></span><code>sudo<span class=\"w\"> </span>ls<span class=\"w\"> </span>-ld<span class=\"w\"> </span>/home/agent-admin/agent-app<span class=\"w\"> </span><span class=\"se\">\\</span>\n<span class=\"w\">            </span>/home/agent-admin/agent-app/upload_files<span class=\"w\"> </span><span class=\"se\">\\</span>\n<span class=\"w\">            </span>/home/agent-admin/agent-app/api_keys<span class=\"w\"> </span><span class=\"se\">\\</span>\n<span class=\"w\">            </span>/var/log/agent-app\n<span class=\"c1\"># drwxr-x---+ 1 agent-admin agent-common 46 May 13 21:16 /home/agent-admin/agent-app</span>\n<span class=\"c1\"># drwxrwx---+ 1 agent-admin agent-common  0 May 13 21:16 /home/agent-admin/agent-app/upload_files</span>\n<span class=\"c1\"># drwxrwx---+ 1 agent-admin agent-core    0 May 13 21:16 /home/agent-admin/agent-app/api_keys</span>\n<span class=\"c1\"># drwxrwx---+ 1 root        agent-core    0 May 13 21:16 /var/log/agent-app</span>\n\nsudo<span class=\"w\"> </span>getfacl<span class=\"w\"> </span>/home/agent-admin/agent-app/upload_files\n<span class=\"c1\"># # file: home/agent-admin/agent-app/upload_files</span>\n<span class=\"c1\"># # owner: agent-admin</span>\n<span class=\"c1\"># # group: agent-common</span>\n<span class=\"c1\"># user::rwx</span>\n<span class=\"c1\"># group::rwx</span>\n<span class=\"c1\"># group:agent-common:rwx</span>\n<span class=\"c1\"># mask::rwx</span>\n<span class=\"c1\"># other::---</span>\n<span class=\"c1\"># default:user::rwx</span>\n<span class=\"c1\"># default:group::rwx</span>\n<span class=\"c1\"># default:group:agent-common:rwx</span>\n<span class=\"c1\"># default:mask::rwx</span>\n<span class=\"c1\"># default:other::---</span>\n\nsudo<span class=\"w\"> </span>getfacl<span class=\"w\"> </span>/home/agent-admin/agent-app/api_keys\n<span class=\"c1\"># # file: home/agent-admin/agent-app/api_keys</span>\n<span class=\"c1\"># # owner: agent-admin</span>\n<span class=\"c1\"># # group: agent-core</span>\n<span class=\"c1\"># user::rwx</span>\n<span class=\"c1\"># group::rwx</span>\n<span class=\"c1\"># group:agent-core:rwx</span>\n<span class=\"c1\"># mask::rwx</span>\n<span class=\"c1\"># other::---</span>\n<span class=\"c1\"># default:user::rwx</span>\n<span class=\"c1\"># default:group::rwx</span>\n<span class=\"c1\"># default:group:agent-core:rwx</span>\n<span class=\"c1\"># default:mask::rwx</span>\n<span class=\"c1\"># default:other::---</span>\n\nsudo<span class=\"w\"> </span>getfacl<span class=\"w\"> </span>/var/log/agent-app\n<span class=\"c1\"># # file: var/log/agent-app</span>\n<span class=\"c1\"># # owner: root</span>\n<span class=\"c1\"># # group: agent-core</span>\n<span class=\"c1\"># user::rwx</span>\n<span class=\"c1\"># group::rwx</span>\n<span class=\"c1\"># group:agent-core:rwx</span>\n<span class=\"c1\"># mask::rwx</span>\n<span class=\"c1\"># other::---</span>\n<span class=\"c1\"># default:user::rwx</span>\n<span class=\"c1\"># default:group::rwx</span>\n<span class=\"c1\"># default:group:agent-core:rwx</span>\n<span class=\"c1\"># default:mask::rwx</span>\n<span class=\"c1\"># default:other::---</span>\n</code></pre></div>\n\n<ul>\n<li><code>ls -ld 폴더</code> : 폴더 자체의 권한과 소유자/그룹을 1줄로 표시 (<code>-d</code> 안 쓰면 안쪽 내용물이 나옴). 끝에 <code>+</code> 가 붙으면 ACL 이 적용돼 있다는 뜻.</li>\n<li><code>getfacl 폴더</code> : 그 폴더의 ACL 규칙 전체를 보여 줌. <strong><code>group:&lt;그룹&gt;:rwx</code></strong> 줄과 <strong><code>default:group:&lt;그룹&gt;:rwx</code></strong> 줄이 둘 다 보여야 \"현재 + 미래 신규 파일\" 정책이 모두 살아 있는 것.</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>경로</th>\n<th>그룹</th>\n<th>권한</th>\n<th>정책</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>$AGENT_HOME/upload_fil
