프로 들어오는 값.</td>\n</tr>\n<tr>\n<td><strong>PATH</strong></td>\n<td>\"명령 이름만 쳤을 때 어디서 찾을지\" 알려주는 환경변수. <code>ls</code> 만 쳤는데 동작하는 건 PATH 에 <code>/usr/bin</code> 이 들어 있어 <code>/usr/bin/ls</code> 를 찾아주기 때문.</td>\n</tr>\n<tr>\n<td><strong>sudo</strong></td>\n<td>\"관리자(root) 권한으로 이 명령 한 줄만 실행\" 시켜주는 도우미. 시스템 파일을 건드릴 때 필요.</td>\n</tr>\n<tr>\n<td><strong>셸 (shell)</strong></td>\n<td>우리가 명령을 입력하면 해석해서 실행해 주는 프로그램. bash / zsh / sh 등이 있고, 이 프로젝트는 전부 bash 기준.</td>\n</tr>\n<tr>\n<td><strong>환경변수</strong></td>\n<td>셸과 자식 프로세스가 공유하는 \"전역 변수\". <code>export NAME=값</code> 으로 만들고, <code>$NAME</code> 또는 <code>${NAME}</code> 으로 읽는다.</td>\n</tr>\n<tr>\n<td><strong>프로세스 / PID</strong></td>\n<td>실행 중인 프로그램 한 인스턴스 = 프로세스. 각각 고유한 번호(PID) 가 붙는다. <code>ps</code>, <code>pgrep</code> 으로 확인.</td>\n</tr>\n<tr>\n<td><strong>데몬 (daemon)</strong></td>\n<td>백그라운드에서 계속 떠 있는 서비스 프로세스. <code>sshd</code>, <code>ufw</code>, <code>cron</code> 같이 <code>d</code> 로 끝나는 이름이 많다.</td>\n</tr>\n<tr>\n<td><strong>cron</strong></td>\n<td>\"지정한 시각마다 명령을 자동 실행\" 해 주는 시스템. <code>crontab</code> 명령으로 등록.</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2 id=\"16\">1.6 파이프 · 리다이렉트 — \"출력의 흐름\" 한 번에 정리<a class=\"headerlink\" href=\"#16\" title=\"Permanent link\">#</a></h2>\n<p>이 문서 곳곳에 <code>|</code>, <code>&gt;</code>, <code>&gt;&gt;</code>, <code>2&gt;&amp;1</code>, <code>&gt;/dev/null</code> 같은 기호가 쉴 새 없이 나온다. 이건 전부 <strong>명령의 출력을 어디로 보낼지</strong> 정하는 문법이다. 한 번 정리하면 90% 가 읽힌다.</p>\n<h3 id=\"_1\">파이프 <code>|</code> — 앞 명령의 출력을 뒤 명령의 입력으로<a class=\"headerlink\" href=\"#_1\" title=\"Permanent link\">#</a></h3>\n<div class=\"codehilite\"><pre><span></span><code>ls<span class=\"w\"> </span>/etc<span class=\"w\"> </span><span class=\"p\">|</span><span class=\"w\"> </span>grep<span class=\"w\"> </span>conf<span class=\"w\"> </span><span class=\"p\">|</span><span class=\"w\"> </span>wc<span class=\"w\"> </span>-l\n</code></pre></div>\n\n<p>읽는 순서: <code>ls /etc</code> (목록) → <code>grep conf</code> (그 중 conf 들어간 줄) → <code>wc -l</code> (줄 수 세기). <strong>세 명령이 동시에 떠서 데이터가 흘러간다.</strong></p>\n<h3 id=\"_2\">리다이렉트 — 출력을 화면 대신 파일로<a class=\"headerlink\" href=\"#_2\" title=\"Permanent link\">#</a></h3>\n<table>\n<thead>\n<tr>\n<th>표기</th>\n<th>의미</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>cmd &gt; file</code></td>\n<td>stdout 을 file 에 <strong>덮어쓰기</strong> (기존 내용 날아감)</td>\n</tr>\n<tr>\n<td><code>cmd &gt;&gt; file</code></td>\n<td>stdout 을 file 에 <strong>이어쓰기</strong></td>\n</tr>\n<tr>\n<td><code>cmd &lt; file</code></td>\n<td>file 을 stdin 으로 넣어줌</td>\n</tr>\n<tr>\n<td><code>cmd 2&gt; file</code></td>\n<td><strong>stderr</strong> 만 file 로</td>\n</tr>\n<tr>\n<td><code>cmd &gt; file 2&gt;&amp;1</code></td>\n<td>stdout 도 file 로 보내고, 그 다음 <strong>stderr 를 stdout 과 같은 곳으로</strong> → 결국 둘 다 file 에</td>\n</tr>\n<tr>\n<td><code>cmd &amp;&gt; file</code></td>\n<td>(bash 전용) 위와 동일, 짧은 표기</td>\n</tr>\n<tr>\n<td><code>cmd &gt;/dev/null</code></td>\n<td>stdout 을 <strong>버림</strong> (<code>/dev/null</code> 은 \"쓰면 사라지는 가짜 파일\")</td>\n</tr>\n<tr>\n<td><code>cmd 2&gt;/dev/null</code></td>\n<td>stderr 만 버림 (에러 메시지 묻기)</td>\n</tr>\n<tr>\n<td><code>cmd &gt;/dev/null 2&gt;&amp;1</code></td>\n<td>출력·에러 둘 다 버림 (조용히 실행하고 종료코드만 보고 싶을 때)</td>\n</tr>\n</tbody>\n</table>\n<p><strong>왜 <code>&gt;/dev/null 2&gt;&amp;1</code> 같은 게 자주 나오나</strong> — <code>if command -v ss &gt;/dev/null 2&gt;&amp;1; then …</code> 처럼 \"이 명령이 존재하는지\" 만 보고 싶을 때, 출력은 화면을 더럽히니 다 버리고 <strong>종료 코드만</strong> 쓰려는 패턴이다.</p>\n<blockquote>\n<p>💡 <code>2&gt;&amp;1</code> 의 순서가 중요. <code>cmd 2&gt;&amp;1 &gt; file</code> 은 의도와 다르게 동작한다 (stderr 는 여전히 화면으로 감). <strong>항상 <code>&gt; file 2&gt;&amp;1</code> 순서</strong>로 외워두자.</p>\n</blockquote>\n<hr />\n<h2 id=\"2\">2. 모든 스크립트의 공통 머리<a class=\"headerlink\" href=\"#2\" title=\"Permanent link\">#</a></h2>\n<p><code>src/</code> 모든 파일은 두세 줄로 시작한다.</p>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"ch\">#!/usr/bin/env bash</span>\n<span class=\"nb\">set</span><span class=\"w\"> </span>-eu<span class=\"w\">     </span><span class=\"c1\"># setup 스크립트(01~07, 00_run_all)</span>\n<span class=\"nb\">set</span><span class=\"w\"> </span>-u<span class=\"w\">      </span><span class=\"c1\"># 운영 스크립트(monitor.sh / report.sh / archive_logs.sh)</span>\n</code></pre></div>\n\n<h3 id=\"usrbinenv-bash-shebang\"><code>#!/usr/bin/env bash</code> (셔뱅, shebang)<a class=\"headerlink\" href=\"#usrbinenv-bash-shebang\" title=\"Permanent link\">#</a></h3>\n<ul>\n<li>파일 <strong>첫 줄</strong>에 <code>#!</code> 로 시작하는 건 OS 한테 \"이 파일을 어떤 프로그램으로 실행해야 하는지\" 알려주는 표지판.</li>\n<li><code>/usr/bin/env bash</code> 는 \"지금 PATH 에 잡힌 bash 를 실행해줘\" 라는 뜻. <code>#!/bin/bash</code> 도 되지만 env 가 시스템 간 호환성이 좋아 관례.</li>\n<li>이 줄이 있고 파일에 실행 권한(<code>chmod +x</code>)이 있으면 <code>./monitor.sh</code> 만으로 실행된다.</li>\n</ul>\n<h3 id=\"set-e-set-u-set-o-pipefail\"><code>set -e</code> / <code>set -u</code> / <code>set -o pipefail</code><a class=\"headerlink\" href=\"#set-e-set-u-set-o-pipefail\" title=\"Permanent link\">#</a></h3>\n<p>bash 의 \"안전 모드\" 옵션. setup 과 운영의 정책이 다르다.</p>\n<table>\n<thead>\n<tr>\n<th>옵션</th>\n<th>의미</th>\n<th>우리 코드</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>-e</code></td>\n<td>명령이 <strong>실패(0이 아닌 종료코드)</strong> 하면 즉시 스크립트 종료</td>\n<td>setup 만 사용</td>\n</tr>\n<tr>\n<td><code>-u</code></td>\n<td><strong>선언되지 않은 변수</strong>를 쓰면 에러로 중단</td>\n<td>setup + 운영 모두</td>\n</tr>\n<tr>\n<td><code>-o pipefail</code></td>\n<td>파이프(<code>|</code>) 안에서 한 단계라도 실패하면 전체 실패로 봄</td>\n<td>(사용 안 함)</td>\n</tr>\n</tbody>\n</table>\n<p>왜 운영 쪽엔 <code>-e</code> 가 없냐 — <code>monitor.sh</code> 는 \"자원 수집 명령 하나가 실패해도 다른 단계는 계속 진행\" 해야 cron 출력이 끊기지 않는다. 반대로 setup 은 \"어느 한 단계라도 실패하면 그대로 멈추는\" 게 안전.</p>\n<blockquote>\n<p>💡 함정 : <code>set -e</code> 가 켜져 있으면 <code>cmd || true</code> 처럼 명시적으로 \"실패해도 OK\" 를 표시해야 한다. 우리 setup 스크립트 곳곳에 <code>|| true</code> 가 보이는 이유.</p>\n</blockquote>\n<hr />\n<h2 id=\"3-setup-7\">3. setup 7 단계 — 각 단계가 하는 일<a class=\"headerlink\" href=\"#3-setup-7\" title=\"Permanent link\">#</a></h2>\n<p>7 단계의 공통 패턴은 다음 3 가지다. 이것만 알면 어떤 setup 스크립트를 봐도 읽힌다.</p>\n<ol>\n<li><strong><code>step()</code> 헬퍼</strong> — <code>step() { printf \"  ▶ %s\\n\" \"$*\"; }</code>. 침묵 명령 직전에 무엇을 할지 한 줄 출력. <code>printf \"▶ %s\\n\" \"$*\"</code> → <code>\"$*\"</code> 는 \"함수에 넘어온 모든 인자를 한 문자열로 합친 것\".</li>\n<li><strong>있으면 skip / 없으면 설치</strong> — <code>command -v ufw &gt;/dev/null 2&gt;&amp;1</code> 같은 조건으로 멱등성(여러 번 돌려도 같은 결과)을 보장.</li>\n<li><strong>마지막에 <code>── 검증 ──</code> 블록</strong> — <code>id agent-admin</code>, <code>ufw status verbose</code> 같은 즉시 확인 명령을 모아 두어 학습자가 결과를 눈으로 확인.</li>\n</ol>\n<h3 id=\"31-01_ssh_hardeningsh-ssh-root\">3.1 <code>01_ssh_hardening.sh</code> — SSH 포트 변경 + Root 차단<a class=\"headerlink\" href=\"#31-01_ssh_hardeningsh-ssh-root\" title=\"Permanent link\">#</a></h3>\n<p>핵심 한 줄:</p>\n<div class=\"codehilite\"><pre><span></span><code>sudo<span class=\"w\"> </span>sed<span class=\"w\"> </span>-i<span class=\"w\"> </span>-E<span class=\"w\"> </span><span class=\"se\">\\</span>\n<span class=\"w\">    </span>-e<span class=\"w\"> </span><span class=\"s1\">&#39;s/^#?Port .*/Port 20022/&#39;</span><span class=\"w\"> </span><span class=\"se\">\\</span>\n<span class=\"w\">    </span>-e<span class=\"w\"> </span><span class=\"s1\">&#39;s/^#?PermitRootLogin .*/PermitRootLogin no/&#39;</span><span class=\"w\"> </span><span class=\"se\">\\</span>\n<span class=\"w\">    </span>/etc/ssh/sshd_config\n</code></pre></div>\n\n<ul>\n<li><code>sed -i</code> : in-place(파일을 그 자리에서) 수정.</li>\n<li><code>-E</code> : 확장 정규식 사용 (<code>?</code>, <code>+</code> 같은 문법).</li>\n<li><code>-e '명령'</code> : 여러 번 쓰면 여러 패턴을 한 번에 적용.</li>\n<li><code>s/원본/대체/</code> 형식. <code>^#?Port .*</code> 는 \"줄 처음에 <code>Port</code> 가 있고 (앞에 <code>#</code> 있어도 없어도) 그 뒤 아무거나\" 를 잡는다. 주석 처리된 <code>#Port 22</code> 도, 평문 <code>Port 22</code> 도 둘 다 <code>Port 20022</code> 로 바뀌도록 한 트릭.</li>\n</ul>\n<p>부가 단계:</p>\n<div class=\"codehilite\"><pre><span></span><code>sudo<span class=\"w\"> </span>systemctl<span class=\"w\"> </span>disable<span class=\"w\"> </span>--now<span class=\"w\"> </span>ssh.socket<span class=\"w\"> </span><span class=\"m\">2</span>&gt;/dev/null<span class=\"w\"> </span><span class=\"o\">||</span><span class=\"w\"> </span><span class=\"nb\">true</span>\nsudo<span class=\"w\"> </span>systemctl<span class=\"w\"> </span><span class=\"nb\">enable</span><span class=\"w\"> </span>ssh\nsudo<span class=\"w\"> </span>systemctl<span class=\"w\"> </span>restart<span class=\"w\"> </span>ssh\n</code></pre></div>\n\n<p>Ubuntu 24.04 는 sshd 를 \"필요할 때만 깨우는\" <code>ssh.socket</code> 모드로 기본 동작한다. 이 상태에서 <code>sshd_config</code> 의 <code>Port</code> 를 바꿔도 socket 이 <code>:22</code> 만 듣고 있어 무력화될 수 있어, <strong>socket 을 끄고 service 로 항상 켜둔다</strong>.</p>\n<h3 id=\"32-02_firewall_allowlistsh-ufw\">3.2 <code>02_firewall_allowlist.sh</code> — UFW 화이트리스트<a class=\"headerlink\" href=\"#32-02_firewall_allowlistsh-ufw\" title=\"Permanent link\">#</a></h3>\n<div class=\"codehilite\"><pre><span></span><code>sudo<span class=\"w\"> </span>ufw<span class=\"w\"> </span>default<span class=\"w\"> </span>deny<span class=\"w\"> </span>incoming\nsudo<span class=\"w\"> </span>ufw<span class=\"w\"> </span>default<span class=\"w\"> </span>allow<span class=\"w\"> </span>outgoing\nsudo<span class=\"w\"> </span>ufw<span class=\"w\"> </span>allow<span class=\"w\"> </span><span class=\"m\">20022</span>/tcp<span class=\"w\"> </span>comment<span class=\"w\"> </span><span class=\"s1\">&#39;SSH&#39;</span>\nsudo<span class=\"w\"> </span>ufw<span class=\"w\"> </span>allow<span class=\"w\"> </span><span class=\"m\">15034</span>/tcp<span class=\"w\"> </span>comment<span class=\"w\"> </span><span class=\"s1\">&#39;AGENT APP&#39;</span>\nsudo<span class=\"w\"> </span>ufw<span class=\"w\"> </span>--force<span class=\"w\"> </span><span class=\"nb\">enable</span>\nsudo<span class=\"w\"> </span>systemctl<span class=\"w\"> </span><span class=\"nb\">enable</span><span class=\"w\"> </span>--now<span class=\"w\"> </span>ufw\n</code></pre></div>\n\n<ul>\n<li><code>default deny incoming</code> : 들어오는 통신은 일단 전부 거부 → \"허용한 것만 들어오게\" (=화이트리스트).</li>\n<li><code>default allow outgoing</code> : 나가는 통신은 허용 (운영 편의).</li>\n<li><code>ufw allow PORT/PROTO comment '...'</code> : 예외 추가. <code>comment</code> 는 <code>ufw status verbose</code> 에 그대로 노출되어 운영 메모로 유용.</li>\n<li><code>ufw --force enable</code> : \"한 번 더 묻지 말고 그냥 켜라\". 보통 첫 활성화 때 \"SSH 끊길 수도 있다\" 경고 + y/N 프롬프트가 뜨는데, 스크립트에선 입력 받을 수 없어 <code>--force</code> 가 필수.</li>\n<li><code>systemctl enable --now ufw</code> : <code>ufw enable</code> 만으론 systemd unit 이 비활성으로 남는 환경(OrbStack 등) 이 있어 한 번 더 명시.</li>\n</ul>\n<h3 id=\"33-03_users_and_groupssh-3-2\">3.3 <code>03_users_and_groups.sh</code> — 계정 3종 / 그룹 2종<a class=\"headerlink\" href=\"#33-03_users_and_groupssh-3-2\" title=\"Permanent link\">#</a></h3>\n<div class=\"codehilite\"><pre><span></span><code>sudo<span class=\"w\"> </span>groupadd<span class=\"w\"> </span>-f<span class=\"w\"> </span>agent-common\nsudo<span class=\"w\"> </span>groupadd<span class=\"w\"> </span>-f<span class=\"w\"> </span>agent-core\n\n<span class=\"k\">for</span><span class=\"w\"> </span>u<span class=\"w\"> </span><span class=\"k\">in</span><span class=\"w\"> </span>agent-admin<span class=\"w\"> </span>agent-dev<span class=\"w\"> </span>agent-test<span class=\"p\">;</span><span class=\"w\"> </span><span class=\"k\">do</span>\n<span class=\"w\">    </span><span class=\"k\">if</span><span class=\"w\"> </span>!<span class=\"w\"> </span>id<span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"nv\">$u</span><span class=\"s2\">&quot;</span><span class=\"w\"> </span>&gt;/dev/null<span class=\"w\"> </span><span class=\"m\">2</span>&gt;<span class=\"p\">&amp;</span><span class=\"m\">1</span><span class=\"p\">;</span><span class=\"w\"> </span><span class=\"k\">then</span>\n<span class=\"w\">        </span>sudo<span class=\"w\"> </span>useradd<span class=\"w\"> </span>-m<span class=\"w\"> </span>-s<span class=\"w\"> </span>/bin/bash<span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"nv\">$u</span><span class=\"s2\">&quot;</span>\n<span class=\"w\">    </span><span class=\"k\">fi</span>\n<span class=\"k\">done</span>\n\nsudo<span class=\"w\"> </span>usermod<span class=\"w\"> </span>-aG<span class=\"w\"> </span>agent-common<span class=\"w\"> </span>agent-admin<span class=\"w\"> </span>agent-dev<span class=\"w\"> </span>agent-test\nsudo<span class=\"w\"> </span>usermod<span class=\"w\"> </span>-aG<span class=\"w\"> </span>agent-core<span class=\"w\">   </span>agent-admin<span class=\"w\"> </span>agent-dev<span class=\"w\">   </span><span class=\"c1\"># test 제외</span>\n</code></pre></div>\n\n<ul>\n<li><code>groupadd -f</code> : 이미 있어도 에러 안 내고 그냥 넘어감.</li>\n<li><code>id \"$u\" &gt;/dev/null 2&gt;&amp;1</code> : \"그 계정이 존재하는지\" 만 알고 출력은 버림. 멱등성 패턴.</li>\n<li><code>useradd -m -s /bin/bash u</code> : <code>-m</code> = 홈 디렉토리 자동 생성, <code>-s /bin/bash</code> = 기본 셸 지정.</li>\n<li><code>usermod -aG group user</code> : 사용자를 그룹에 <strong>추가</strong>. <code>-a</code> (append) 가 없으면 기존 보조 그룹이 다 날아가니 거의 항상 같이 쓴다.</li>\n</ul>\n<blockquote>\n<p>💡 <strong><code>for u in A B C; do … done</code> 문법</strong> (처음 등장)</p>\n<p><code>bash\nfor 변수이름 in 값1 값2 값3; do\n    \"$변수이름\" 사용하는 명령들\ndone</code></p>\n<p>위 코드에선 <code>u</code> 가 차례로 <code>agent-admin</code>, <code>agent-dev</code>, <code>agent-test</code> 가 되며 안쪽 블록이 3번 실행된다. <strong>세미콜론(<code>;</code>)</strong> 은 줄바꿈 대신이고, <code>do … done</code> 이 반복 블록의 시작·끝.</p>\n<p>변수 안에 공백·특수문자가 들어갈 수 있으니 안에서는 <strong>항상 <code>\"$u\"</code> 처럼 큰따옴표로 감싼다</strong> (§6 참고).</p>\n</blockquote>\n<p>핵심 설계 — <code>agent-core</code> 에 <code>agent-test</code> 를 일부러 <strong>제외</strong>해서 \"필요한 사람만 본다\" (Need-to-Know) 원칙을 표현.</p>\n<h3 id=\"34-04_directories_and_aclsh-acl\">3.4 <code>04_directories_and_acl.sh</code> — 디렉토리 + 권한 + ACL<a class=\"headerlink\" href=\"#34-04_directories_and_aclsh-acl\" title=\"Permanent link\">#</a></h3>\n<div class=\"codehilite\"><pre><span></span><code>sudo<span class=\"w\"> </span>chmod<span class=\"w\"> </span><span class=\"m\">750</span><span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">AGENT_HOME</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span>\nsudo<span class=\"w\"> </span>chmod<span class=\"w\"> </span><span class=\"m\">770</span><span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">AGENT_HOME</span><span class=\"si\">}</span><span class=\"s2\">/upload_files&quot;</span>\nsudo<span class=\"w\"> </span>chmod<span class=\"w\"> </span><span class=\"m\">770</span><span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">AGENT_HOME</span><span class=\"si\">}</span><span class=\"s2\">/api_keys&quot;</span>\nsudo<span class=\"w\"> </span>chmod<span class=\"w\"> </span><span class=\"m\">770</span><span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">LOG_DIR</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span>\n\nsudo<span class=\"w\"> </span>setfacl<span class=\"w\"> </span>-m<span class=\"w\">  </span>g:agent-common:rwx<span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">AGENT_HOME</span><span class=\"si\">}</span><span class=\"s2\">/upload_files&quot;</span>\nsudo<span class=\"w\"> </span>setfacl<span class=\"w\"> </span>-dm<span class=\"w\"> </span>g:agent-common:rwx<span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">AGENT_HOME</span><span class=\"si\">}</span><span class=\"s2\">/upload_files&quot;</span>\n</code></pre></div>\n\n<h4 id=\"posix\">POSIX 권한 숫자의 의미<a class=\"headerlink\" href=\"#posix\" title=\"Permanent link\">#</a></h4>\n<div class=\"codehilite\"><pre><span></span><code>chmod 750 dir\n       │\n       └── 7=owner(rwx) / 5=group(r-x) / 0=others(없음)\n</code></pre></div>\n\n<p>비트 매핑: <code>r=4 w=2 x=1</code>. 그 합. 디렉토리에선 <code>x</code> 가 \"들어갈 수 있는 권한\", <code>r</code> 이 \"목록 보기\".</p>\n<h4 id=\"setfacl-posix\"><code>setfacl</code> — POSIX 권한의 한계를 보완<a class=\"headerlink\" href=\"#setfacl-posix\" title=\"Permanent link\">#</a></h4>\n<p>POSIX 표준 권한은 한 디렉토리에 owner / group / others <strong>세 개</strong>까지만 잡을 수 있다. \"agent-core 에는 rwx, 그러나 agent-common 에는 r-x\" 처럼 그룹을 둘 이상 다루려면 ACL(Access Control List) 이 필요.</p>\n<ul>\n<li><code>setfacl -m g:GRP:rwx PATH</code> : 그룹 추가/수정.</li>\n<li><code>setfacl -dm g:GRP:rwx PATH</code> : <strong>default ACL</strong>. 이 디렉토리 안에 <strong>새로 만들어지는</strong> 파일/하위 디렉토리에 자동 상속.</li>\n<li>이게 빠지면 <code>monitor.sh</code> 가 <code>/var/log/agent-app/monitor.log</code> 를 처음 만들 때 정책에서 벗어난 권한이 잡혀, 다른 계정이 못 읽는 사태가 발생.</li>\n</ul>\n<p>검증은 <code>getfacl PATH</code> — POSIX 와 ACL 을 모두 한 번에 출력해 준다.</p>\n<h3 id=\"35-05_env_and_keyfilesh-api\">3.5 <code>05_env_and_keyfile.sh</code> — 환경변수 + API 키<a class=\"headerlink\" href=\"#35-05_env_and_keyfilesh-api\" title=\"Permanent link\">#</a></h3>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"k\">if</span><span class=\"w\"> </span>!<span class=\"w\"> </span>sudo<span class=\"w\"> </span>grep<span class=\"w\"> </span>-q<span class=\"w\"> </span><span class=\"s1\">&#39;^export AGENT_HOME=&#39;</span><span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">AGENT_BASHRC</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span><span class=\"w\"> </span><span class=\"m\">2</span>&gt;/dev/null<span class=\"p\">;</span><span class=\"w\"> </span><span class=\"k\">then</span>\n<span class=\"w\">    </span>sudo<span class=\"w\"> </span>-u<span class=\"w\"> </span>agent-admin<span class=\"w\"> </span>tee<span class=\"w\"> </span>-a<span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">AGENT_BASHRC</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span><span class=\"w\"> </span>&gt;/dev/null<span class=\"w\"> </span><span class=\"s\">&lt;&lt;&#39;EOF&#39;</span>\n\n<span class=\"s\"># ----- Agent App ENV -----</span>\n<span class=\"s\">export AGENT_HOME=&quot;/home/agent-admin/agent-app&quot;</span>\n<span class=\"s\">...</span>\n<span class=\"s\">EOF</span>\n<span class=\"k\">fi</span>\n</code></pre></div>\n\n<ul>\n<li><code>if ! ... ; then ... fi</code> : 조건 앞에 <code>!</code> 로 부정. \"이미 등록돼 있지 <em>않다면</em>\" 에만 추가 → 여러 번 돌려도 줄이 중복되지 않음 (멱등).</li>\n<li><code>sudo -u agent-admin tee -a FILE</code> : agent-admin 권한으로 파일 끝에 이어쓰기. <code>tee</code> 를 쓰는 이유는 <code>sudo</code> 가 리다이렉트(<code>&gt;&gt;</code>) 자체엔 작용 못 하기 때문 — <code>sudo &gt;&gt;file</code> 은 셸이 먼저 file 을 열어버려 권한 거부가 난다.</li>\n<li><code>&lt;&lt;'EOF' … EOF</code> : <strong>heredoc</strong>. 시작 마커 <code>'EOF'</code> 를 작은따옴표로 감싼 이유 — 안의 <code>$AGENT_HOME</code> 같은 표현이 미리 치환되지 않고 <strong>문자 그대로</strong> 파일에 기록되게. (agent-admin 셸이 열릴 때 비로소 풀리도록.)</li>\n</ul>\n<p>API 키:</p>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"nb\">echo</span><span class=\"w\"> </span><span class=\"s2\">&quot;agent_api_key_test&quot;</span><span class=\"w\"> </span><span class=\"p\">|</span><span class=\"w\"> </span>sudo<span class=\"w\"> </span>-u<span class=\"w\"> </span>agent-admin<span class=\"w\"> </span>tee<span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">KEY_PATH</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span><span class=\"w\"> </span>&gt;/dev/null\nsudo<span class=\"w\"> </span>chown<span class=\"w\"> </span>agent-admin:agent-core<span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">KEY_PATH</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span>\nsudo<span class=\"w\"> </span>chmod<span class=\"w\"> </span><span class=\"m\">640</span><span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">KEY_PATH</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span>\n</code></pre></div>\n\n<ul>\n<li><code>640</code> = <code>rw- r-- ---</code> → owner 읽기/쓰기, group 읽기만, others 없음. 비밀이지만 같은 팀(<code>agent-core</code> = admin+dev) 은 검증할 수 있음.</li>\n</ul>\n<h3 id=\"36-06_deploy_app_and_scriptssh\">3.6 <code>06_deploy_app_and_scripts.sh</code> — 바이너리 + 스크립트 배포<a class=\"headerlink\" href=\"#36-06_deploy_app_and_scriptssh\" title=\"Permanent link\">#</a></h3>\n<div class=\"codehilite\"><pre><span></span><code>sudo<span class=\"w\"> </span>install<span class=\"w\"> </span>-m<span class=\"w\"> </span><span class=\"m\">0750</span><span class=\"w\"> </span>-o<span class=\"w\"> </span>agent-dev<span class=\"w\"> </span>-g<span class=\"w\"> </span>agent-core<span class=\"w\"> </span><span class=\"se\">\\</span>\n<span class=\"w\">    </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">SOURCE_DIR</span><span class=\"si\">}</span><span class=\"s2\">/monitor.sh&quot;</span><span class=\"w\">  </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">AGENT_HOME</span><span class=\"si\">}</span><span class=\"s2\">/bin/monitor.sh&quot;</span>\n</code></pre></div>\n\n<ul>\n<li><code>install</code> = <code>cp</code> 의 강화판. 한 명령으로 <strong>복사 + 권한 모드(<code>-m</code>) + 소유자(<code>-o</code>) + 그룹(<code>-g</code>)</strong> 을 한 번에 지정. 따로따로 <code>cp</code> → <code>chmod</code> → <code>chown</code> 하는 것보다 안전(중간 상태가 없음).</li>\n<li><code>0750</code> 의 앞자리 <code>0</code> 은 8진수 표기 명시. <code>chmod</code> 가 8진수 외엔 안 받으므로 사실상 같지만 관례.</li>\n</ul>\n<p>CRLF 정리:</p>\n<div class=\"codehilite\"><pre><span></span><code>sudo<span class=\"w\"> </span>dos2unix<span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">SOURCE_DIR</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span>/monitor.sh<span class=\"w\"> </span>...<span class=\"w\"> </span><span class=\"m\">2</span>&gt;<span class=\"p\">&amp;</span><span class=\"m\">1</span><span class=\"w\"> </span><span class=\"p\">|</span><span class=\"w\"> </span>sed<span class=\"w\"> </span><span class=\"s1\">&#39;s/^/      /&#39;</span><span class=\"w\"> </span><span class=\"o\">||</span><span class=\"w\"> </span><span class=\"nb\">true</span>\n</code></pre></div>\n\n<ul>\n<li>Windows 에서 작성한 파일은 줄 끝이 <code>\\r\\n</code> 이라 bash 가 보이지 않는 <code>\\r</code> 까지 명령 일부로 인식해 깨진다. <code>dos2unix</code> 로 LF 로 변환.</li>\n<li><code>2&gt;&amp;1 | sed 's/^/      /'</code> : stderr 도 stdout 으로 합치고, 모든 줄 앞에 공백 6칸을 붙여 들여쓰기. 미관용.</li>\n</ul>\n<p>시연용 사본:</p>\n<div class=\"codehilite\"><pre><span></span><code>sudo<span class=\"w\"> </span>install<span class=\"w\"> </span>-m<span class=\"w\"> </span><span class=\"m\">0750</span><span class=\"w\"> </span>-o<span class=\"w\"> </span>agent-admin<span class=\"w\"> </span>-g<span class=\"w\"> </span>agent-admin<span class=\"w\"> </span><span class=\"se\">\\</span>\n<span class=\"w\">    </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">SOURCE_DIR</span><span class=\"si\">}</span><span class=\"s2\">/report.sh&quot;</span><span class=\"w\"> </span><span class=\"s2\">&quot;/home/agent-admin/report.sh&quot;</span>\n</code></pre></div>\n\n<p>정식 위치(<code>$AGENT_HOME/bin/</code>) 외에도 <code>~/report.sh</code> 로 admin/dev 의 홈에 복사. 시연 중 <code>sudo -iu agent-dev</code> 직후 <code>~/report.sh</code> 한 줄로 즉시 통계를 볼 수 있게.</p>\n<h3 id=\"37-07_cron_schedulesh-cron\">3.7 <code>07_cron_schedule.sh</code> — cron 등록<a class=\"headerlink\" href=\"#37-07_cron_schedulesh-cron\" title=\"Permanent link\">#</a></h3>\n<div class=\"codehilite\"><pre><span></span><code>sudo<span class=\"w\"> </span>-u<span class=\"w\"> </span>agent-admin<span class=\"w\"> </span>bash<span class=\"w\"> </span>-c<span class=\"w\"> </span><span class=\"s1\">&#39;</span>\n<span class=\"s1\">( crontab -l 2&gt;/dev/null | grep -v &quot;monitor.sh&quot; | grep -v &quot;archive_logs.sh&quot; ;</span>\n<span class=\"s1\">  echo &quot;* * * * * AGENT_HOME=... AGENT_PORT=15034 AGENT_LOG_DIR=... /home/agent-admin/agent-app/bin/monitor.sh &gt;&gt; ... 2&gt;&amp;1&quot;</span>\n<span class=\"s1\">  echo &quot;10 3 * * * /home/agent-admin/agent-app/bin/archive_logs.sh &gt;&gt; ... 2&gt;&amp;1&quot;</span>\n<span class=\"s1\">) | crontab -</span>\n<span class=\"s1\">&#39;</span>\n</code></pre></div>\n\n<p>읽는 순서:</p>\n<ol>\n<li><code>sudo -u agent-admin bash -c '...'</code> — agent-admin 권한으로 한 덩어리 실행.</li>\n<li><code>crontab -l 2&gt;/dev/null</code> — 현재 crontab 출력 (없으면 에러 → <code>2&gt;/dev/null</code> 로 묻음).</li>\n<li><code>| grep -v \"monitor.sh\" | grep -v \"archive_logs.sh\"</code> — <strong>monitor.sh / archive_logs.sh 가 들어간 줄을 제거</strong>. 여러 번 돌려도 중복 등록 방지.</li>\n<li><code>; echo \"...\"</code> — 그 뒤에 새 줄 2 개를 이어 붙임. <code>(  ;   )</code> 의 괄호는 \"이 안의 출력을 합쳐 하나의 스트림으로\" 묶는 용도.</li>\n<li><code>| crontab -</code> — 그 합쳐진 결과를 crontab 의 표준입력으로 넘겨 <strong>전체 교체</strong>.</li>\n</ol>\n<p>cron 표 5칸 의미:</p>\n<div class=\"codehilite\"><pre><span></span><code>* * * * *   command\n│ │ │ │ │\n│ │ │ │ └── 요일 (0~6, 0=일요일)\n│ │ │ └──── 월   (1~12)\n│ │ └────── 일   (1~31)\n│ └──────── 시   (0~23)\n└────────── 분   (0~59)\n</code></pre></div>\n\n<p><code>* * * * *</code> = 매분, <code>10 3 * * *</code> = 매일 03 시 10 분.</p>\n<h4 id=\"agent_home\">왜 명령줄 앞에 <code>AGENT_HOME=…</code> 을 다시 적나<a class=\"headerlink\" href=\"#agent_home\" title=\"Permanent link\">#</a></h4>\n<p>cron 은 <strong>로그인 셸이 아니다</strong>. <code>.bashrc</code> 도 안 읽고, 환경변수도 거의 비어 있다. 그래서 <code>monitor.sh</code> 가 의존하는 <code>AGENT_HOME / AGENT_PORT / AGENT_LOG_DIR</code> 을 cron 줄 안에 직접 박아 넣어야 한다.</p>\n<p><code>A=1 B=2 command</code> 형태로 명령 앞에 변수를 두면 <strong>그 한 명령에만</strong> 적용된다 (export 없이도).</p>\n<hr />\n<h2 id=\"4-3\">4. 운영 3종 — 한 줄씩 해설<a class=\"headerlink\" href=\"#4-3\" title=\"Permanent link\">#</a></h2>\n<h3 id=\"40-grep-sed-awk-3\">4.0 잠깐 — <code>grep</code> / <code>sed</code> / <code>awk</code> 3대장 미니 소개<a class=\"headerlink\" href=\"#40-grep-sed-awk-3\" title=\"Permanent link\">#</a></h3>\n<p>monitor.sh / report.sh 를 읽으려면 이 셋이 어떤 역할인지 한 줄씩이라도 알아야 한다.</p>\n<table>\n<thead>\n<tr>\n<th>도구</th>\n<th>한 줄로</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>grep</strong></td>\n<td>\"<strong>찾기</strong>\" — 패턴과 일치하는 줄만 골라낸다. <code>ls | grep .log</code></td>\n</tr>\n<tr>\n<td><strong>sed</strong></td>\n<td>\"<strong>바꾸기</strong>\" — 줄 단위로 검색해 다른 텍스트로 치환. <code>sed 's/old/new/'</code></td>\n</tr>\n<tr>\n<td><strong>awk</strong></td>\n<td>\"<strong>컬럼 다루기 + 계산</strong>\" — 공백 기준으로 줄을 컬럼(<code>$1 $2 $3 …</code>)으로 자르고, 합계·평균·필터를 표현. <code>awk '{print $2}'</code></td>\n</tr>\n</tbody>\n</table>\n<p>기억법: <strong>\"찾으면 grep, 바꾸면 sed, 계산하면 awk\"</strong>.</p>\n<h4 id=\"awk\">awk 프로그램의 뼈대 한 번 보기<a class=\"headerlink\" href=\"#awk\" title=\"Permanent link\">#</a></h4>\n<div class=\"codehilite\"><pre><span></span><code>awk<span class=\"w\"> </span><span class=\"s1\">&#39;패턴 { 액션 } 패턴 { 액션 } …&#39;</span><span class=\"w\">  </span>파일\n</code></pre></div>\n\n<ul>\n<li><strong>패턴이 참인 줄에 한해 액션 실행.</strong> 패턴이 비어 있으면 <strong>모든 줄</strong> 실행.</li>\n<li>자주 쓰는 패턴: <code>/정규식/</code>, <code>$3 &gt; 100</code>, <code>BEGIN</code> (입력 전 1번), <code>END</code> (입력 후 1번).</li>\n<li>액션 안에선 <code>$0</code>(줄 전체), <code>$1</code>(첫 컬럼), <code>$2</code>, … <code>NF</code>(컬럼 수), <code>NR</code>(줄 번호) 같은 내장 변수를 쓴다.</li>\n</ul>\n<p>예:</p>\n<div class=\"codehilite\"><pre><span></span><code>ls<span class=\"w\"> </span>-l<span class=\"w\"> </span>/etc<span class=\"w\"> </span><span class=\"p\">|</span><span class=\"w\"> </span>awk<span class=\"w\"> </span><span class=\"s1\">&#39;$5 &gt; 1000 { print $9, $5 }&#39;</span>\n<span class=\"c1\">#         ┬                     ┬       ┬</span>\n<span class=\"c1\">#         │                     │       └ 출력할 컬럼들</span>\n<span class=\"c1\">#         │                     └ 5번째 컬럼(크기) &gt; 1000 인 줄만</span>\n<span class=\"c1\">#         └ ls -l 출력을 awk 에 흘려보냄</span>\n</code></pre></div>\n\n<p>→ \"1000바이트 이상인 파일의 이름·크기\" 만 추려서 출력. 이게 awk 의 전형적 패턴이다.</p>\n<blockquote>\n<p>awk 가 따옴표(<code>'…'</code>) 안에 또 다른 작은 언어를 품고 있어서 처음엔 낯설다. <strong>\"awk 인용부호 안은 별도 언어다\"</strong> 라고 생각하면 마음 편하다.</p>\n</blockquote>\n<hr />\n<h3 id=\"41-monitorsh\">4.1 <code>monitor.sh</code> — 시스템 상태 수집<a class=\"headerlink\" href=\"#41-monitorsh\" title=\"Permanent link\">#</a></h3>\n<p>monitor.sh 는 cron 으로 매분 호출되어 다음을 한다.</p>\n<ol>\n<li>Health check (프로세스 살아 있나, 포트 LISTEN 하나) — 실패 시 <code>exit 1</code></li>\n<li>방화벽 활성 여부 경고</li>\n<li>CPU/MEM/DISK 수집</li>\n<li>임계값 초과 시 WARNING</li>\n<li><code>[시각] PID:… CPU:…% MEM:…% DISK_USED:…%</code> 한 줄을 <code>monitor.log</code> 에 append</li>\n<li>파일이 10MB 넘으면 <code>.1 … .10</code> 으로 로테이션</li>\n</ol>\n<h4 id=\"_3\">변수 + 기본값 패턴<a class=\"headerlink\" href=\"#_3\" title=\"Permanent link\">#</a></h4>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"nv\">APP_NAME</span><span class=\"o\">=</span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">APP_NAME</span><span class=\"k\">:-</span><span class=\"nv\">agent</span><span class=\"p\">-app</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span>\n<span class=\"nv\">APP_PORT</span><span class=\"o\">=</span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">AGENT_PORT</span><span class=\"k\">:-</span><span class=\"nv\">15034</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span>\n<span class=\"nv\">LOG_DIR</span><span class=\"o\">=</span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">AGENT_LOG_DIR</span><span class=\"k\">:-</span><span class=\"p\">/var/log/agent-app</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span>\n</code></pre></div>\n\n<ul>\n<li><code>${VAR:-default}</code> = \"<strong>VAR 이 비어 있거나 없으면 default 를 써라</strong>\".</li>\n<li>덕분에 <code>APP_NAME=foo ./monitor.sh</code> 같은 1회성 override 가 가능. cron 에선 <code>AGENT_PORT=15034</code> 처럼 명령줄 앞 변수를 받아간다.</li>\n</ul>\n<blockquote>\n<p>변수 정의 시 <code>=</code> 양옆에 <strong>공백이 있으면 안 된다</strong>. <code>NAME=foo</code> (O), <code>NAME = foo</code> (X — \"NAME 명령어가 없다\"고 해석됨).</p>\n</blockquote>\n<h4 id=\"_4\">명령어 결과를 변수에 — <code>$(...)</code><a class=\"headerlink\" href=\"#_4\" title=\"Permanent link\">#</a></h4>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"nv\">APP_PID</span><span class=\"o\">=</span><span class=\"s2\">&quot;</span><span class=\"k\">$(</span>pgrep<span class=\"w\"> </span>-x<span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">APP_NAME</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span><span class=\"w\"> </span><span class=\"p\">|</span><span class=\"w\"> </span>head<span class=\"w\"> </span>-n1<span class=\"w\"> </span><span class=\"o\">||</span><span class=\"w\"> </span><span class=\"nb\">true</span><span class=\"k\">)</span><span class=\"s2\">&quot;</span>\n</code></pre></div>\n\n<ul>\n<li><code>$(명령)</code> = \"명령을 실행한 결과(표준 출력)\" 를 그 자리에 끼워 넣음 (\"명령어 치환\").</li>\n<li><code>pgrep -x agent-app</code> : 프로세스 이름(<code>/proc/PID/comm</code>) 이 <code>agent-app</code> 와 <strong>정확히 일치</strong>하는 PID 만 출력.</li>\n<li><code>-x</code> 대신 <code>-f</code> 도 있는데 (<code>-f</code> = cmdline 전체에서 매칭) 우리 경로엔 <code>agent-app</code> 이라는 글자가 <strong>디렉토리 이름</strong>(<code>/home/agent-admin/agent-app/...</code>)에도 들어있어, monitor.sh 가 <strong>자기 자신을 매칭하는 사고</strong>가 난다. → <code>-x</code> 가 안전.</li>\n<li><code>| head -n1</code> : 여러 PID 가 잡혀도 첫 번째만.</li>\n<li><code>|| true</code> : 일치 프로세스 없을 때(=실패) 도 OK 로 처리. <code>set -e</code> 환경이라면 여기서 죽지 않게 하는 가드.</li>\n</ul>\n<h4 id=\"if-then-fi\">조건문 — <code>if [[ ... ]]; then ... fi</code><a class=\"headerlink\" href=\"#if-then-fi\" title=\"Permanent link\">#</a></h4>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"k\">if</span><span class=\"w\"> </span><span class=\"o\">[[</span><span class=\"w\"> </span>-z<span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">APP_PID</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span><span class=\"w\"> </span><span class=\"o\">]]</span><span class=\"p\">;</span><span class=\"w\"> </span><span class=\"k\">then</span>\n<span class=\"w\">    </span><span class=\"nb\">echo</span><span class=\"w\"> </span><span class=\"s2\">&quot;Checking process &#39;</span><span class=\"si\">${</span><span class=\"nv\">APP_NAME</span><span class=\"si\">}</span><span class=\"s2\">&#39;... [FAIL]&quot;</span>\n<span class=\"w\">    </span><span class=\"nb\">exit</span><span class=\"w\"> </span><span class=\"m\">1</span>\n<span class=\"k\">fi</span>\n</code></pre></div>\n\n<table>\n<thead>\n<tr>\n<th>표현</th>\n<th>의미</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>-z \"$x\"</code></td>\n<td>x 가 <strong>빈 문자열</strong></td>\n</tr>\n<tr>\n<td><code>-n \"$x\"</code></td>\n<td>x 가 <strong>비어있지 않음</strong></td>\n</tr>\n<tr>\n<td><code>\"$a\" = \"$b\"</code></td>\n<td>문자열 동일</td>\n</tr>\n<tr>\n<td><code>$a -gt $b</code></td>\n<td><strong>정수</strong> 비교 (gt, lt, eq, ne, le, ge)</td>\n</tr>\n<tr>\n<td><code>-f path</code> / <code>-d path</code></td>\n<td>파일 / 디렉토리 존재</td>\n</tr>\n</tbody>\n</table>\n<p><code>[ ]</code> 와 <code>[[ ]]</code> 둘 다 가능하지만 <strong><code>[[ ]]</code> 가 더 안전</strong> (공백/특수문자 처리 우수, <code>&amp;&amp;</code>/<code>||</code> 도 안에서 사용 가능).</p>\n<h4 id=\"listen-ss\">포트 LISTEN 확인 — <code>ss</code> 와 폴백<a class=\"headerlink\" href=\"#listen-ss\" title=\"Permanent link\">#</a></h4>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"k\">if</span><span class=\"w\"> </span><span class=\"nb\">command</span><span class=\"w\"> </span>-v<span class=\"w\"> </span>ss<span class=\"w\"> </span>&gt;/dev/null<span class=\"w\"> </span><span class=\"m\">2</span>&gt;<span class=\"p\">&amp;</span><span class=\"m\">1</span><span class=\"p\">;</span><span class=\"w\"> </span><span class=\"k\">then</span>\n<span class=\"w\">    </span><span class=\"nv\">PORT_OK</span><span class=\"o\">=</span><span class=\"k\">$(</span>ss<span class=\"w\"> </span>-tlnH<span class=\"w\"> </span><span class=\"m\">2</span>&gt;/dev/null<span class=\"w\"> </span><span class=\"p\">|</span><span class=\"w\"> </span>awk<span class=\"w\"> </span>-v<span class=\"w\"> </span><span class=\"nv\">p</span><span class=\"o\">=</span><span class=\"s2\">&quot;:</span><span class=\"si\">${</span><span class=\"nv\">APP_PORT</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span><span class=\"w\"> </span><span class=\"s1\">&#39;$4 ~ p {print &quot;Y&quot;; exit}&#39;</span><span class=\"k\">)</span>\n<span class=\"k\">else</span>\n<span class=\"w\">    </span><span class=\"nv\">PORT_OK</span><span class=\"o\">=</span><span class=\"k\">$(</span>netstat<span class=\"w\"> </span>-tln<span class=\"w\"> </span><span class=\"m\">2</span>&gt;/dev/null<span class=\"w\"> </span><span class=\"p\">|</span><span class=\"w\"> </span>awk<span class=\"w\"> </span>-v<span class=\"w\"> </span><span class=\"nv\">p</span><span class=\"o\">=</span><span class=\"s2\">&quot;:</span><span class=\"si\">${</span><span class=\"nv\">APP_PORT</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span><span class=\"w\"> </span><span class=\"s1\">&#39;$4 ~ p {print &quot;Y&quot;; exit}&#39;</span><span class=\"k\">)</span>\n<span class=\"k\">fi</span>\n</code></pre></div>\n\n<ul>\n<li><code>command -v ss</code> : \"ss 명령이 PATH 에 있는가\" 만 확인. 출력은 필요 없으니 <code>&gt;/dev/null 2&gt;&amp;1</code> 로 버림.</li>\n<li><code>ss -tlnH</code> : TCP(<code>-t</code>) / LISTEN(<code>-l</code>) / 숫자(<code>-n</code>) / 헤더 없이(<code>-H</code>) 출력. 4번째 컬럼이 <code>Local Address:Port</code>.</li>\n<li><code>awk -v p=\":15034\"</code> : awk 안에 변수 <code>p</code> 를 만들어 셸 값을 전달.</li>\n<li><code>$4 ~ p</code> : 4번째 컬럼이 정규식 <code>p</code> 와 매칭되면 참.</li>\n<li><code>{print \"Y\"; exit}</code> : 한 줄만 찾으면 Y 출력하고 즉시 종료.</li>\n</ul>\n<blockquote>\n<p><code>ss</code> 가 없는 환경 대비 <code>netstat</code> 폴백을 둠 — 미니멀 컨테이너 이미지에선 둘 중 하나만 있을 수 있다.</p>\n</blockquote>\n<h4 id=\"3\">방화벽 상태 — 3단 폴백<a class=\"headerlink\" href=\"#3\" title=\"Permanent link\">#</a></h4>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"k\">if</span><span class=\"w\"> </span>systemctl<span class=\"w\"> </span>is-active<span class=\"w\"> </span>--quiet<span class=\"w\"> </span>ufw<span class=\"w\"> </span><span class=\"m\">2</span>&gt;/dev/null<span class=\"p\">;</span><span class=\"w\"> </span><span class=\"k\">then</span>\n<span class=\"w\">    </span><span class=\"nv\">FIREWALL_OK</span><span class=\"o\">=</span><span class=\"s2\">&quot;Y&quot;</span>\n<span class=\"k\">elif</span><span class=\"w\"> </span><span class=\"o\">[</span><span class=\"w\"> </span>-r<span class=\"w\"> </span>/etc/ufw/ufw.conf<span class=\"w\"> </span><span class=\"o\">]</span><span class=\"w\"> </span><span class=\"o\">&amp;&amp;</span><span class=\"w\"> </span>grep<span class=\"w\"> </span>-qE<span class=\"w\"> </span><span class=\"s1\">&#39;^ENABLED=yes&#39;</span><span class=\"w\"> </span>/etc/ufw/ufw.conf<span class=\"w\"> </span><span class=\"m\">2</span>&gt;/dev/null<span class=\"p\">;</span><span class=\"w\"> </span><span class=\"k\">then</span>\n<span class=\"w\">    </span><span class=\"nv\">FIREWALL_OK</span><span class=\"o\">=</span><span class=\"s2\">&quot;Y&quot;</span>\n<span class=\"k\">elif</span><span class=\"w\"> </span>systemctl<span class=\"w\"> </span>is-active<span class=\"w\"> </span>--quiet<span class=\"w\"> </span>firewalld<span class=\"w\"> </span><span class=\"m\">2</span>&gt;/dev/null<span class=\"p\">;</span><span class=\"w\"> </span><span class=\"k\">then</span>\n<span class=\"w\">    </span><span class=\"nv\">FIREWALL_OK</span><span class=\"o\">=</span><span class=\"s2\">&quot;Y&quot;</span>\n<span class=\"k\">fi</span>\n</code></pre></div>\n\n<p>monitor.sh 는 <strong>agent-admin (sudo 없음)</strong> 으로 cron 에서 돌기 때문에 <code>sudo ufw status</code> 같이 root 가 필요한 명령은 못 쓴다. 그래서 3중 fallback:</p>\n<ol>\n<li><code>systemctl is-active --quiet ufw</code> — 정석 (일반 사용자도 read-only 로 가능).</li>\n<li><code>/etc/ufw/ufw.conf</code> 의 <code>ENABLED=yes</code> — 이 파일은 기본 644 라 누구나 read. 일부 환경에서 룰은 적용됐는데 systemd unit 이 inactive 로 잡히는 경우의 보강.</li>\n<li><code>firewalld</code> (다른 배포판 대안) 도 같은 방식으로.</li>\n</ol>\n<h4 id=\"cpu-top-idle\">CPU 측정 — top 의 idle 컬럼 찾기<a class=\"headerlink\" href=\"#cpu-top-idle\" title=\"Permanent link\">#</a></h4>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"nv\">CPU_USAGE</span><span class=\"o\">=</span><span class=\"s2\">&quot;</span><span class=\"k\">$(</span>top<span class=\"w\"> </span>-bn1<span class=\"w\"> </span><span class=\"p\">|</span><span class=\"w\"> </span>awk<span class=\"w\"> </span>-F<span class=\"s1\">&#39;[ ,]+&#39;</span><span class=\"w\"> </span><span class=\"s1\">&#39;/Cpu\\(s\\)/ {for(i=1;i&lt;=NF;i++) if ($i ~ /id$/) {print 100 - $(i-1); exit}}&#39;</span><span class=\"k\">)</span><span class=\"s2\">&quot;</span>\n</code></pre></div>\n\n<p>이게 가장 복잡한 한 줄이라 풀어 보자.</p>\n<ul>\n<li><code>top -bn1</code> : top 을 batch(<code>-b</code>) 모드로 1회(<code>-n1</code>) 실행. 한 장면 스냅샷이 텍스트로 나옴.</li>\n<li><code>awk -F'[ ,]+'</code> : 컬럼 구분자를 \"공백 또는 쉼표 1 개 이상\" 으로 재정의. top 출력은 두 가지가 섞여 있어 둘 다 쳐줘야 한다.</li>\n<li><code>/Cpu\\(s\\)/ { ... }</code> : <code>Cpu(s)</code> 가 들어간 줄에만 액션 적용 (top 의 CPU 통계 줄).</li>\n<li><code>for(i=1;i&lt;=NF;i++)</code> : 모든 컬럼 순회. <code>NF</code> = Number of Fields.</li>\n<li><code>if ($i ~ /id$/)</code> : 그 컬럼이 <code>id</code> 로 끝나면 (top 출력은 <code>... 99.5 id ...</code> 처럼 idle 값 옆에 <code>id</code> 라벨).</li>\n<li><code>print 100 - $(i-1)</code> : 그 직전 컬럼(=idle 비율) 을 100 에서 뺌. <strong>CPU 사용률 = 100 − idle</strong>.</li>\n<li><code>exit</code> : 찾자마자 종료. 효율.</li>\n</ul>\n<h4 id=\"_5\">메모리 / 디스크 — 짧다<a class=\"headerlink\" href=\"#_5\" title=\"Permanent link\">#</a></h4>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"nv\">MEM_USAGE</span><span class=\"o\">=</span><span class=\"s2\">&quot;</span><span class=\"k\">$(</span>free<span class=\"w\"> </span><span class=\"p\">|</span><span class=\"w\"> </span>awk<span class=\"w\"> </span><span class=\"s1\">&#39;/^Mem:/ {printf &quot;%.1f&quot;, $3/$2*100}&#39;</span><span class=\"k\">)</span><span class=\"s2\">&quot;</span>\n<span class=\"nv\">DISK_USED</span><span class=\"o\">=</span><span class=\"s2\">&quot;</span><span class=\"k\">$(</span>df<span class=\"w\"> </span>-P<span class=\"w\"> </span>/<span class=\"w\"> </span><span class=\"p\">|</span><span class=\"w\"> </span>awk<span class=\"w\"> </span><span class=\"s1\">&#39;NR==2 {gsub(&quot;%&quot;,&quot;&quot;,$5); print $5}&#39;</span><span class=\"k\">)</span><span class=\"s2\">&quot;</span>\n</code></pre></div>\n\n<ul>\n<li><code>free</code> 의 <code>^Mem:</code> 줄 → <code>$2</code> = total, <code>$3</code> = used → 사용률 = used/total × 100.</li>\n<li><code>df -P /</code> 의 2번째 줄 → 5번째 컬럼이 <code>23%</code> 같은 형태 → <code>gsub(\"%\",\"\",$5)</code> 로 % 제거.</li>\n<li><code>printf \"%.1f\"</code> : 소수 1자리 출력.</li>\n</ul>\n<h4 id=\"bash\">임계값 — bash 가 소수 계산이 안 된다<a class=\"headerlink\" href=\"#bash\" title=\"Permanent link\">#</a></h4>\n<div class=\"codehilite\"><pre><span></span><code>awk<span class=\"w\"> </span>-v<span class=\"w\"> </span><span class=\"nv\">v</span><span class=\"o\">=</span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">CPU_USAGE</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span><span class=\"w\"> </span>-v<span class=\"w\"> </span><span class=\"nv\">t</span><span class=\"o\">=</span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">CPU_THRESHOLD</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span><span class=\"w\"> </span><span class=\"s1\">&#39;BEGIN {exit !(v+0 &gt; t+0)}&#39;</span><span class=\"w\"> </span><span class=\"se\">\\</span>\n<span class=\"w\">    </span><span class=\"o\">&amp;&amp;</span><span class=\"w\"> </span><span class=\"nb\">echo</span><span class=\"w\"> </span><span class=\"s2\">&quot;[WARNING] CPU threshold exceeded (</span><span class=\"si\">${</span><span class=\"nv\">CPU_USAGE</span><span class=\"si\">}</span><span class=\"s2\">% &gt; </span><span class=\"si\">${</span><span class=\"nv\">CPU_THRESHOLD</span><span class=\"si\">}</span><span class=\"s2\">%)&quot;</span>\n</code></pre></div>\n\n<ul>\n<li>bash 의 <code>[[ $a -gt $b ]]</code> 는 <strong>정수만</strong>. <code>25.3 &gt; 20</code> 같은 소수 비교는 못 한다.</li>\n<li>우회: awk 에서 비교 → 결과를 종료 코드로 → bash 의 <code>&amp;&amp;</code> 와 엮음.</li>\n<li><code>v+0</code> : 문자열 <code>\"25.3\"</code> 에 0 을 더해 강제 숫자 변환.</li>\n<li><code>BEGIN { ... }</code> : 입력 없이 한 번만 실행.</li>\n<li><code>exit !(v &gt; t)</code> : 참(1)이면 <code>!</code>로 0 → awk 종료 코드 0 (성공) → <code>&amp;&amp;</code> 다음 줄 실행.</li>\n</ul>\n<p>이 패턴은 \"<strong>bash 에서 소수 비교가 필요할 때의 표준 트릭</strong>\" — 외워두면 평생 쓴다.</p>\n<h4 id=\"append\">로그 append + 로테이션<a class=\"headerlink\" href=\"#append\" title=\"Permanent link\">#</a></h4>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"nb\">echo</span><span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">LOG_LINE</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span><span class=\"w\"> </span>&gt;&gt;<span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">LOG_FILE</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span>\n</code></pre></div>\n\n<ul>\n<li><code>&gt;&gt;</code> = <strong>이어쓰기</strong> (<code>&gt;</code> 는 덮어쓰기). 매분 한 줄씩 쌓이므로 시계열 로그.</li>\n</ul>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"nv\">SIZE</span><span class=\"o\">=</span><span class=\"s2\">&quot;</span><span class=\"k\">$(</span>stat<span class=\"w\"> </span>-c<span class=\"w\"> </span>%s<span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">LOG_FILE</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span><span class=\"w\"> </span><span class=\"m\">2</span>&gt;/dev/null<span class=\"w\"> </span><span class=\"o\">||</span><span class=\"w\"> </span>wc<span class=\"w\"> </span>-c<span class=\"w\"> </span>&lt;<span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">LOG_FILE</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span><span class=\"k\">)</span><span class=\"s2\">&quot;</span>\n<span class=\"k\">if</span><span class=\"w\"> </span><span class=\"o\">[[</span><span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">SIZE</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span><span class=\"w\"> </span>-ge<span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">MAX_LOG_SIZE</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span><span class=\"w\"> </span><span class=\"o\">]]</span><span class=\"p\">;</span><span class=\"w\"> </span><span class=\"k\">then</span>\n<span class=\"w\">    </span>rm<span class=\"w\"> </span>-f<span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">LOG_FILE</span><span class=\"si\">}</span><span class=\"s2\">.</span><span class=\"si\">${</span><span class=\"nv\">MAX_LOG_FILES</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span>\n<span class=\"w\">    </span><span class=\"k\">for</span><span class=\"w\"> </span><span class=\"o\">((</span><span class=\"nv\">i</span><span class=\"o\">=</span>MAX_LOG_FILES-1<span class=\"p\">;</span><span class=\"w\"> </span>i&gt;<span class=\"o\">=</span><span class=\"m\">1</span><span class=\"p\">;</span><span class=\"w\"> </span>i--<span class=\"o\">))</span><span class=\"p\">;</span><span class=\"w\"> </span><span class=\"k\">do</span>\n<span class=\"w\">        </span><span class=\"o\">[[</span><span class=\"w\"> </span>-f<span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">LOG_FILE</span><span class=\"si\">}</span><span class=\"s2\">.</span><span class=\"si\">${</span><span class=\"nv\">i</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span><span class=\"w\"> </span><span class=\"o\">]]</span><span class=\"w\"> </span><span class=\"o\">&amp;&amp;</span><span class=\"w\"> </span>mv<span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">LOG_FILE</span><span class=\"si\">}</span><span class=\"s2\">.</span><span class=\"si\">${</span><span class=\"nv\">i</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span><span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">LOG_FILE</span><span class=\"si\">}</span><span class=\"s2\">.</span><span class=\"k\">$((</span><span class=\"nv\">i</span><span class=\"o\">+</span><span class=\"m\">1</span><span class=\"k\">))</span><span class=\"s2\">&quot;</span>\n<span class=\"w\">    </span><span class=\"k\">done</span>\n<span class=\"w\">    </span>mv<span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">LOG_FILE</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span><span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">LOG_FILE</span><span class=\"si\">}</span><span class=\"s2\">.1&quot;</span>\n<span class=\"w\">    </span>:<span class=\"w\"> </span>&gt;<span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">LOG_FILE</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span>\n<span class=\"k\">fi</span>\n</code></pre></div>\n\n<ul>\n<li><code>stat -c %s 파일</code> : 파일 크기(바이트). 일부 환경에 없을 수 있어 <code>wc -c &lt; 파일</code> 폴백.</li>\n<li><code>for ((i=...))</code> : C 스타일 for 반복. <strong>bash 전용</strong>, sh 에선 안 됨.</li>\n<li>동작 순서:\n  1. 가장 오래된 <code>.10</code> 삭제\n  2. <code>.9 → .10</code>, <code>.8 → .9</code>, … <code>.1 → .2</code> 로 한 칸씩 밀기\n  3. 현재 <code>monitor.log → monitor.log.1</code> 로 이름 변경\n  4. <code>: &gt; monitor.log</code> 로 0바이트 새 파일 생성 (<code>:</code> 는 \"아무것도 안 함\" 명령, 그 출력을 빈 파일로 리다이렉트).</li>\n</ul>\n<h3 id=\"42-reportsh-awk\">4.2 <code>report.sh</code> — awk 한 덩어리 통계<a class=\"headerlink\" href=\"#42-reportsh-awk\" title=\"Permanent link\">#</a></h3>\n<p>monitor.log 의 각 줄에서 시각/CPU/MEM/DISK 를 뽑아 평균·최대·최소 + 시각을 같이 보고한다.</p>\n<div class=\"codehilite\"><pre><span></span><code>awk<span class=\"w\"> </span>-v<span class=\"w\"> </span><span class=\"nv\">ts_start</span><span class=\"o\">=</span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">START_TS</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span><span class=\"w\"> </span>-v<span class=\"w\"> </span><span class=\"nv\">ts_end</span><span class=\"o\">=</span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">END_TS</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span><span class=\"w\"> </span><span class=\"s1\">&#39;</span>\n<span class=\"s1\">{</span>\n<span class=\"s1\">    if (match($0, /\\[[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}\\]/)) {</span>\n<span class=\"s1\">        ts = substr($0, RSTART+1, RLENGTH-2)</span>\n<span class=\"s1\">    } else { next }</span>\n\n<span class=\"s1\">    if (ts_start != &quot;&quot; &amp;&amp; ts &lt; ts_start) next</span>\n<span class=\"s1\">    if (ts_end   != &quot;&quot; &amp;&amp; ts &gt; ts_end)   next</span>\n\n<span class=\"s1\">    cpu = &quot;&quot;; mem = &quot;&quot;; disk = &quot;&quot;</span>\n<span class=\"s1\">    if (match($0, /CPU:[0-9.]+%/))       cpu  = substr($0, RSTART+4, RLENGTH-5)</span>\n<span class=\"s1\">    ...</span>\n\n<span class=\"s1\">    n++</span>\n<span class=\"s1\">    cpu_sum += cpu</span>\n<span class=\"s1\">    if (n == 1 || cpu+0 &gt; cpu_max+0) { cpu_max = cpu; cpu_max_ts = ts }</span>\n<span class=\"s1\">    ...</span>\n<span class=\"s1\">}</span>\n<span class=\"s1\">END {</span>\n<span class=\"s1\">    printf &quot;    Average : %.1f%%\\n&quot;, cpu_sum/n</span>\n<span class=\"s1\">    ...</span>\n<span class=\"s1\">}</span>\n<span class=\"s1\">&#39;</span><span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">LOG_FILE</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span>\n</code></pre></div>\n\n<h4 id=\"awk-5\">awk 의 핵심 내장 변수 5 개<a class=\"headerlink\" href=\"#awk-5\" title=\"Permanent link\">#</a></h4>\n<table>\n<thead>\n<tr>\n<th>변수</th>\n<th>의미</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>$0</code></td>\n<td>줄 전체</td>\n</tr>\n<tr>\n<td><code>$1</code>, <code>$2</code>, …</td>\n<td>N 번째 컬럼 (공백으로 자름)</td>\n</tr>\n<tr>\n<td><code>NF</code></td>\n<td>컬럼 개수</td>\n</tr>\n<tr>\n<td><code>NR</code></td>\n<td>현재 줄 번호 (1부터)</td>\n</tr>\n<tr>\n<td><code>FS</code></td>\n<td>컬럼 구분자 (<code>-F</code> 옵션으로 바꿈)</td>\n</tr>\n</tbody>\n</table>\n<h4 id=\"match-substr\"><code>match</code> + <code>substr</code> — 정규식으로 일부 추출<a class=\"headerlink\" href=\"#match-substr\" title=\"Permanent link\">#</a></h4>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"k\">if</span> <span class=\"p\">(</span><span class=\"kr\">match</span><span class=\"p\">(</span><span class=\"o\">$</span><span class=\"mi\">0</span><span class=\"p\">,</span> <span class=\"sr\">/CPU:[0-9.]+%/</span><span class=\"p\">))</span> <span class=\"nx\">cpu</span> <span class=\"o\">=</span> <span class=\"kr\">substr</span><span class=\"p\">(</span><span class=\"o\">$</span><span class=\"mi\">0</span><span class=\"p\">,</span> <span class=\"nb\">RSTART</span><span class=\"o\">+</span><span class=\"mi\">4</span><span class=\"p\">,</span> <span class=\"nb\">RLENGTH</span><span class=\"o\">-</span><span class=\"mi\">5</span><span class=\"p\">)</span>\n</code></pre></div>\n\n<ul>\n<li><code>match(문자열, 정규식)</code> : 매칭되면 <code>RSTART</code>(시작 위치) 와 <code>RLENGTH</code>(매치 길이) 를 세팅, 매칭 안 되면 0.</li>\n<li><code>substr(문자열, 시작, 길이)</code> : 부분 문자열. <code>RSTART+4</code> 로 <code>CPU:</code> 4 글자를 건너뛰고, <code>RLENGTH-5</code> 로 양 끝의 <code>CPU:</code> (4) + <code>%</code> (1) 를 빼서 숫자만.</li>\n</ul>\n<h4 id=\"begin-end\"><code>BEGIN</code> / <code>END</code> 패턴<a class=\"headerlink\" href=\"#begin-end\" title=\"Permanent link\">#</a></h4>\n<table>\n<thead>\n<tr>\n<th>패턴</th>\n<th>언제 실행</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>BEGIN { ... }</code></td>\n<td>입력 읽기 <strong>전</strong>, 한 번</td>\n</tr>\n<tr>\n<td><code>END   { ... }</code></td>\n<td>입력 다 읽은 <strong>뒤</strong>, 한 번</td>\n</tr>\n</tbody>\n</table>\n<p>→ \"초기화\" 와 \"총합·평균 출력\" 자리.</p>\n<h4 id=\"awk-end\">awk 변수명에 <code>END</code> 를 못 쓰는 함정<a class=\"headerlink\" href=\"#awk-end\" title=\"Permanent link\">#</a></h4>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"c1\"># 이전엔 -v END=&quot;${END_TS}&quot; 였는데 mawk 에서 다음 에러:</span>\n<span class=\"c1\">#   awk: cannot command line assign to END</span>\n<span class=\"c1\">#   reserved for special use</span>\nawk<span class=\"w\"> </span>-v<span class=\"w\"> </span><span class=\"nv\">ts_start</span><span class=\"o\">=</span><span class=\"s2\">&quot;...&quot;</span><span class=\"w\"> </span>-v<span class=\"w\"> </span><span class=\"nv\">ts_end</span><span class=\"o\">=</span><span class=\"s2\">&quot;...&quot;</span><span class=\"w\">     </span><span class=\"c1\"># 이 이름으로 바꿔야 안전</span>\n</code></pre></div>\n\n<p><code>END</code> 는 awk 의 예약 키워드라 일부 구현(특히 mawk)에선 <code>-v</code> 로 값을 줄 수 없다. <strong>변수명에 BEGIN/END/NF/NR 같은 키워드는 피하자</strong>.</p>\n<h4 id=\"n-1-cpu0-cpu_max0\"><code>n == 1 || cpu+0 &gt; cpu_max+0</code><a class=\"headerlink\" href=\"#n-1-cpu0-cpu_max0\" title=\"Permanent link\">#</a></h4>\n<p>처음 줄에서는 <code>cpu_max</code> 가 비어 있으므로 무조건 갱신, 그 뒤로는 큰 값이 들어올 때만. <strong>0 더하기 트릭 (<code>+0</code>)</strong> 으로 강제 숫자 비교.</p>\n<h3 id=\"43-archive_logssh-find-while\">4.3 <code>archive_logs.sh</code> — find + 안전한 while 루프<a class=\"headerlink\" href=\"#43-archive_logssh-find-while\" title=\"Permanent link\">#</a></h3>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"k\">while</span><span class=\"w\"> </span><span class=\"nv\">IFS</span><span class=\"o\">=</span><span class=\"w\"> </span><span class=\"nb\">read</span><span class=\"w\"> </span>-r<span class=\"w\"> </span>-d<span class=\"w\"> </span><span class=\"s1\">&#39;&#39;</span><span class=\"w\"> </span>f<span class=\"p\">;</span><span class=\"w\"> </span><span class=\"k\">do</span>\n<span class=\"w\">    </span><span class=\"nv\">base</span><span class=\"o\">=</span><span class=\"s2\">&quot;</span><span class=\"k\">$(</span>basename<span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">f</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span><span class=\"k\">)</span><span class=\"s2\">&quot;</span>\n<span class=\"w\">    </span><span class=\"nv\">ts</span><span class=\"o\">=</span><span class=\"s2\">&quot;</span><span class=\"k\">$(</span>date<span class=\"w\"> </span><span class=\"s1\">&#39;+%Y%m%d_%H%M%S&#39;</span><span class=\"k\">)</span><span class=\"s2\">&quot;</span>\n<span class=\"w\">    </span><span class=\"nv\">target</span><span class=\"o\">=</span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">ARCHIVE_DIR</span><span class=\"si\">}</span><span class=\"s2\">/</span><span class=\"si\">${</span><span class=\"nv\">base</span><span class=\"si\">}</span><span class=\"s2\">.</span><span class=\"si\">${</span><span class=\"nv\">ts</span><span class=\"si\">}</span><span class=\"s2\">.gz&quot;</span>\n<span class=\"w\">    </span><span class=\"k\">if</span><span class=\"w\"> </span>gzip<span class=\"w\"> </span>-c<span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">f</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span><span class=\"w\"> </span>&gt;<span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">target</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span><span class=\"w\"> </span><span class=\"m\">2</span>&gt;/dev/null<span class=\"p\">;</span><span class=\"w\"> </span><span class=\"k\">then</span>\n<span class=\"w\">        </span>rm<span class=\"w\"> </span>-f<span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">f</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span>\n<span class=\"w\">        </span><span class=\"nv\">COMPRESSED</span><span class=\"o\">=</span><span class=\"k\">$((</span><span class=\"nv\">COMPRESSED</span><span class=\"w\"> </span><span class=\"o\">+</span><span class=\"w\"> </span><span class=\"m\">1</span><span class=\"k\">))</span>\n<span class=\"w\">    </span><span class=\"k\">fi</span>\n<span class=\"k\">done</span><span class=\"w\"> </span>&lt;<span class=\"w\"> </span>&lt;<span class=\"o\">(</span>find<span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">SRC_DIR</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span><span class=\"w\"> </span>-maxdepth<span class=\"w\"> </span><span class=\"m\">1</span><span class=\"w\"> </span>-type<span class=\"w\"> </span>f<span class=\"w\"> </span>-name<span class=\"w\"> </span><span class=\"s1\">&#39;*.log&#39;</span><span class=\"w\"> </span>-mtime<span class=\"w\"> </span>+7<span class=\"w\"> </span>-print0<span class=\"w\"> </span><span class=\"m\">2</span>&gt;/dev/null<span class=\"o\">)</span>\n</code></pre></div>\n\n<p>낯설어 보이는 건 다 <strong>공백/특수문자가 든 파일명에서도 안전하게 동작하기 위한 관용구</strong>.</p>\n<h4 id=\"find\"><code>find</code> 옵션<a class=\"headerlink\" href=\"#find\" title=\"Permanent link\">#</a></h4>\n<ul>\n<li><code>-maxdepth 1</code> : 하위 디렉토리까지 내려가지 말고 그 폴더 안만.</li>\n<li><code>-type f</code> : 일반 파일만 (디렉토리/심볼릭 링크 제외).</li>\n<li><code>-name '*.log'</code> : <code>.log</code> 로 끝나는 이름.</li>\n<li><code>-mtime +7</code> : 마지막 수정으로부터 <strong>7일 초과</strong> 지난 것 (<code>-mtime -7</code> 은 7일 이내).</li>\n<li><code>-print0</code> : 파일명 사이를 <strong>널 문자 <code>\\0</code></strong> 로 구분. 줄바꿈 구분이면 이름에 줄바꿈이 든 파일에 깨짐.</li>\n</ul>\n<h4 id=\"while-ifs-read-r-d-f-do-done\"><code>while IFS= read -r -d '' f; do ... done &lt; &lt;(...)</code><a class=\"headerlink\" href=\"#while-ifs-read-r-d-f-do-done\" title=\"Permanent link\">#</a></h4>\n<table>\n<thead>\n<tr>\n<th>토큰</th>\n<th>역할</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>IFS=</code></td>\n<td>단어 구분자 비움 → 공백 보존</td>\n</tr>\n<tr>\n<td><code>read -r</code></td>\n<td>백슬래시 이스케이프 처리 안 함 (raw)</td>\n</tr>\n<tr>\n<td><code>read -d ''</code></td>\n<td>입력 구분자를 널 문자로 (find 의 <code>-print0</code> 와 짝)</td>\n</tr>\n<tr>\n<td><code>&lt; &lt;(cmd)</code></td>\n<td>\"프로세스 치환\" — 명령 출력을 파일처럼 read 가 받아 읽음</td>\n</tr>\n</tbody>\n</table>\n<p>이 패턴 = \"<strong>파일 목록을 안전하게 한 줄씩 처리할 때의 정석</strong>\". 외워두면 일생 쓴다.</p>\n<h4 id=\"gzip\">gzip + 원본 삭제<a class=\"headerlink\" href=\"#gzip\" title=\"Permanent link\">#</a></h4>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"k\">if</span><span class=\"w\"> </span>gzip<span class=\"w\"> </span>-c<span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">f</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span><span class=\"w\"> </span>&gt;<span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">target</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span><span class=\"w\"> </span><span class=\"m\">2</span>&gt;/dev/null<span class=\"p\">;</span><span class=\"w\"> </span><span class=\"k\">then</span>\n<span class=\"w\">    </span>rm<span class=\"w\"> </span>-f<span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">f</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span>\n<span class=\"k\">fi</span>\n</code></pre></div>\n\n<ul>\n<li><code>gzip -c</code> : 원본을 지우지 않고 압축 결과를 stdout 으로.</li>\n<li><code>&gt; target</code> : 그 출력을 <code>.gz</code> 새 파일로 저장.</li>\n<li><strong>압축이 성공해야 원본 삭제</strong> — <code>&amp;&amp;</code> 가 아니라 <code>if</code> 로 분기한 이유는, <code>set -u</code> 만 켜진 상황에서도 명확히 \"둘 다 성공해야 다음\" 을 표현하기 위해.</li>\n</ul>\n<hr />\n<h2 id=\"5-00_run_allsh-wrapper\">5. <code>00_run_all.sh</code> — wrapper 의 작은 트릭<a class=\"headerlink\" href=\"#5-00_run_allsh-wrapper\" title=\"Permanent link\">#</a></h2>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"nv\">HERE</span><span class=\"o\">=</span><span class=\"s2\">&quot;</span><span class=\"k\">$(</span><span class=\"nb\">cd</span><span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"k\">$(</span>dirname<span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">BASH_SOURCE</span><span class=\"p\">[0]</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span><span class=\"k\">)</span><span class=\"s2\">&quot;</span><span class=\"w\"> </span><span class=\"o\">&amp;&amp;</span><span class=\"w\"> </span><span class=\"nb\">pwd</span><span class=\"k\">)</span><span class=\"s2\">&quot;</span>\n<span class=\"nb\">export</span><span class=\"w\"> </span><span class=\"nv\">SOURCE_DIR</span><span class=\"o\">=</span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">SOURCE_DIR</span><span class=\"k\">:-</span><span class=\"nv\">$HERE</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span>\n\n<span class=\"nv\">STEPS</span><span class=\"o\">=(</span>\n<span class=\"w\">    </span><span class=\"s2\">&quot;01_ssh_hardening.sh&quot;</span>\n<span class=\"w\">    </span><span class=\"s2\">&quot;02_firewall_allowlist.sh&quot;</span>\n<span class=\"w\">    </span>...\n<span class=\"o\">)</span>\n\n<span class=\"nv\">TOTAL</span><span class=\"o\">=</span><span class=\"s2\">&quot;</span><span class=\"si\">${#</span><span class=\"nv\">STEPS</span><span class=\"p\">[@]</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span>\n<span class=\"k\">for</span><span class=\"w\"> </span>step<span class=\"w\"> </span><span class=\"k\">in</span><span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">STEPS</span><span class=\"p\">[@]</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span><span class=\"p\">;</span><span class=\"w\"> </span><span class=\"k\">do</span>\n<span class=\"w\">    </span>bash<span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">HERE</span><span class=\"si\">}</span><span class=\"s2\">/</span><span class=\"si\">${</span><span class=\"nv\">step</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span>\n<span class=\"k\">done</span>\n</code></pre></div>\n\n<ul>\n<li><code>BASH_SOURCE[0]</code> : 지금 실행 중인 스크립트 파일의 경로. <code>$0</code> 도 비슷하지만 source 됐을 땐 호출 측 셸 이름이 잡혀 위험.</li>\n<li><code>$(cd \"$(dirname …)\" &amp;&amp; pwd)</code> : 상대 경로를 절대 경로로 만들기 위한 관용구. <code>dirname</code> 으로 부모 디렉토리, <code>cd</code> + <code>pwd</code> 로 절대화.</li>\n<li><code>STEPS=( \"...\" \"...\" )</code> : 배열. <strong>bash 전용</strong> (sh 에는 배열 없음).</li>\n<li><code>\"${#STEPS[@]}\"</code> : 배열 길이. <code>#</code> 는 \"개수\", <code>[@]</code> 는 \"모든 원소\".</li>\n<li><code>\"${STEPS[@]}\"</code> : 모든 원소를 각각의 인자로 전개 (vs <code>\"${STEPS[*]}\"</code> 는 한 문자열로 합침).</li>\n</ul>\n<hr />\n<h2 id=\"55\">5.5 정규식 — 최소 생존 키트<a class=\"headerlink\" href=\"#55\" title=\"Permanent link\">#</a></h2>\n<p>문서 곳곳에 <code>^#?Port</code>, <code>[0-9.]+%</code>, <code>/Cpu\\(s\\)/</code> 같은 패턴이 나왔다. 이건 모두 <strong>정규식(regular expression)</strong> 이다. \"문자열의 패턴\" 을 표현하는 작은 언어로, grep / sed / awk 의 핵심 무기.</p>\n<p>가장 자주 쓰는 메타문자 10개만 외워도 80% 가 읽힌다.</p>\n<table>\n<thead>\n<tr>\n<th>문자</th>\n<th>의미</th>\n<th>예</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>.</code></td>\n<td><strong>아무 글자 한 개</strong></td>\n<td><code>a.c</code> → <code>abc</code>, <code>a c</code>, <code>a9c</code></td>\n</tr>\n<tr>\n<td><code>*</code></td>\n<td><strong>앞 글자 0회 이상</strong></td>\n<td><code>ab*</code> → <code>a</code>, <code>ab</code>, <code>abbb</code></td>\n</tr>\n<tr>\n<td><code>+</code></td>\n<td><strong>앞 글자 1회 이상</strong> (확장 정규식)</td>\n<td><code>ab+</code> → <code>ab</code>, <code>abbb</code> (<code>a</code> 는 X)</td>\n</tr>\n<tr>\n<td><code>?</code></td>\n<td><strong>앞 글자 0회 또는 1회</strong></td>\n<td><code>colou?r</code> → <code>color</code>, <code>colour</code></td>\n</tr>\n<tr>\n<td><code>^</code></td>\n<td><strong>줄의 시작</strong></td>\n<td><code>^Port</code> → \"Port 로 시작하는 줄\"</td>\n</tr>\n<tr>\n<td><code>$</code></td>\n<td><strong>줄의 끝</strong></td>\n<td><code>\\.log$</code> → \".log 로 끝나는 줄\"</td>\n</tr>\n<tr>\n<td><code>[abc]</code></td>\n<td><strong>괄호 안 글자 중 하나</strong></td>\n<td><code>[0-9]</code> → 숫자 한 개</td>\n</tr>\n<tr>\n<td><code>[^abc]</code></td>\n<td><strong>괄호 안 글자가 아닌</strong> 한 개</td>\n<td><code>[^0-9]</code> → 숫자 아닌 한 개</td>\n</tr>\n<tr>\n<td><code>\\</code></td>\n<td><strong>다음 글자를 메타가 아닌 그냥 글자로</strong></td>\n<td><code>\\.</code> → 진짜 점, <code>\\(</code> → 진짜 괄호</td>\n</tr>\n<tr>\n<td><code>()</code></td>\n<td>묶음 (확장 정규식에서 그룹)</td>\n<td><code>(abc)+</code> → abc 가 한 번 이상</td>\n</tr>\n</tbody>\n</table>\n<p>다시 우리 코드의 패턴을 풀어 보면:</p>\n<ul>\n<li><code>^#?Port .*</code> → 줄 시작(<code>^</code>)에 <code>#</code> 이 <strong>있어도 없어도(<code>?</code>)</strong> 좋고, 그 뒤 <code>Port</code>, 그 뒤 아무 글자 0개 이상(<code>.*</code>). → 주석 처리된 <code>#Port 22</code> 와 그냥 <code>Port 22</code> 를 둘 다 잡으려는 트릭.</li>\n<li><code>[0-9.]+%</code> → 숫자 또는 점이 1개 이상 + <code>%</code>. → <code>25.3%</code>, <code>100%</code> 같은 패턴.</li>\n<li><code>/Cpu\\(s\\)/</code> → 문자 그대로 <code>Cpu(s)</code>. 괄호는 메타이므로 <code>\\(</code>, <code>\\)</code> 로 <strong>이스케이프</strong>.</li>\n<li><code>\\.log$</code> → 글자 그대로 <code>.log</code> 로 끝남. <code>.</code> 앞에 <code>\\</code> 안 붙이면 \"아무 글자 + log\" 가 돼 버려 의도와 달라진다.</li>\n</ul>\n<blockquote>\n<p>정규식엔 <strong>BRE(기본)</strong> 과 <strong>ERE(확장)</strong> 두 종류가 있다. <code>+</code>, <code>?</code>, <code>|</code>, <code>()</code> 가 메타로 쓰이려면 ERE 가 필요. <code>grep -E</code>, <code>sed -E</code>, <code>awk</code> (기본 ERE) 가 ERE 모드.</p>\n</blockquote>\n<hr />\n<h2 id=\"6\">6. 자주 헷갈리는 포인트 모음<a class=\"headerlink\" href=\"#6\" title=\"Permanent link\">#</a></h2>\n<ol>\n<li><strong><code>=</code> 양옆 공백 금지</strong> — <code>A=1</code> (O), <code>A = 1</code> (X: \"A 라는 명령어가 없다\" 에러).</li>\n<li><strong>변수는 무조건 큰따옴표로 감싸기</strong> — <code>\"${VAR}\"</code>. 공백/특수문자 든 경로에서 안 그러면 단어가 쪼개진다.</li>\n<li><strong>작은따옴표 vs 큰따옴표</strong>\n   - <code>'...'</code> : 안의 모든 것을 문자 그대로. <code>$VAR</code> 도 안 풀림.\n   - <code>\"...\"</code> : <code>$VAR</code> 를 값으로 치환.\n   - 우리 heredoc 에서 <code>&lt;&lt;'EOF'</code> 처럼 마커를 작은따옴표로 감싸는 이유가 이것.</li>\n<li><strong>숫자 비교 vs 문자열 비교</strong>\n   - 숫자(정수): <code>$a -gt $b</code>\n   - 문자열: <code>\"$a\" = \"$b\"</code>\n   - 소수: bash 불가 → awk 위임 (§4.1 임계값 트릭)</li>\n<li><strong>백틱 <code>`…`</code> 보다 <code>$(…)</code></strong> — 가독성·중첩 모두 우월.</li>\n<li><strong>종료 코드 0 = 성공</strong>. 사람 직관과 반대라 처음에 헷갈린다. cron/CI 가 이 숫자를 본다.</li>\n<li><strong><code>if</code> 의 조건은 명령의 종료 코드를 본다</strong> — <code>if grep -q foo file; then …</code> 는 grep 이 찾으면 0 → 참.</li>\n<li><strong>줄바꿈은 LF</strong> — Windows 에서 만든 파일은 CRLF, bash 가 <code>\\r</code> 까지 명령 일부로 인식해 깨진다 → <code>dos2unix</code> (06 단계가 자동으로 처리해 줌).</li>\n<li><strong><code>sudo</code> 와 리다이렉트</strong> — <code>sudo cmd &gt; file</code> 의 <code>&gt; file</code> 은 sudo 가 아닌 <strong>호출 측 셸</strong> 이 처리한다. 권한이 모자라면 거부. 해결: <code>cmd | sudo tee file &gt; /dev/null</code> 또는 <code>sudo bash -c 'cmd &gt; file'</code>.</li>\n<li><strong><code>pgrep -f</code> vs <code>-x</code> 자기참조 함정</strong> — cmdline 에 자기 경로가 들어가면 자신을 매칭하는 사고. 우리 <code>monitor.sh</code> 가 <code>-x</code> 를 쓰는 이유.</li>\n</ol>\n<hr />\n<h2 id=\"7\">7. 직접 실험해 보기 좋은 작은 예제<a class=\"headerlink\" href=\"#7\" title=\"Permanent link\">#</a></h2>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"c1\"># 1) 변수와 기본값 + 첫 번째 인자</span>\n<span class=\"nv\">NAME</span><span class=\"o\">=</span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">1</span><span class=\"k\">:-</span><span class=\"nv\">friend</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span>\n<span class=\"nb\">echo</span><span class=\"w\"> </span><span class=\"s2\">&quot;Hello, </span><span class=\"nv\">$NAME</span><span class=\"s2\">!&quot;</span>\n<span class=\"c1\"># ./hi.sh         → Hello, friend!</span>\n<span class=\"c1\"># ./hi.sh goobeom → Hello, goobeom!</span>\n</code></pre></div>\n\n<div class=\"codehilite\"><pre><span></span><code><span class=\"c1\"># 2) 조건문 + 파일 검사</span>\n<span class=\"k\">if</span><span class=\"w\"> </span><span class=\"o\">[[</span><span class=\"w\"> </span>-f<span class=\"w\"> </span>/etc/hosts<span class=\"w\"> </span><span class=\"o\">]]</span><span class=\"p\">;</span><span class=\"w\"> </span><span class=\"k\">then</span>\n<span class=\"w\">    </span><span class=\"nb\">echo</span><span class=\"w\"> </span><span class=\"s2\">&quot;exists&quot;</span>\n<span class=\"k\">else</span>\n<span class=\"w\">    </span><span class=\"nb\">echo</span><span class=\"w\"> </span><span class=\"s2\">&quot;missing&quot;</span>\n<span class=\"k\">fi</span>\n</code></pre></div>\n\n<div class=\"codehilite\"><pre><span></span><code><span class=\"c1\"># 3) 반복문 — 배열 순회</span>\n<span class=\"nv\">FRUITS</span><span class=\"o\">=(</span><span class=\"s2\">&quot;apple&quot;</span><span class=\"w\"> </span><span class=\"s2\">&quot;banana&quot;</span><span class=\"w\"> </span><span class=\"s2\">&quot;cherry&quot;</span><span class=\"o\">)</span>\n<span class=\"k\">for</span><span class=\"w\"> </span>f<span class=\"w\"> </span><span class=\"k\">in</span><span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"si\">${</span><span class=\"nv\">FRUITS</span><span class=\"p\">[@]</span><span class=\"si\">}</span><span class=\"s2\">&quot;</span><span class=\"p\">;</span><span class=\"w\"> </span><span class=\"k\">do</span>\n<span class=\"w\">    </span><span class=\"nb\">echo</span><span class=\"w\"> </span><span class=\"s2\">&quot;fruit: </span><span class=\"nv\">$f</span><span class=\"s2\">&quot;</span>\n<span class=\"k\">done</span>\n</code></pre></div>\n\n<div class=\"codehilite\"><pre><span></span><code><span class=\"c1\"># 4) 명령어 결과 + 숫자 조건</span>\n<span class=\"nv\">COUNT</span><span class=\"o\">=</span><span class=\"s2\">&quot;</span><span class=\"k\">$(</span>ls<span class=\"w\"> </span>/etc<span class=\"w\"> </span><span class=\"p\">|</span><span class=\"w\"> </span>wc<span class=\"w\"> </span>-l<span class=\"k\">)</span><span class=\"s2\">&quot;</span>\n<span class=\"k\">if</span><span class=\"w\"> </span><span class=\"o\">[[</span><span class=\"w\"> </span><span class=\"s2\">&quot;</span><span class=\"nv\">$COUNT</span><span class=\"s2\">&quot;</span><span class=\"w\"> </span>-gt<span class=\"w\"> </span><span class=\"m\">50</span><span class=\"w\"> </span><span class=\"o\">]]</span><span class=\"p\">;</span><span class=\"w\"> </span><span class=\"k\">then</span>\n<span class=\"w\">    </span><span class=\"nb\">echo</span><span class=\"w\"> </span><span class=\"s2\">&quot;many files: </span><span class=\"nv\">$COUNT</span><span class=\"s2\">&quot;</span>\n<span class=\"k\">fi</span>\n</code></pre></div>\n\n<p>이 네 개만 손에 익으면 <code>monitor.sh</code> / <code>report.sh</code> 의 90% 가 읽힌다.</p>\n<hr />\n<h2 id=\"8\">8. 학습 흐름 추천<a class=\"headerlink\" href=\"#8\" title=\"Permanent link\">#</a></h2>\n<ol>\n<li>위 §7 예제 4 개를 직접 만들어 실행 → 변수/조건/반복 감 잡기.</li>\n<li><code>01_ssh_hardening.sh</code> → <code>02_firewall_allowlist.sh</code> 순으로 <strong>각 줄을 손으로 입력해 보며</strong> sudo/sed/systemctl 의 출력을 눈으로 확인.</li>\n<li><code>monitor.sh</code> 의 1~3 블록(설정/Health check/자원 수집) 만 따로 떼어 실행해 보고, OrbStack 머신에서 일부러 agent-app 을 끄거나 포트를 막아 FAIL 경로의 출력을 확인.</li>\n<li><code>report.sh</code> 의 awk 한 덩어리를 한 줄씩 주석 처리하며 출력이 어떻게 변하는지 관찰. 특히 <code>match</code> / <code>substr</code> 의 <code>RSTART</code>/<code>RLENGTH</code> 동작을 확인.</li>\n<li><code>archive_logs.sh</code> 의 <code>find</code> 옵션을 \"7일 → 1일\", \"30일 → 5일\" 로 짧게 바꾸고 임의 <code>*.log</code> 를 만들어 동작 확인.</li>\n</ol>\n<p>막히면 <strong>그 시점의 변수 값을 echo 로 찍어보는 것</strong>이 디버깅 1순위 도구다.</p>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"nb\">echo</span><span class=\"w\"> </span><span class=\"s2\">&quot;DEBUG: CPU_USAGE=[</span><span class=\"nv\">$CPU_USAGE</span><span class=\"s2\">] MEM_USAGE=[</span><span class=\"nv\">$MEM_USAGE</span><span class=\"s2\">]&quot;</span><span class=\"w\"> </span>&gt;<span class=\"p\">&amp;</span><span class=\"m\">2</span>\n</code></pre></div>\n\n<p><code>&gt;&amp;2</code> 는 \"표준에러로 출력\". 로그 파일에 섞이지 않게 화면에만 보인다.</p>", "toc": "<div class=\"toc\">\n<ul>\n<li><a href=\"#0\">0. 전체 구조 한눈에</a></li>\n<li><a href=\"#1-1\">1. 쉘 스크립트가 뭐냐 — 1 분 요약</a></li>\n<li><a href=\"#15\">1.5 처음 만나는 단어들 — 한 페이지 사전</a></li>\n<li><a href=\"#16\">1.6 파이프 · 리다이렉트 — \"출력의 흐름\" 한 번에 정리</a><ul>\n<li><a href=\"#_1\">파이프 | — 앞 명령의 출력을 뒤 명령의 입력으로</a></li>\n<li><a href=\"#_2\">리다이렉트 — 출력을 화면 대신 파일로</a></li>\n</ul>\n</li>\n<li><a href=\"#2\">2. 모든 스크립트의 공통 머리</a><ul>\n<li><a href=\"#usrbinenv-bash-shebang\">#!/usr/bin/env bash (셔뱅, shebang)</a></li>\n<li><a href=\"#set-e-set-u-set-o-pipefail\">set -e / set -u / set -o pipefail</a></li>\n</ul>\n</li>\n<li><a href=\"#3-setup-7\">3. setup 7 단계 — 각 단계가 하는 일</a><ul>\n<li><a href=\"#31-01_ssh_hardeningsh-ssh-root\">3.1 01_ssh_hardening.sh — SSH 포트 변경 + Root 차단</a></li>\n<li><a href=\"#32-02_firewall_allowlistsh-ufw\">3.2 02_firewall_allowlist.sh — UFW 화이트리스트</a></li>\n<li><a href=\"#33-03_users_and_groupssh-3-2\">3.3 03_users_and_groups.sh — 계정 3종 / 그룹 2종</a></li>\n<li><a href=\"#34-04_directories_and_aclsh-acl\">3.4 04_directories_and_acl.sh — 디렉토리 + 권한 + ACL</a><ul>\n<li><a href=\"#posix\">POSIX 권한 숫자의 의미</a></li>\n<li><a href=\"#setfacl-posix\">setfacl — POSIX 권한의 한계를 보완</a></li>\n</ul>\n</li>\n<li><a href=\"#35-05_env_and_keyfilesh-api\">3.5 05_env_and_keyfile.sh — 환경변수 + API 키</a></li>\n<li><a href=\"#36-06_deploy_app_and_scriptssh\">3.6 06_deploy_app_and_scripts.sh — 바이너리 + 스크립트 배포</a></li>\n<li><a href=\"#37-07_cron_schedulesh-cron\">3.7 07_cron_schedule.sh — cron 등록</a><ul>\n<li><a href=\"#agent_home\">왜 명령줄 앞에 AGENT_HOME=… 을 다시 적나</a></li>\n</ul>\n</li>\n</ul>\n</li>\n<li><a href=\"#4-3\">4. 운영 3종 — 한 줄씩 해설</a><ul>\n<li><a href=\"#40-grep-sed-awk-3\">4.0 잠깐 — grep / sed / awk 3대장 미니 소개</a><ul>\n<li><a href=\"#awk\">awk 프로그램의 뼈대 한 번 보기</a></li>\n</ul>\n</li>\n<li><a href=\"#41-monitorsh\">4.1 monitor.sh — 시스템 상태 수집</a><ul>\n<li><a href=\"#_3\">변수 + 기본값 패턴</a></li>\n<li><a href=\"#_4\">명령어 결과를 변수에 — $(...)</a></li>\n<li><a href=\"#if-then-fi\">조건문 — if [[ ... ]]; then ... fi</a></li>\n<li><a href=\"#listen-ss\">포트 LISTEN 확인 — ss 와 폴백</a></li>\n<li><a href=\"#3\">방화벽 상태 — 3단 폴백</a></li>\n<li><a href=\"#cpu-top-idle\">CPU 측정 — top 의 idle 컬럼 찾기</a></li>\n<li><a href=\"#_5\">메모리 / 디스크 — 짧다</a></li>\n<li><a href=\"#bash\">임계값 — bash 가 소수 계산이 안 된다</a></li>\n<li><a href=\"#append\">로그 append + 로테이션</a></li>\n</ul>\n</li>\n<li><a href=\"#42-reportsh-awk\">4.2 report.sh — awk 한 덩어리 통계</a><ul>\n<li><a href=\"#awk-5\">awk 의 핵심 내장 변수 5 개</a></li>\n<li><a href=\"#match-substr\">match + substr — 정규식으로 일부 추출</a></li>\n<li><a href=\"#begin-end\">BEGIN / END 패턴</a></li>\n<li><a href=\"#awk-end\">awk 변수명에 END 를 못 쓰는 함정</a></li>\n<li><a href=\"#n-1-cpu0-cpu_max0\">n == 1 || cpu+0 &gt; cpu_max+0</a></li>\n</ul>\n</li>\n<li><a href=\"#43-archive_logssh-find-while\">4.3 archive_logs.sh — find + 안전한 while 루프</a><ul>\n<li><a href=\"#find\">find 옵션</a></li>\n<li><a href=\"#while-ifs-read-r-d-f-do-done\">while IFS= read -r -d '' f; do ... done &lt; &lt;(...)</a></li>\n<li><a href=\"#gzip\">gzip + 원본 삭제</a></li>\n</ul>\n</li>\n</ul>\n</li>\n<li><a href=\"#5-00_run_allsh-wrapper\">5. 00_run_all.sh — wrapper 의 작은 트릭</a></li>\n<li><a href=\"#55\">5.5 정규식 — 최소 생존 키트</a></li>\n<li><a href=\"#6\">6. 자주 헷갈리는 포인트 모음</a></li>\n<li><a href=\"#7\">7. 직접 실험해 보기 좋은 작은 예제</a></li>\n<li><a href=\"#8\">8. 학습 흐름 추천</a></li>\n</ul>\n</div>\n"}, {"title": "agent-app 리버스 엔지니어링", "file": "docs/md/agent-app_리버스엔지니어링.md", "html": "<h1 id=\"agent-app\"><code>agent-app</code> 리버스 엔지니어링 — 방법론과 단계별 분석<a class=\"headerlink\" href=\"#agent-app\" title=\"Permanent link\">#</a></h1>\n<blockquote>\n<p>본 문서는 미션의 <a href=\"../../bin/agent-app\">bin/agent-app</a> 바이너리를 <strong>정적 분석</strong> 하면서 \"어떤 도구로 무엇을 알아낼 수 있는가\" 를 단계별로 정리한 학습용 자료다.\n분석 도구: <a href=\"../../tools/analyze_binary.py\">tools/analyze_binary.py</a></p>\n</blockquote>\n<hr />\n<h2 id=\"0\">0. 들어가기 전에 — 윤리·법<a class=\"headerlink\" href=\"#0\" title=\"Permanent link\">#</a></h2>\n<h3 id=\"_1\">왜 리버스 엔지니어링을 배우나<a class=\"headerlink\" href=\"#_1\" title=\"Permanent link\">#</a></h3>\n<ul>\n<li><strong>운영 환경 이해</strong>: \"왜 22.04 에선 안 되고 24.04 에선 되나?\" 같은 질문에 추측이 아니라 근거로 답하려면.</li>\n<li><strong>사고 대응</strong>: 누군가 의심스러운 바이너리를 떨궜을 때 안에서 무슨 일이 벌어지는지 빠르게 판단.</li>\n<li><strong>호환성 디버깅</strong>: 닫힌 소스 도구가 특정 환경에서만 깨질 때 원인 파악.</li>\n<li><strong>보안 평가</strong>: 우리 제품의 바이너리가 얼마나 분석 저항성이 있나 자가 점검.</li>\n</ul>\n<h3 id=\"_2\">본 문서가 다루지 않는 것 (선)<a class=\"headerlink\" href=\"#_2\" title=\"Permanent link\">#</a></h3>\n<ul>\n<li>미션 채점 우회 · 라이센스 위반 · 재배포 — 모두 ❌</li>\n<li>동적 분석(실행하며 디버거 붙이기) — 본 문서는 <strong>정적 분석만</strong></li>\n<li>악의적 패치/재패키징</li>\n</ul>\n<h3 id=\"_3\">본 미션의 맥락<a class=\"headerlink\" href=\"#_3\" title=\"Permanent link\">#</a></h3>\n<p><code>bin/agent-app</code> 은 운영 측이 <strong>이미 제공</strong>한 산출물이고, 미션 학습자의 의무는 그것을 <strong>실행 환경 안에서 구동</strong>시키는 것이다. 따라서 본 분석은 \"어떻게 동작하는가 / 왜 24.04 가 필요한가\" 같은 <strong>이해 목적</strong> 이며, 본문에서 얻은 정보로 코드를 수정/재배포할 일은 없다.</p>\n<hr />\n<h2 id=\"1-layer-17\">1. 단계별 접근법 (Layer 1~7)<a class=\"headerlink\" href=\"#1-layer-17\" title=\"Permanent link\">#</a></h2>\n<p>리버스 엔지니어링은 양파처럼 <strong>표면 → 깊은 곳</strong> 순서로 까나가야 효율적이다. 한 층이 끝날 때마다 \"다음 층까지 가야 하는가?\" 를 묻고 충분하면 멈추는 게 정석.</p>\n<div class=\"codehilite\"><pre><span></span><code>Layer 1  파일이 뭐냐               ← file, hexdump\nLayer 2  ELF 구조                  ← readelf, pyelftools\nLayer 3  의존 라이브러리           ← readelf -d, ldd\nLayer 4  안에 든 문자열            ← strings, grep\nLayer 5  호출하는 API              ← readelf --dyn-syms, nm\nLayer 6  (PyInstaller 면) 아카이브 ← TOC 직접 파싱\nLayer 7  바이트코드 디컴파일       ← pyinstxtractor + uncompyle6\n</code></pre></div>\n\n<p>각 층마다 <strong>어떤 질문에 답하는가</strong> 가 명확해야 시간 낭비가 없다.</p>\n<hr />\n<h2 id=\"2-layer-1\">2. Layer 1 — 파일이 무엇인가<a class=\"headerlink\" href=\"#2-layer-1\" title=\"Permanent link\">#</a></h2>\n<h3 id=\"_4\">질문<a class=\"headerlink\" href=\"#_4\" title=\"Permanent link\">#</a></h3>\n<blockquote>\n<p>이게 ELF? Python 스크립트? Shell? 압축 파일?</p>\n</blockquote>\n<h3 id=\"_5\">도구<a class=\"headerlink\" href=\"#_5\" title=\"Permanent link\">#</a></h3>\n<ul>\n<li><code>file</code> — magic bytes 로 1차 분류</li>\n<li><code>xxd</code> / <code>hexdump</code> / Python <code>open(...).read(64)</code> — 헤더 직접 확인</li>\n</ul>\n<h3 id=\"_6\">실행<a class=\"headerlink\" href=\"#_6\" title=\"Permanent link\">#</a></h3>\n<div class=\"codehilite\"><pre><span></span><code>$<span class=\"w\"> </span>file<span class=\"w\"> </span>bin/agent-app\nbin/agent-app:<span class=\"w\"> </span>ELF<span class=\"w\"> </span><span class=\"m\">64</span>-bit<span class=\"w\"> </span>LSB<span class=\"w\"> </span>executable,<span class=\"w\"> </span>x86-64,<span class=\"w\"> </span>version<span class=\"w\"> </span><span class=\"m\">1</span><span class=\"w\"> </span><span class=\"o\">(</span>SYSV<span class=\"o\">)</span>,\n<span class=\"w\">               </span>dynamically<span class=\"w\"
